# ═══════════════════════════════════════════════════════════════════════════════
# VALEURS HEADLAMP — CE FICHIER EXISTE POUR DÉSARMER UN DÉFAUT DE LA CHARTE.
#
# `helm show values headlamp/headlamp` donne, tel quel :
#
#     clusterRoleBinding:
#       create: true
#       clusterRoleName: cluster-admin
#
# Installée sans ces valeurs, la console reçoit `cluster-admin` : elle peut TOUT
# faire sur le cluster, y compris lire les quatorze mots de passe de base du
# Secret `hba-platform`. C'est l'inverse exact de `acces-lecture.yaml`, qui lie le
# compte `console` au ClusterRole intégré `view` — lequel exclut délibérément les
# secrets.
#
# RIEN N'AVERTIT. L'installation réussit, la console s'ouvre, tout fonctionne. Le
# défaut ne se voit qu'en lisant les objets RBAC après coup.
# ═══════════════════════════════════════════════════════════════════════════════

# ── Le compte de service : le nôtre, pas celui de la charte ──────────────────
#
# `create: false` empêche la charte d'en fabriquer un ; `name: console` fait
# tourner le pod sous celui que `acces-lecture.yaml` a déjà posé dans
# `hba-outils`, et qui porte le droit de lecture.
#
# SI `acces-lecture.yaml` N'A PAS ÉTÉ APPLIQUÉ, le pod reste en attente sur un
# compte de service absent — et le message le dit clairement, ce qui est le bon
# échec.
serviceAccount:
  create: false
  name: console

# ── La liaison RBAC : aucune, la nôtre suffit ────────────────────────────────
#
# `create: false` — et non `clusterRoleName: view`, qui marcherait aussi.
#
# LA DIFFÉRENCE TIENT À QUI POSSÈDE LE DROIT. Avec `create: true`, la liaison
# appartient à Helm : elle est recréée à chaque `helm upgrade`, et une valeur
# oubliée lors d'une mise à jour la ramène silencieusement à `cluster-admin`.
# Avec `create: false`, le seul droit du compte vit dans `acces-lecture.yaml`,
# versionné, relisible, et qu'aucune mise à jour amont ne touche.
clusterRoleBinding:
  create: false

# ── Le jeton monté dans le pod ───────────────────────────────────────────────
#
# À laisser à `true` : c'est par ce jeton que Headlamp interroge l'API. Le mettre
# à `false` donnerait une console qui démarre et n'affiche rien.
automountServiceAccountToken: true

# ── L'exposition ─────────────────────────────────────────────────────────────
#
# `ClusterIP` explicitement, alors que c'est déjà le défaut de la charte : un
# défaut n'est pas une décision, et celui-ci peut changer d'une version à
# l'autre. L'accès se fait par `kubectl port-forward` — voir la règle en tête de
# `README.md`, aucune console n'est exposée.
service:
  type: ClusterIP
  port: 80

# ── Un seul exemplaire ───────────────────────────────────────────────────────
#
# Une console d'observation n'a pas besoin d'être disponible pendant une panne du
# nœud : si le nœud est tombé, il n'y a plus rien à observer. Le VPS de staging
# est déjà dimensionné au plus juste (voir le PDF de dimensionnement).
replicaCount: 1
