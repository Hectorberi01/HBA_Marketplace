# ═══════════════════════════════════════════════════════════════════════════════
# LES JOBS DE MIGRATION DE PRODUCTION.
#
#     kubectl apply -k k8s/overlays/migrations-prod
#
# SEPARE DE `overlays/prod` A DESSEIN. Inclure les Jobs dans le deploiement
# ferait tourner une migration a chaque `apply -k` — donc a chaque changement de
# configuration sans rapport. Une migration se declenche, elle ne se subit pas.
#
# UN JOB TERMINE NE SE RELANCE PAS. Rejouer une migration demande de supprimer le
# Job d'abord :
#
#     kubectl -n hba-prod delete job -l app.kubernetes.io/component=migration
#
# LES IMAGES DOIVENT ETRE CELLES DE `overlays/prod`. Migrer avec une image plus
# ancienne que celle qui servira applique un schema en retard sur le code : le
# service demarre et echoue sur une colonne absente, loin de la cause.
# `scripts/check-k8s.py` verifie cet accord.
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hba-prod

resources:
  - ../../base/migrations

  # ════════════════════════════════════════════════════════════════════════
  # LA ConfigMap `hba-platform` — SANS ELLE, LES DIX-HUIT JOBS NE DEMARRENT PAS.
  #
  # CE CALQUE DEPENDAIT D'UN OBJET QU'IL NE CREAIT PAS.
  #
  # Chaque `job.yaml` monte `envFrom: configMapRef: name: hba-platform`. Cette
  # ConfigMap vit dans `base/common`, que seul `overlays/prod` tire — et qui
  # s'applique APRES les migrations. Le calque est pourtant documente comme
  # « applique SEUL, avant les services » : la dependance existait, et rien ne
  # la portait.
  #
  # LE SYMPTOME NE NOMME PAS LA CAUSE. Les pods restent en
  # `CreateContainerConfigError` — un message qui parle de « configuration de
  # conteneur » sans dire QUELLE reference manque ; il faut un
  # `kubectl describe pod` pour lire « configmap "hba-platform" not found ».
  # C'est exactement ce qui s'est produit au premier deploiement de production,
  # le 1er septembre 2026 : dix-huit Jobs bloques huit minutes, et le
  # `kubectl wait` qui expire sans rien expliquer.
  #
  # LES SECRETS NE SONT PAS CONCERNES : `base/common/kustomization.yaml` ne
  # reference que `configmap.yaml`, les quatre Secrets y sont commentes et poses
  # par `kubectl` (§12). Tirer ce repertoire n'ajoute donc que la ConfigMap.
  #
  # APPLIQUER DEUX FOIS LE MEME OBJET N'EST PAS UN CONFLIT : `overlays/prod`
  # posera la meme ConfigMap ensuite, et `apply` est idempotent.
  # ════════════════════════════════════════════════════════════════════════
  - ../../base/common

# LE MEME PATCH QUE `overlays/prod`, ET POUR NE PAS DIVERGER.
#
# Sans lui, la ConfigMap posee ici porterait la valeur de base — vide — puis
# `overlays/prod` la corrigerait quelques minutes plus tard. Entre les deux, un
# pod qui la lirait aurait un endpoint vide. Les Jobs de migration s'en
# moquent (ils sortent avant `app.Run()`), mais laisser deux calques poser le
# MEME objet avec des valeurs DIFFERENTES est precisement ce qui rend un
# `apply` non reproductible selon l'ordre ou on le joue.
patches:
  - target:
      kind: ConfigMap
      name: hba-platform
    patch: |-
      - op: replace
        path: /data/OPENTELEMETRY__ENDPOINT
        value: http://otel-collector:4317

