  # LE DOMAINE EST PROPRE À L'ENVIRONNEMENT (§2).
  #
  # Les trois overlays ne doivent JAMAIS pointer le même hôte : le §2 exige des
  # namespaces, secrets, bases et buckets distincts, et un domaine partagé
  # ferait entrer du trafic de production dans un cluster de validation sans que
  # personne s'en aperçoive avant les journaux.
  #
  # `.example` est un domaine réservé (RFC 2606) : il ne résoudra jamais. C'était
  # délibéré — un placeholder qui résout est un placeholder qu'on oublie de
  # remplacer. Il a tenu son rôle : c'est en posant l'enregistrement DNS que le
  # placeholder s'est vu, et pas au premier appel en production.
  #
  # RENSEIGNÉ LE 29 AOÛT 2026 :
  #
  #   api.hba-express.com.  A  79.137.35.129
  #
  # 79.137.35.129 est le VPS de production, distinct du VPS de staging
  # (193.168.145.162) — le §2 l'exige. La base reste sur son propre serveur,
  # joignable par le tunnel en 10.20.0.2, et n'entre dans aucun inventaire.
  #
  # CE QUE CE CHANGEMENT NE COUVRE PAS. Il ne fait que déclarer l'hôte à
  # l'Ingress. Le certificat TLS est une autre affaire : `spec/tls/0/hosts/0`
  # nomme le même hôte, mais c'est cert-manager qui doit l'émettre, et il ne
  # pourra le faire qu'une fois le DNS propagé ET le contrôleur d'Ingress
  # joignable en 80 depuis l'extérieur. Tant que ce n'est pas le cas, l'Ingress
  # existe et répond sans certificat valide.
  - target:
      kind: Ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: api.hba-express.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: api.hba-express.com

# ═══════════════════════════════════════════════════════════════════════════════
# LE TAG EST UN PLACEHOLDER DE PROMOTION, ET IL DOIT LE RESTER.
#
# Le §13 interdit `latest` et impose une image immuable identifiée par SHA ou
# semver. La promotion pose le tag (`kustomize edit set image`) au lieu de
# reconstruire — un tag mouvant committé ici ferait d'un `kubectl apply` rejoué un
# déploiement différent du précédent.
#
# LES SIX NOMS PÉRIMÉS ONT ÉTÉ REMPLACÉS. Ils ne correspondaient à aucun
# conteneur, Kustomize les ignorait sans rien dire, et les six services renommés
# repartaient donc en `hba/<nom>:latest` — c'est ce que `check-k8s.py` a signalé
# dès la première construction après le renommage.
# ═══════════════════════════════════════════════════════════════════════════════
# LE CHEMIN VIENT DE LA CI, PAS D'UNE CONVENTION INVENTÉE ICI.
#
# `ci.yml` publie sous `ghcr.io/<propriétaire>/<service>:<sha>` — sans segment
# intermédiaire. Une première version de ce bloc portait `ghcr.io/…/hba/<service>`
# et un propriétaire déduit d'une adresse e-mail : deux chemins qui n'existent
# nulle part. Les huit pods seraient partis en `ImagePullBackOff` sur un
# « denied », qui se lit comme un problème de droits et non comme un chemin faux.
#
# LE PROPRIÉTAIRE EST EN MINUSCULES. La grammaire OCI l'impose ; `Hectorberi01`
# est refusé par docker avant même d'atteindre le registre.
#
# LE TAG `staging` EST MOUVANT, ET C'EST ASSUMÉ ICI. Le §13 impose l'immuabilité
# en PRODUCTION, où `cd.yml` pose le SHA d'une image déjà validée. En staging on
# republie sous le même tag à chaque intégration — d'où le `imagePullPolicy:
# Always` ci-dessus, sans lequel kubelet réutiliserait la couche déjà présente.
# ═══════════════════════════════════════════════════════════════════════════════
images:
