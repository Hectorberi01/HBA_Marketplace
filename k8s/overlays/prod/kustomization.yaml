apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ═══════════════════════════════════════════════════════════════════════════════
# PRODUCTION — utilisateurs réels, promotion contrôlée et rollback (§2).
#
# LE TAG N'EST PAS ÉCRIT ICI À LA MAIN.
#
# Le 13 interdit `latest` en production et impose des images immuables
# identifiées par SHA ou semver. Le `newTag` ci-dessous est un PLACEHOLDER que la
# promotion remplace — `kustomize edit set image`, ou l'écriture du SHA par la
# chaîne de release. Committer un tag mouvant ici ferait d'un `kubectl apply`
# rejoué un déploiement différent du précédent, ce qui est exactement ce que le
# §25 appelle « non reproductible ».
#
# LES REPLICAS SUIVENT LA CRITICITÉ DU §4, PAS UNE VALEUR UNIQUE.
#
# Dix services critiques passent à 2 ; les quatre secondaires — media,
# communication, engagement, promotion — restent à 1 et montent par le HPA. Le
# PDB `minAvailable: 1` prend alors son sens : un drain de nœud ne peut plus
# emporter les deux pods d'un service critique en même temps.
# ═══════════════════════════════════════════════════════════════════════════════
namespace: hba-prod

resources:
  - ../../base
  - kafka-topics.yaml

patches:
  - target:
      kind: Namespace
      name: hba
    patch: |-
      - op: replace
        path: /metadata/name
        value: hba-prod

  # ═══════════════════════════════════════════════════════════════════════
  # L'ADRESSE DE LA BASE — CE PATCH MANQUAIT, ET RIEN NE L'AURAIT DIT.
  #
  # `network-policies.yaml` n'autorise l'egress 5432 que vers `10.0.0.1/32`,
  # l'adresse du tunnel de STAGING. Le calque staging la remplace ; celui de
  # production, non. La production serait donc partie avec la politique de
  # staging, et treize services auraient tenté de joindre une base qui n'est pas
  # la leur.
  #
  # ET LE SYMPTÔME N'AURAIT DÉSIGNÉ PERSONNE. Une NetworkPolicy qui refuse ne
  # rend pas d'erreur : elle laisse le paquet partir et jamais revenir. Les pods
  # seraient restés en `CrashLoopBackOff` sur un DÉLAI D'ATTENTE de connexion —
  # le même symptôme qu'un mot de passe faux, qu'un `pg_hba` mal réglé, qu'un
  # nftables trop strict. On aurait vérifié les trois, et tout y aurait été
  # correct.
  #
  # `/spec/egress/1/to/0/ipBlock/cidr` — l'index 1 est la règle base de données,
  # l'index 0 étant le DNS. Un `replace` sur un index absent ÉCHOUE au build, ce
  # qui est le bon comportement : mieux vaut un build cassé qu'une politique
  # posée au mauvais endroit.
  # ═══════════════════════════════════════════════════════════════════════
  - target:
      kind: NetworkPolicy
      name: allow-intra-namespace
    patch: |-
      - op: replace
        path: /spec/egress/1/to/0/ipBlock/cidr
        value: 10.20.0.2/32

  # ═══════════════════════════════════════════════════════════════════════
  # CINQ DE CES PATCHES NE DÉSIGNAIENT RIEN — LIRE AVANT D'EN AJOUTER UN.
  #
  # Ce bloc en comptait DIX. Cinq visaient des noms que la base ne produit pas,
  # et kustomize les appliquait donc à RIEN, sans erreur ni avertissement :
  #
  #   commerce-service   → la base produit `cart-service`
  #   financial-service  → la base produit `payment-service`
  #   merchant-service   → la base produit `seller-service`
  #   delivery-service   → pas dans le lot déployé
  #   food-service       → pas dans le lot déployé
  #
  # LES TROIS PREMIERS SONT LE MÊME DÉFAUT, ET IL A UNE CAUSE CONNUE : la
  # plateforme porte DEUX vocabulaires. Les modules se nomment par domaine —
  # commerce, financial, merchant — et les dossiers de déploiement par dépôt —
  # cart, payment, seller. `InternalRoutes.cs` documente cet écart depuis des
  # semaines ; il a fini par produire cinq patches morts, dans le fichier qui
  # décide combien de pods servent la production.
  #
  # Les deux derniers ont été RETIRÉS plutôt que corrigés : `delivery` et `food`
  # font l'objet d'un second lot et n'ont aucun manifeste. Quand ce lot arrivera,
  # il faudra rajouter leurs deux patches ICI, avec le nom que produira
  # réellement leur `namePrefix` — pas celui du domaine.
  #
  # `scripts/check-k8s.py` refuse désormais toute cible sans correspondance, et
  # il le fait SANS kustomize : c'est ce qui a permis de trouver ceci.
  # ═══════════════════════════════════════════════════════════════════════

  # ═══════════════════════════════════════════════════════════════════════
  # SERVICE CRITIQUE (§4) : DEUX REPLICAS AU REPOS — LES DEUX CORRECTIFS.
  #
  # `spec.replicas` NE SUFFIT PAS, ET SEUL NE SERVAIT À RIEN.
  #
  # Dès qu'un HorizontalPodAutoscaler cible un Deployment, c'est LUI qui écrit
  # `spec.replicas` à chaque réconciliation. La valeur posée ici n'est donc que
  # le point de départ du tout premier déploiement : quelques minutes plus tard,
  # sous faible charge, le HPA ramenait le service à `minReplicas`, qui vaut 1
  # dans le gabarit de base. La redondance était ÉCRITE et jamais OBTENUE — un
  # seul pod pour dix services critiques, sans que rien ne le signale.
  #
  # Le patch du HPA ci-dessous est donc le correctif RÉEL ; celui du Deployment
  # le seconde, pour que le premier lancement parte déjà à deux et non à un.
  # Les deux sont volontairement COLLÉS : les séparer laisserait un jour ajouter
  # un service à l'un des deux endroits seulement.
  # ═══════════════════════════════════════════════════════════════════════
  - target:
      kind: Deployment
      name: catalog-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: HorizontalPodAutoscaler
      name: catalog-service
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
