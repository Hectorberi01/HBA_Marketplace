apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ═══════════════════════════════════════════════════════════════════════════════
# DEVELOPMENT — intégration continue des branches, données non sensibles (§2).
#
# Un replica partout, ressources basses : cet environnement sert à savoir si ça
# démarre et si les contrats tiennent, pas à mesurer une capacité.
# ═══════════════════════════════════════════════════════════════════════════════
namespace: hba-dev

resources:
  - ../../base
  - kafka-topics.yaml

patches:
  - target:
      kind: Namespace
      name: hba
    patch: |-
      - op: replace
        path: /metadata/name
        value: hba-dev

  # `ASPNETCORE_ENVIRONMENT=Development` ACTIVE LES MIGRATIONS AU DÉMARRAGE.
  #
  # `Database:MigrateOnStartup` n'est vrai qu'en Development. C'est ce qui rend
  # cet environnement jetable : on supprime le namespace, on redéploie, le schéma
  # se reconstruit. En staging et en production, la migration est une étape de
  # release (§15), pas un effet de bord du démarrage.
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: unused
      spec:
        template:
          spec:
            containers:
              - name: service
                env:
                  - name: ASPNETCORE_ENVIRONMENT
                    value: Development
                resources:
                  requests:
                    cpu: "50m"
                    memory: "192Mi"
                  limits:
                    cpu: "500m"
                    memory: "512Mi"

  # Le HPA n'a pas de sens ici : un seul nœud, et une charge qui vient des tests.
  - target:
      kind: HorizontalPodAutoscaler
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 1

  # Dev reste volontairement sans collecteur OTLP : le ConfigMap garde
  # `OPENTELEMETRY__ENDPOINT` vide, donc déployer un collecteur ici consommerait
  # des ressources sans recevoir de trafic. On supprime surtout un effet de bord :
  # le patch générique `ASPNETCORE_ENVIRONMENT=Development` ci-dessus réécrit les
  # conteneurs de tous les Deployments et casse celui du collecteur.
  - target:
      kind: Deployment
      name: otel-collector
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: otel-collector
      $patch: delete
  - target:
      kind: Service
      name: otel-collector
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: otel-collector
      $patch: delete
  - target:
      kind: ConfigMap
      name: otel-collector-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: otel-collector-config
      $patch: delete
  - target:
      kind: NetworkPolicy
      name: allow-otel-collector-ingress
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-otel-collector-ingress
      $patch: delete

  # La passerelle redescend à un replica ici. Le §4 la place à 2-3 parce qu'un
  # redémarrage coupe TOUT — mais en dev, « tout » vaut une branche en cours
  # d'intégration, et le second pod coûte un nœud déjà étroit.
  - target:
      kind: Deployment
      name: gateway-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  # UNE SEULE INSTANCE POSTGRES ET UN SEUL BROKER ICI.
  #
  # Le §4 place staging à « 1 broker dev » et une instance de base. La haute
  # disponibilité y coûterait quatre nœuds pour une propriété que personne n'y
  # observe — et la seule façon de l'observer serait de tuer une instance, ce
  # qu'on ne fait pas dans un environnement d'intégration.
  #
  # Conséquence à connaître : `min.insync.replicas: 1` en dessous. Avec la valeur
  # de production (2) et un seul broker, TOUTE écriture Kafka bloquerait — le
  # cluster refuserait d'acquitter faute d'une seconde copie. Les services
  # démarreraient, et le premier événement publié resterait en attente.
  # ═══════════════════════════════════════════════════════════════════════
  # LE PATCH `Cluster/postgres` A ÉTÉ RETIRÉ : IL NE DÉSIGNAIT RIEN.
  #
  # Il posait `/spec/instances: 1` sur un `kind: Cluster` nommé `postgres` —
  # une base gérée par CloudNativePG. Aucun objet de ce genre n'existe dans
  # `k8s/base` : `grep -rn 'kind: Cluster' k8s/` ne rend que ce patch lui-même.
  #
  # ET CE N'EST PAS UNE ERREUR QUI SE VOIT. Kustomize n'échoue PAS sur une cible
  # sans correspondance : le build réussit, le patch n'est appliqué à rien, et la
  # sortie est identique à celle d'un patch qui a mordu. Le dépôt affichait donc
  # une base à une instance là où il n'y a aucune base.
  #
  # La base de staging vit SUR L'HÔTE, installée par apt, hors du cluster — c'est
  # la décision prise le 27 août, et `RUNBOOK-STAGING.md` la déroule. Ce patch
  # était un reste du plan abandonné d'une base dans le cluster.
  #
  # le contrôle `k8s` refuse désormais toute cible de patch sans
  # correspondance, sans avoir besoin de kustomize.
  # ═══════════════════════════════════════════════════════════════════════

  # LE POOL DESCEND À 1 BROKER, EN MÊME TEMPS QUE LES FACTEURS CI-DESSUS.
  #
  # Les deux réglages sont appariés : `default.replication.factor: 1` sur un
  # pool resté à 3 gâcherait deux machines, et un pool à 1 avec un facteur 3
  # laisserait tous les topics sous-répliqués — les partitions restent alors
  # sans leader, et les producteurs bloquent sans message qui nomme la cause.
  - target:
      kind: KafkaNodePool
      name: broker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  - target:
      kind: Kafka
      name: kafka
    patch: |-
      - op: replace
        path: /spec/kafka/config/default.replication.factor
        value: 1
      - op: replace
        path: /spec/kafka/config/min.insync.replicas
        value: 1
      - op: replace
        path: /spec/kafka/config/offsets.topic.replication.factor
        value: 1
      - op: replace
        path: /spec/kafka/config/transaction.state.log.replication.factor
        value: 1
      - op: replace
        path: /spec/kafka/config/transaction.state.log.min.isr
        value: 1

  # LE DOMAINE EST PROPRE À L'ENVIRONNEMENT (§2).
  #
  # Les trois overlays ne doivent JAMAIS pointer le même hôte : le §2 exige des
  # namespaces, secrets, bases et buckets distincts, et un domaine partagé
  # ferait entrer du trafic de production dans un cluster de validation sans que
  # personne s'en aperçoive avant les journaux.
  #
  # `.example` est un domaine réservé (RFC 2606) : il ne résoudra jamais. C'est
  # délibéré — un placeholder qui résout est un placeholder qu'on oublie de
  # remplacer.
  - target:
      kind: Ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: api.dev.hba-express.example
      - op: replace
        path: /spec/tls/0/hosts/0
        value: api.dev.hba-express.example

# ═══════════════════════════════════════════════════════════════════════════════
# MÊME REGISTRE QU'EN STAGING, ET LES SIX NOMS PÉRIMÉS SONT PARTIS.
#
# Cette liste nommait `commerce-service`, `communication-service`,
# `engagement-service`, `financial-service`, `food-service` et
# `merchant-service` — six images que le dépôt ne construit plus. Kustomize ne
# s'en plaint pas : une entrée `images` qui ne correspond à aucun conteneur est
# ignorée en silence. Les six Deployments renommés seraient donc partis en
# `latest`, sans registre.
# ═══════════════════════════════════════════════════════════════════════════════
# LE CHEMIN VIENT DE LA CI, PAS D'UNE CONVENTION INVENTÉE ICI.
#
# `ci.yml` publie sous `ghcr.io/<propriétaire>/<service>:<sha>` — sans segment
# intermédiaire. Une première version de ce bloc portait `ghcr.io/…/hba/<service>`
# et un propriétaire déduit d'une adresse e-mail : deux chemins qui n'existent
# nulle part. Les huit pods seraient partis en `ImagePullBackOff` sur un
# « denied », qui se lit comme un problème de droits et non comme un chemin faux.
#
# LE PROPRIÉTAIRE EST EN MINUSCULES. La grammaire OCI l'impose ; `Hectorberi01`
# est refusé par docker avant même d'atteindre le registre.
#
# LE TAG `staging` EST MOUVANT, ET C'EST ASSUMÉ ICI. Le §13 impose l'immuabilité
# en PRODUCTION, où `cd.yml` pose le SHA d'une image déjà validée. En staging on
# republie sous le même tag à chaque intégration — d'où le `imagePullPolicy:
# Always` ci-dessus, sans lequel kubelet réutiliserait la couche déjà présente.
# ═══════════════════════════════════════════════════════════════════════════════
# ═══════════════════════════════════════════════════════════════════════════════
# LE TAG EST `main`, PARCE QUE C'EST CE QUE LA CI PUBLIE.
#
# `ci.yml` pose DEUX tags sur chaque poussée vers `main` : le SHA du commit, et
# `main`. Rien d'autre. Cet overlay portait `newTag: "staging"` — un tag que rien
# ne produit : les huit pods auraient cherché une image inexistante et le message,
# « denied », se lit comme un problème de droits.
#
# `main` SUIT LA BRANCHE, ET C'EST CE QU'ON VEUT D'UN STAGING. Chaque intégration
# republie sous ce tag ; `imagePullPolicy: Always` (posé plus bas) fait qu'un
# `kubectl rollout restart` tire réellement la nouvelle couche. Sans lui, kubelet
# réutiliserait celle du nœud et annoncerait un déploiement réussi de l'ANCIENNE
# image.
#
# LA PRODUCTION NE FAIT PAS CELA. Son overlay garde un placeholder de promotion :
# `cd.yml` y écrit le SHA d'une image qui a déjà tourné ici. Le §13 veut une image
# immuable, et un tag mouvant en production rendrait le rollback sans objet.
# ═══════════════════════════════════════════════════════════════════════════════
images:
  - name: hba/identity-service
    newName: ghcr.io/hectorberi01/identity-service
    newTag: "main"
  - name: hba/user-service
    newName: ghcr.io/hectorberi01/user-service
    newTag: "main"
  - name: hba/media-service
    newName: ghcr.io/hectorberi01/media-service
    newTag: "main"
  - name: hba/notification-service
    newName: ghcr.io/hectorberi01/notification-service
    newTag: "main"
  - name: hba/payment-service
    newName: ghcr.io/hectorberi01/payment-service
    newTag: "main"
  - name: hba/promotion-service
    newName: ghcr.io/hectorberi01/promotion-service
    newTag: "main"
  - name: hba/review-service
    newName: ghcr.io/hectorberi01/review-service
    newTag: "main"
  - name: hba/catalog-service
    newName: ghcr.io/hectorberi01/catalog-service
    newTag: "main"
  - name: hba/cart-service
    newName: ghcr.io/hectorberi01/cart-service
    newTag: "main"
  - name: hba/inventory-service
    newName: ghcr.io/hectorberi01/inventory-service
    newTag: "main"
  - name: hba/order-service
    newName: ghcr.io/hectorberi01/order-service
    newTag: "main"
  - name: hba/seller-service
    newName: ghcr.io/hectorberi01/seller-service
    newTag: "main"
  - name: hba/return-refund-service
    newName: ghcr.io/hectorberi01/return-refund-service
    newTag: "main"
  - name: hba/api-gateway
    newName: ghcr.io/hectorberi01/api-gateway
    newTag: "main"
