apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ═══════════════════════════════════════════════════════════════════════════════
# STAGING — validation pré-production, E2E, charge ; données ANONYMISÉES (§2).
#
# IL RESSEMBLE À LA PRODUCTION SANS EN AVOIR LE COÛT, ET C'EST LE PIÈGE.
#
# Un seul replica par service tient le §4 (« staging : 1 »), mais il rend
# invisible tout ce qui ne casse qu'à plusieurs : une affinité de session
# oubliée, un verrou pris en mémoire au lieu de Redis, un consommateur Kafka qui
# suppose être seul sur sa partition. Ces défauts-là se découvrent en production.
#
# D'où le PDB conservé et le HPA actif à 2 : le second pod n'existe pas au repos,
# mais un test de charge le fait apparaître — et c'est là qu'on veut le découvrir.
# ═══════════════════════════════════════════════════════════════════════════════
namespace: hba-staging

resources:
  - ../../base
  - kafka-topics.yaml

patches:
  - target:
      kind: Namespace
      name: hba
    patch: |-
      - op: replace
        path: /metadata/name
        value: hba-staging

  - target:
      kind: HorizontalPodAutoscaler
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 2

  # UNE SEULE INSTANCE POSTGRES ET UN SEUL BROKER ICI.
  #
  # Le §4 place staging à « 1 broker dev » et une instance de base. La haute
  # disponibilité y coûterait quatre nœuds pour une propriété que personne n'y
  # observe — et la seule façon de l'observer serait de tuer une instance, ce
  # qu'on ne fait pas dans un environnement d'intégration.
  #
  # Conséquence à connaître : `min.insync.replicas: 1` en dessous. Avec la valeur
  # de production (2) et un seul broker, TOUTE écriture Kafka bloquerait — le
  # cluster refuserait d'acquitter faute d'une seconde copie. Les services
  # démarreraient, et le premier événement publié resterait en attente.
  # ═══════════════════════════════════════════════════════════════════════
  # LE PATCH `Cluster/postgres` A ÉTÉ RETIRÉ : IL NE DÉSIGNAIT RIEN.
  #
  # Il posait `/spec/instances: 1` sur un `kind: Cluster` nommé `postgres` —
  # une base gérée par CloudNativePG. Aucun objet de ce genre n'existe dans
  # `k8s/base` : `grep -rn 'kind: Cluster' k8s/` ne rend que ce patch lui-même.
  #
  # ET CE N'EST PAS UNE ERREUR QUI SE VOIT. Kustomize n'échoue PAS sur une cible
  # sans correspondance : le build réussit, le patch n'est appliqué à rien, et la
  # sortie est identique à celle d'un patch qui a mordu. Le dépôt affichait donc
  # une base à une instance là où il n'y a aucune base.
  #
  # La base de staging vit SUR L'HÔTE, installée par apt, hors du cluster — c'est
  # la décision prise le 27 août, et `RUNBOOK-STAGING.md` la déroule. Ce patch
  # était un reste du plan abandonné d'une base dans le cluster.
  #
  # le contrôle `k8s` refuse désormais toute cible de patch sans
  # correspondance, sans avoir besoin de kustomize.
  # ═══════════════════════════════════════════════════════════════════════

  # LE POOL DESCEND À 1 BROKER, EN MÊME TEMPS QUE LES FACTEURS CI-DESSUS.
  #
  # Les deux réglages sont appariés : `default.replication.factor: 1` sur un
  # pool resté à 3 gâcherait deux machines, et un pool à 1 avec un facteur 3
  # laisserait tous les topics sous-répliqués — les partitions restent alors
  # sans leader, et les producteurs bloquent sans message qui nomme la cause.
  - target:
      kind: KafkaNodePool
      name: broker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  - target:
      kind: Kafka
      name: kafka
    patch: |-
      - op: replace
        path: /spec/kafka/config/default.replication.factor
        value: 1
      - op: replace
        path: /spec/kafka/config/min.insync.replicas
        value: 1
      - op: replace
        path: /spec/kafka/config/offsets.topic.replication.factor
        value: 1
      - op: replace
        path: /spec/kafka/config/transaction.state.log.replication.factor
        value: 1
      - op: replace
        path: /spec/kafka/config/transaction.state.log.min.isr
        value: 1

  # LE DOMAINE EST PROPRE À L'ENVIRONNEMENT (§2).
  #
  # Les trois overlays ne doivent JAMAIS pointer le même hôte : le §2 exige des
  # namespaces, secrets, bases et buckets distincts, et un domaine partagé
  # ferait entrer du trafic de production dans un cluster de validation sans que
  # personne s'en aperçoive avant les journaux.
  #
  # LE PLACEHOLDER `.example` A ÉTÉ REMPLACÉ PAR LE VRAI NOM.
  #
  # Il valait `api.staging.hba-express.example` — domaine réservé RFC 2606, qui
  # ne résout jamais. C'était délibéré : un placeholder qui résout est un
  # placeholder qu'on oublie de remplacer. `check-k8s.py` le signalait à chaque
  # passage, et c'est ce signal qui a fini par le faire remplacer.
  #
  # UN ENREGISTREMENT A DOIT EXISTER AVANT LE PREMIER `apply`.
  #
  #   backendapi.marketplace-staging.hba-marketplace.fr.  A  193.168.145.162
  #
  # cert-manager valide par challenge HTTP-01 : il fait résoudre ce nom et
  # attend une réponse sur le port 80 du cluster. Sans l'enregistrement, le
  # Certificate reste `READY=False` et l'Ingress sert un certificat auto-signé.
  # Le symptôme côté client est une erreur TLS, pas une erreur DNS — et le
  # diagnostic part vers cert-manager au lieu de la zone.
  #
  # `dev` et `prod` gardent leurs placeholders `.example` : leurs domaines ne
  # sont pas arrêtés, et les remplacer par des noms inventés ferait exactement
  # ce que le placeholder est là pour empêcher.
  # ═══════════════════════════════════════════════════════════════════════════
  # EN STAGING, LA BASE EST SUR LA MACHINE ELLE-MÊME.
  #
  # La base porte `10.0.0.1/32` — l'adresse du tunnel vers 51.255.40.214, qui
  # reste la topologie de PRODUCTION. Le staging, lui, fait tourner PostgreSQL
  # sur le VPS applicatif depuis le 27 août : le tunnel n'est pas sur son chemin.
  #
  # SANS CE PATCH, RIEN N'ÉCHOUERAIT AU DÉPLOIEMENT. Les pods démarreraient, et
  # chaque connexion à la base EXPIRERAIT — le CNI jette le paquet vers une
  # adresse qu'aucune règle n'autorise, il ne le rejette pas. Le diagnostic
  # partirait vers nftables et pg_hba, où tout serait correct.
  #
  # `/32` SUR L'IP DU NŒUD. Un pod qui joint la base vise l'adresse de sa propre
  # machine ; c'est cette adresse-là que la politique doit autoriser, et elle
  # seule. Le port reste 5432 : ouvrir tout l'egress vers le nœud donnerait à
  # n'importe quel conteneur du namespace un accès à `kubelet` sur 10250 et à
  # l'API sur 6443.
  #
  # SI L'IP DU VPS CHANGE, TROIS ENDROITS BOUGENT ENSEMBLE : ici, l'inventaire
  # Ansible (`ip_privee`, qui alimente aussi la règle nftables), et les chaînes
  # de connexion du Secret. En oublier un donne un délai d'attente, pas un refus.
  # ═══════════════════════════════════════════════════════════════════════════
  - target:
      kind: NetworkPolicy
      name: allow-intra-namespace
    patch: |-
      - op: replace
        path: /spec/egress/1/to/0/ipBlock/cidr
        value: 193.168.145.162/32

  - target:
      kind: ConfigMap
      name: hba-platform
    patch: |-
      - op: replace
        path: /data/OPENTELEMETRY__ENDPOINT
        value: http://otel-collector:4317

  - target:
      kind: Ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: backendapi.marketplace-staging.hba-marketplace.fr
      - op: replace
        path: /spec/tls/0/hosts/0
        value: backendapi.marketplace-staging.hba-marketplace.fr

  # ═══════════════════════════════════════════════════════════════════════════
  # UN TAG MOUVANT EXIGE `Always`, SINON LE DÉPLOIEMENT NE DÉPLOIE RIEN.
  #
  # CE CORRECTIF A DÉJÀ DISPARU UNE FOIS, avalé par une réécriture du bloc
  # `images:` — et le rendu construit l'a montré là où une relecture du fichier
  # ne l'aurait pas vu.
  #
  # Le gabarit porte `imagePullPolicy: IfNotPresent`, correct pour un tag
  # immuable, faux pour `main`. Republier puis relancer les pods laisserait
  # kubelet réutiliser la couche déjà sur le nœud : `kubectl rollout restart`
  # annoncerait « successfully rolled out » en redémarrant l'ANCIENNE image.
  # C'est le défaut qui fait chercher un bogue déjà corrigé.
  # ═══════════════════════════════════════════════════════════════════════════
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

# ═══════════════════════════════════════════════════════════════════════════════
# LE CHEMIN ET LE TAG VIENNENT DE LA CI, PAS D'UNE CONVENTION INVENTÉE ICI.
#
# `ci.yml` publie sous `ghcr.io/<propriétaire>/<service>`, avec DEUX tags à chaque
# poussée sur `main` : le SHA du commit, et `main`. Rien d'autre.
#
# DEUX CHEMINS FAUX ONT ÉTÉ CORRIGÉS ICI, ET AUCUN N'AURAIT ÉTÉ LISIBLE :
#   • un segment `hba/` inventé, que la CI ne pousse nulle part ;
#   • un propriétaire déduit d'une adresse e-mail, au lieu du compte GitHub réel ;
#   • un tag `staging` que rien ne produit.
# Les huit pods seraient partis en `ImagePullBackOff` sur un « denied » — message
# qui se lit comme un problème de droits, jamais comme un chemin inexistant.
#
# LE PROPRIÉTAIRE EST EN MINUSCULES : la grammaire OCI l'impose, et docker refuse
# `Hectorberi01` avant même d'atteindre le registre.
#
# `main` SUIT LA BRANCHE, ET C'EST CE QU'ON VEUT D'UN STAGING. La production, elle,
# garde un placeholder que `cd.yml` remplace par le SHA d'une image ayant déjà
# tourné ici — le §13 veut une image immuable, et un tag mouvant y rendrait le
# rollback sans objet.
# ═══════════════════════════════════════════════════════════════════════════════
images:
  - name: hba/identity-service
    newName: ghcr.io/hectorberi01/identity-service
    newTag: "main"
  - name: hba/user-service
