apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ═══════════════════════════════════════════════════════════════════════════════
# LA PASSERELLE — LE SEUL POINT D'ENTRÉE PUBLIC (§1, §6).
#
# Elle reprend le gabarit `../../services/_service` pour tout ce qui est commun :
# sondes, SecurityContext non-root, requests/limits, PDB, HPA. Ce qui la
# distingue tient dans les patches ci-dessous, et chacun a une raison.
#
# ELLE N'EXPOSE PAS DE PORT gRPC, ET LE LAISSER SERAIT PIRE QU'INUTILE.
#
# La passerelle proxifie du REST ; elle n'héberge aucun service gRPC. Un Service
# qui publierait 9090 vers un conteneur où rien n'écoute rendrait des connexions
# refusées — que l'on imputerait au service visé, pas à un port fantôme.
# ═══════════════════════════════════════════════════════════════════════════════

namePrefix: gateway-

# ═══════════════════════════════════════════════════════════════════════════════
# `labels` ET NON `commonLabels` — ET LA DIFFÉRENCE N'EST PAS COSMÉTIQUE.
#
# Kustomize déprécie `commonLabels`. Le remplacer naïvement par `labels:` CASSE
# ce dossier en silence.
#
# `commonLabels` faisait DEUX choses : poser les étiquettes, ET les injecter dans
# les SÉLECTEURS. `labels:` seul ne fait que la première.
#
# Or le gabarit `_service` porte le sélecteur littéral
# `app.kubernetes.io/name: service` — le même dans les sept services. C'est
# exactement cette injection qui les distingue.
#
# SANS `includeSelectors: true`, LES SEPT DEPLOYMENTS PARTAGERAIENT UN SÉLECTEUR
# IDENTIQUE : chacun adopterait les pods des autres, et le Service d'identity
# répartirait le trafic vers les pods de payment. Tout répondrait — avec le
# mauvais service. Aucune erreur, aucun pod en échec.
#
# `hba.express/domaine` est dans un SECOND bloc, sans injection : c'est une
# étiquette descriptive, elle n'a rien à faire dans un sélecteur. `commonLabels`
# l'y mettait faute de pouvoir distinguer les deux.
#
# ATTENTION SI LE CLUSTER TOURNE DÉJÀ : `spec.selector` d'un Deployment est
# IMMUABLE. Modifier ces étiquettes sur un déploiement existant fait échouer
# `kubectl apply` — il faut alors supprimer le Deployment avant de réappliquer.
# ═══════════════════════════════════════════════════════════════════════════════
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: api-gateway

resources:
  - ../../services/_service
  - ingress.yaml

images:
  - name: hba/service
    newName: hba/api-gateway

patches:
  # Le port gRPC part des deux objets. La suppression est appariée par la CLÉ DE
  # FUSION — `containerPort` côté pod, `port` côté Service — et non par position :
  # un `op: remove` sur `/spec/ports/1` retirerait le mauvais port le jour où
  # quelqu'un en ajoute un avant.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: service
      spec:
        template:
          metadata:
            labels:
              # SEUL LABEL QUE LA NetworkPolicy `allow-ingress-to-gateway`
              # laisse joindre depuis l'Ingress Controller. Sans lui, la
              # passerelle est déployée, saine, et injoignable.
              hba.express/exposition: publique
          spec:
            containers:
              - name: service
                ports:
                  - containerPort: 9090
                    $patch: delete
                env:
                  - name: ASPNETCORE_URLS
                    value: http://+:8080
                  # `UseHbaService` en déduit le nom du service dans les traces et
                  # le contexte propagé du §18. Laissé à « service », toute la
                  # télémétrie de la passerelle serait anonyme.
                  - name: SERVICE_NAME
                    value: api-gateway

                  # ═══════════════════════════════════════════════════════════
                  # L'IDENTITÉ DE CET HÔTE, ET D'AUCUN AUTRE.
                  #
                  # Le nom présenté aux autres services est celui de l'assemblage
                  # d'entrée — « HBA.Gateway.Api » — car `Internal:ServiceName`
                  # n'est pas posé (la variable `SERVICE_NAME` ci-dessus est un
                  # autre réglage, elle ne l'alimente pas). La clé du Secret suit
                  # donc ce nom, exactement comme l'écrit
                  # `scripts/generer-identites-internes.sh`.
                  #
                  # Se tromper de clé ici ne casse RIEN au démarrage : le pod
                  # part, signe sous une identité qui n'est pas la sienne, et
                  # tous ses appels reviennent en `Unauthenticated`.
                  # ═══════════════════════════════════════════════════════════
                  - name: INTERNAL__PRIVATEKEY
                    valueFrom:
                      secretKeyRef:
                        name: hba-identites-internes
                        key: INTERNAL_KEY_HBA_GATEWAY_API

  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: service
      spec:
        ports:
          - port: 9090
            $patch: delete

  # DEUX REPLICAS DÈS LA BASE, CONTRAIREMENT AUX SERVICES.
  #
  # Le §4 place la passerelle à « 2-3 replicas » là où les microservices
  # secondaires restent à 1. La raison n'est pas la charge : c'est qu'un
  # redémarrage de la passerelle coupe TOUT, alors qu'un redémarrage de
  # promotion-service ne coupe que les coupons.
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
