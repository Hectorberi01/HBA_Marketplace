# ═══════════════════════════════════════════════════════════════════════════════
# LE SEUL OBJET DE TOUT `k8s/` QUI OUVRE QUELQUE CHOSE SUR INTERNET (§1, §6).
#
# LE DOMAINE EST UN GABARIT. IL DOIT ÊTRE REMPLACÉ PAR OVERLAY.
#
# `api.hba-express.example` n'existe pas. Le §6 donne `api.hba-express.*` comme
# forme, pas comme valeur — et un domaine réel committé ici ferait pointer les
# trois environnements au même endroit, ce que le §2 interdit explicitement
# (« chaque environnement possède ses propres namespaces, secrets, bases »).
#
# SANS cert-manager INSTALLÉ, `tls:` NE FAIT RIEN — ET L'ÉCHEC EST MUET.
#
# L'annotation `cluster-issuer` désigne un ClusterIssuer qui doit exister. S'il
# est absent, l'Ingress est créé, le Secret TLS ne l'est jamais, et l'Ingress
# Controller sert un certificat auto-signé par défaut. Le navigateur avertit,
# l'application mobile — qui épingle ou refuse — échoue sans message lisible.
#
# À vérifier une fois après le premier déploiement :
#   kubectl get certificate -n hba-prod
# Un `READY: False` qui dure est un ACME bloqué, presque toujours sur le
# challenge DNS ou un port 80 fermé.
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt

    # Redirection 80 → 443 (§5 : « HTTP 80 public, redirection vers HTTPS »).
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

    # TAILLE MAXIMALE DES REQUÊTES (§6), ET ELLE A UNE VICTIME DÉSIGNÉE.
    #
    # Le défaut de nginx-ingress est 1 Mo. media-service accepte des images
    # jusqu'à 15 Mo (pièces vendeur) : sans cette valeur, l'upload échoue en 413
    # AVANT d'atteindre le service, dont les règles de taille n'ont alors jamais
    # l'occasion de s'appliquer. Le message vient de nginx, pas de l'API, et ne
    # ressemble à rien que l'application cliente sache traduire.
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"

    # Le checkout traverse plusieurs services en gRPC ; 60 s couvrent le pire cas
    # observé sans laisser une requête pendue indéfiniment.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.hba-express.example
      secretName: gateway-tls
  rules:
    - host: api.hba-express.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                # « service », PAS « gateway-service ».
                #
                # Kustomize suit les références de nom : il réécrit ce champ en
                # même temps qu'il renomme le Service. Écrire le nom final à la
                # main marcherait aujourd'hui et deviendrait faux le jour où le
                # préfixe change — sans que rien ne le signale avant un 503.
                name: service
                port:
                  name: http
