# ═══════════════════════════════════════════════════════════════════════════════
# CONFIGURATION NON SENSIBLE, PARTAGÉE PAR TOUS LES SERVICES (§12).
#
# RIEN DE SECRET ICI. JAMAIS.
#
# Le §12 est catégorique : aucun secret dans Git, un Dockerfile, une image ou un
# ConfigMap. Un ConfigMap est lisible par quiconque a un accès lecture au
# namespace, et il part dans Git avec le reste — donc dans l'historique, où il
# reste après suppression.
#
# Les adresses ci-dessous ne sont pas des secrets : ce sont des noms DNS internes
# que le §8 fait résoudre par Kubernetes. Les mots de passe qu'elles n'incluent
# PAS vivent dans le Secret `hba-platform`, monté par le même `envFrom`.
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ConfigMap
metadata:
  name: hba-platform
data:
  HOSTING__HTTPPORT: "8080"
  HOSTING__GRPCPORT: "9090"

  # ═══════════════════════════════════════════════════════════════════════
  # CE NOM NE CORRESPONDAIT À AUCUN SERVICE. IL VALAIT `kafka:9092`.
  #
  # Strimzi ne crée pas de Service portant le nom du cluster. Pour un CR nommé
  # `kafka`, le point d'entrée interne est `<nom>-kafka-bootstrap`. Le nom posé
  # ici ne résolvait donc pas : les producteurs et consommateurs des vingt-trois
  # services retentaient indéfiniment, l'outbox ne se vidait jamais, et rien
  # dans `kubectl get pods` ne l'indiquait.
  #
  # RENOMMER LE CLUSTER CASSE CETTE LIGNE. Le `metadata.name` de
  # `k8s/base/kafka/cluster.yaml` est la moitié de ce nom-ci.
  # ═══════════════════════════════════════════════════════════════════════
  KAFKA__BOOTSTRAPSERVERS: "kafka-kafka-bootstrap:9092"

  # ═════════════════════════════════════════════════════════════════════════
  # LA CLÉ EST LE NOM DE CLUSTER, LA VALEUR EST LE NOM DU CONTENEUR — ET LES
  # DEUX ONT CESSÉ DE COÏNCIDER.
  #
  # `ServicesOptions` nomme ses propriétés d'après les domaines de la passerelle
  # (Financial, Engagement, Commerce…), et ces noms-là sont stables. Les
  # conteneurs, eux, ont été redécoupés : `financial-service` est devenu
  # `payment-service`, `engagement-service` est devenu `review-service`,
  # `commerce-service` est devenu `cart-service`, `merchant-service` est devenu
  # `seller-service`, `communication-service` est devenu `notification-service`.
  #
  # Ces six valeurs pointaient encore les anciens noms. Le DNS du cluster ne les
  # aurait pas résolus, et la passerelle aurait démarré normalement — la
  # validation `[Required, Url]` regarde la FORME de l'adresse, pas son
  # existence. Le défaut ne se serait vu qu'au premier appel, en 502.
  #
  # La correspondance vient du bloc `environment` de la passerelle dans
  # `docker-compose.dev.yml`, qui est la seule source à jour.
  #
  # `SERVICES__FOOD` pointe `restaurant-service`, non déployé dans ce lot : la
  # valeur est correcte, la cible viendra avec le domaine `food`.
  # ═════════════════════════════════════════════════════════════════════════

  # ═════════════════════════════════════════════════════════════════════════
  # PORT 8080 ET NON 9090, ALORS QUE CES ADRESSES SERVENT AU gRPC.
  #
  # C'est contre-intuitif, et l'inverse casse la passerelle.
  #
  # Les clients gRPC ne prennent pas ce port : `AddXxxGrpcClient` réécrit
  # l'adresse avec `new UriBuilder(address) { Port = grpcPort }`, où `grpcPort`
  # vient de `Hosting:GrpcPort`. Ils atteignent donc 9090 quel que soit ce qui
  # est écrit ici.
  #
  # La passerelle, elle, prend l'adresse TELLE QUELLE : YARP proxifie du REST.
  # Avec 9090, chaque requête publique partirait vers le port gRPC et
  # échouerait — sur un cluster neuf, tout paraîtrait démarré et rien ne
  # répondrait.
  #
  # 8080 est donc la seule valeur qui serve les deux. Le compose de
  # développement porte 9090 entre services et 8080 pour la passerelle ; ici,
  # une clé unique doit satisfaire les deux, et c'est celle-ci.
  # ═════════════════════════════════════════════════════════════════════════
  SERVICES__IDENTITY: "http://identity-service:8080"
  SERVICES__USER: "http://user-service:8080"
  SERVICES__MEDIA: "http://media-service:8080"
  SERVICES__MERCHANT: "http://seller-service:8080"
  SERVICES__CATALOG: "http://catalog-service:8080"
  SERVICES__INVENTORY: "http://inventory-service:8080"
  SERVICES__COMMERCE: "http://cart-service:8080"
  SERVICES__ORDER: "http://order-service:8080"
  SERVICES__FOOD: "http://restaurant-service:8080"

  # LE PANIER ET LA COMMANDE DE RESTAURATION SONT DEUX SERVICES À PART.
  #
  # La passerelle les déclare OBLIGATOIRES (`ServicesOptions`) : sans ces deux
  # adresses, elle refuse de démarrer. Les omettre ici ferait tomber le pod de la
  # passerelle au premier déploiement, pas seulement le parcours restaurant.
  SERVICES__FOODCART: "http://food-cart-service:8080"
  SERVICES__FOODORDER: "http://food-order-service:8080"
  SERVICES__DELIVERY: "http://delivery-service:8080"
  SERVICES__FINANCIAL: "http://payment-service:8080"
  SERVICES__ENGAGEMENT: "http://review-service:8080"
  SERVICES__COMMUNICATION: "http://notification-service:8080"
  SERVICES__PROMOTION: "http://promotion-service:8080"

  # TROIS SERVICES QUI N'ÉTAIENT JOIGNABLES PAR PERSONNE (lot 7.5).
  #
  # La passerelle porte désormais leurs clusters et leurs routes ; `ServicesOptions`
  # déclare leurs adresses en `[Required, Url]`, donc SANS ces trois lignes la
  # passerelle refuse de démarrer sur Kubernetes. C'est le bon comportement : une
  # adresse absente doit se voir au déploiement, pas au premier 503.
  #
  # Le compose les fournissait déjà (l. 1308-1311) — vers du vide, faute de
  # propriété pour les lier.
  SERVICES__RETURNREFUND: "http://return-refund-service:8080"
  SERVICES__DRIVERS: "http://driver-service:8080"
  SERVICES__DELIVERYPRICING: "http://delivery-pricing-service:8080"

  # ═══════════════════════════════════════════════════════════════════════
  # ADRESSE VIDE : IL N'Y A AUCUN COLLECTEUR DANS CE CLUSTER.
  #
  # Cette clé valait `http://otel-collector:4317`. Aucun collecteur n'est
  # déployé sous `k8s/` — ni Deployment, ni Service de ce nom. Les huit pods
  # auraient tenté d'exporter vers un nom qui ne résout pas, et journalisé un
  # échec toutes les quelques secondes, indéfiniment.
  #
  # `TelemetryExtensions` ne branche l'exportateur OTLP que si l'adresse est un
  # URI absolu lisible. Vide, le service est muet — sans erreur, et c'est le
  # comportement voulu tant que la supervision n'est pas déployée.
  #
  # C'est le même choix qu'en local (`docker-compose.dev.yml`), et pour la même
  # raison. Le jour où un collecteur est déployé, remettre l'adresse ici suffit.
  #
  # CE QUE CELA COÛTE : aucune trace, aucune métrique. Le diagnostic d'un
  # déploiement staging repose donc entièrement sur `kubectl logs` et les
  # sondes. C'est tenable à un nœud ; ça ne l'est plus en production.
  # ═══════════════════════════════════════════════════════════════════════
  OPENTELEMETRY__ENDPOINT: ""

  # ═══════════════════════════════════════════════════════════════════════
  # L'E-MAIL — LES DEUX VALEURS QUI NE SONT PAS DES SECRETS.
  #
  # `EmailOptions.IsConfigured` exige TROIS valeurs. La clé Resend est dans le
  # Secret `hba-notifications` ; ces deux-ci n'ont rien de confidentiel et
  # gagnent à être relues en revue.
  #
  # ELLES SONT DANS LE ConfigMap PARTAGÉ, donc injectées dans les quatorze pods
  # par `envFrom`. Treize d'entre eux ne les liront jamais — comme les vingt
  # adresses `SERVICES__*` juste au-dessus. C'est le prix d'un ConfigMap unique,
  # et il est payé pour que la surcharge par environnement reste un patch d'une
  # ligne dans l'overlay, au lieu d'un patch dans un patch.
  #
  # ═══════════════════════════════════════════════════════════════════════
  # LE DOMAINE DE `FROM` DOIT ÊTRE VÉRIFIÉ CHEZ RESEND (SPF + DKIM).
  #
  # Avec un domaine non vérifié, Resend refuse l'envoi par un 403 — et l'échec se
  # produit DANS L'OUTBOX, donc il est rejoué toutes les cinq secondes sans
  # jamais aboutir. Ni le service ni les sondes ne s'en plaignent : seule la file
  # grossit. C'est le mode de panne le plus discret des trois canaux.
  #
  # ═══════════════════════════════════════════════════════════════════════
  # `APPBASEURL` EST VIDE, ET C'EST UN REFUS DE DÉMARRER DÉLIBÉRÉ.
  #
  # C'est la base des liens cliquables — vérification d'adresse, réinitialisation
  # de mot de passe. Ce n'est PAS l'adresse de l'API : c'est le site ou
  # l'application que l'utilisateur ouvre en cliquant, et elle diffère entre
  # staging et production.
  #
  # La laisser vide rend `IsConfigured` faux, donc le service refuse de démarrer
  # avec un message qui nomme les trois valeurs manquantes. C'est voulu :
  # l'alternative serait d'inventer une URL, et un e-mail de réinitialisation
  # portant un lien mort est pire qu'un e-mail jamais parti — l'utilisateur clique,
  # tombe sur une erreur, et conclut que son compte est cassé.
  #
  # À RENSEIGNER PAR OVERLAY, comme le domaine de l'Ingress.
  # ═══════════════════════════════════════════════════════════════════════
  NOTIFICATIONS__EMAIL__FROM: "HBA Express <no-reply@updates.hbatechettrade.com>"
  NOTIFICATIONS__EMAIL__APPBASEURL: "https://hba-express.org"
