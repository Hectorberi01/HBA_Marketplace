# ═══════════════════════════════════════════════════════════════════════════════
# LES CLÉS DU PRESTATAIRE DE PAIEMENT — UN SECRET À PART.
#
# CE FICHIER EST VIDE DANS GIT, ET IL DOIT LE RESTER (§12).
#
# Il décrit la FORME attendue, pas le contenu. Le vrai secret est créé sur le
# cluster par `kubectl`, jamais par `kustomize`. Il n'est donc PAS dans les
# `resources` de `common/kustomization.yaml` : un `kubectl apply -k` réécrirait
# le secret réel avec les valeurs vides d'ici, et annoncerait
# « secret/hba-paiements configured » comme si tout allait bien.
#
# ═══════════════════════════════════════════════════════════════════════════════
# POURQUOI PAS DANS `hba-platform`.
#
# Le gabarit de déploiement monte `hba-platform` par `envFrom` — TOUTES ses clés,
# dans TOUS les conteneurs. Y poser une clé FedaPay `sk_live_…` la donnerait aux
# dix-huit autres services, dont aucun n'encaisse.
#
# Une clé live n'est pas un mot de passe de base : elle DÉPLACE DE L'ARGENT. Le
# périmètre de ce qui peut la lire doit être le plus étroit possible, et il n'y a
# qu'un seul lecteur légitime.
#
# Même raisonnement que pour `hba-identites-internes` et `hba-notifications`.
#
# ═══════════════════════════════════════════════════════════════════════════════
# CRÉATION SUR LE CLUSTER
#
#     kubectl -n hba-prod create secret generic hba-paiements \
#       --from-literal=PAYMENTS__FEDAPAY__APIKEY='sk_live_...' \
#       --from-literal=PAYMENTS__FEDAPAY__WEBHOOKSECRET='...'
#
# Ne PAS taper ces valeurs dans un terminal dont l'historique est conservé :
# préférer `--from-file=` ou `kubectl apply -f` sur un fichier en 0600, effacé
# ensuite.
#
# ═══════════════════════════════════════════════════════════════════════════════
# CE QUE CE SECRET NE PORTE PAS, ET POURQUOI
#
# `BaseUrl`, `EnablePayouts`, `Currency` et `CallbackUrl` ne sont pas des
# secrets : ce sont des DÉCISIONS, et elles doivent se relire dans Git. Elles
# vivent en clair dans le patch de `k8s/base/services/payment-service`.
#
# `BaseUrl` mérite une attention particulière : `KeyMatchesEnvironment` refuse le
# démarrage si la clé et l'URL ne désignent pas le même monde. Une clé
# `sk_live_…` exige `https://api.fedapay.com/v1`. Ce que ce garde ferme n'est pas
# une panne — c'est de l'argent réel envoyé là où l'on croyait faire un essai.
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: hba-paiements
type: Opaque
stringData:
  # Clé secrète FedaPay, envoyée en Bearer. `sk_live_…` en production.
  PAYMENTS__FEDAPAY__APIKEY: ""

  # Secret de signature des webhooks, vérifié en HMAC sur le corps brut.
  # SANS LUI, LES NOTIFICATIONS SONT REJETÉES EN PRODUCTION :
  # `Payments:AllowUnsignedWebhooksWhenSecretMissing` est ignoré hors
  # développement. L'acheteur paie, la commande reste « en attente de paiement »,
  # et rien ne relie les deux.
  PAYMENTS__FEDAPAY__WEBHOOKSECRET: ""
