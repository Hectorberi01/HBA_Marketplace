# ═══════════════════════════════════════════════════════════════════════════════
# LE COMPTE DE SERVICE FIREBASE — UN SECRET À PART, MONTÉ EN FICHIER.
#
# CE FICHIER EST VIDE DANS GIT, ET IL DOIT LE RESTER (§12).
#
# Il décrit la FORME attendue, pas le contenu. Le vrai secret est créé sur le
# cluster par `kubectl`, jamais par `kustomize` — voir le runbook de staging. Ce
# fichier n'est d'ailleurs PAS dans les `resources` de `common/kustomization.yaml`,
# pour la même raison que `secret.yaml` et `secret-identites.yaml` : un
# `kubectl apply -k` réécrirait le secret réel avec les valeurs vides d'ici, et
# annoncerait « secret/hba-notifications configured » comme si tout allait bien.
#
# ═══════════════════════════════════════════════════════════════════════════════
# POURQUOI UN SECRET SÉPARÉ, ET NON UNE CLÉ DE `hba-platform`.
#
# Le gabarit de déploiement monte `hba-platform` par `envFrom` — c'est-à-dire
# TOUTES ses clés, dans TOUS les conteneurs. Y poser le compte de service
# Firebase donnerait la clé privée du projet Firebase aux quatorze services, dont
# treize n'envoient aucune notification.
#
# C'est exactement le raisonnement qui a déjà valu son propre Secret aux identités
# gRPC internes. Un secret qui n'est utile qu'à un service ne doit pas voyager
# dans les autres.
#
# ═══════════════════════════════════════════════════════════════════════════════
# MONTÉ EN FICHIER, PAS EN VARIABLE D'ENVIRONNEMENT — ET C'EST UN CHOIX.
#
# `FcmOptions` accepte les deux : `ServiceAccountJson` en ligne, ou
# `ServiceAccountPath` vers un fichier. On prend le fichier.
#
#   • LE CONTENU EST UN JSON DE PLUSIEURS KILO-OCTETS contenant une clé privée
#     PEM avec de vrais retours à la ligne. Kubernetes injecte les octets exacts
#     dans les deux cas — le piège d'échappement que `NotificationsModuleInstaller`
#     signale dans son `catch` (« échappement des \n : simple, pas double ») vient
#     de la saisie à la main, pas du transport. Mais un blob de cette taille dans
#     l'environnement du processus pollue chaque `env`, chaque vidage de crash, et
#     tout agent qui capture l'environnement.
#
#   • L'ENVIRONNEMENT D'UN PROCESSUS EST LISIBLE PAR TOUT CE QUI TOURNE DANS LE
#     CONTENEUR, via `/proc/<pid>/environ`, et se transmet aux processus fils.
#     Un fichier monté ne se lit que si on l'ouvre.
#
# CE CHOIX DIVERGE D'UNE CONVENTION DE CE DÉPÔT, ET C'EST ASSUMÉ.
# `INTERNAL__PRIVATEKEY` — une clé privée P-256 — voyage, elle, en variable
# d'environnement. Elle fait quelques dizaines d'octets et sert à chaque appel
# sortant ; le compte de service Firebase fait des kilo-octets et n'est lu qu'une
# fois, au démarrage. La divergence est écrite ici pour qu'on ne la prenne pas
# pour une incohérence.
#
# `readOnlyRootFilesystem: true` NE GÊNE PAS : un volume de Secret est monté en
# lecture seule par nature.
#
# ═══════════════════════════════════════════════════════════════════════════════
# CE QUE CE SECRET NE COUVRE PAS.
#
#   • LE CANAL SMS. `notification-service` refuse AUSSI de démarrer en production
#     sans émetteur SMS — c'est un second refus, indépendant, avec sa propre
#     configuration. Poser FCM ne suffit pas à faire démarrer le service.
#
#   • L'E-MAIL EST ICI AUSSI, mais sous une autre forme — voir plus bas. Seule
#     la CLÉ D'API Resend est un secret ; l'expéditeur et l'URL de base des liens
#     n'en sont pas et vivent dans le ConfigMap, où ils se relisent et se
#     surchargent par environnement.
#
#   • LE PROJET FIREBASE LUI-MÊME. Ce Secret transporte un compte de service ; il
#     ne dit pas quel projet, ni que les applications mobiles pointent le même.
#     Un compte de service valide d'un AUTRE projet Firebase fait démarrer le
#     service et envoie des push que personne ne reçoit.
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: hba-notifications
  namespace: hba
type: Opaque
stringData:
  # ── PUSH : monté en FICHIER ────────────────────────────────────────────────
  #
  # Le JSON du compte de service Google, tel quel. En YAML, `|` conserve les
  # retours à la ligne à l'octet près : aucun échappement à faire.
  #
  #   service-account.json: |
  #     {
  #       "type": "service_account",
  #       "project_id": "…",
  #       "private_key": "-----BEGIN PRIVATE KEY-----\n…\n-----END PRIVATE KEY-----\n",
  #       …
  #     }
  service-account.json: ""

  # ── E-MAIL : injectée en VARIABLE ──────────────────────────────────────────
  #
  # LES DEUX FORMES COHABITENT DANS LE MÊME SECRET, ET C'EST VOULU.
  #
  # Le compte de service fait des kilo-octets et n'est lu qu'au démarrage : un
  # fichier. La clé Resend fait une quarantaine de caractères et se lit comme un
  # jeton : une variable. Les séparer en deux Secrets n'apporterait qu'un objet
  # de plus à créer et à oublier.
  #
  # LE VOLUME NE PROJETTE QUE `service-account.json`, grâce à une liste `items`
  # dans le patch de notification-service. Sans elle, un volume de Secret projette
  # TOUTES ses clés : la clé Resend apparaîtrait comme un fichier
  # `/etc/hba/firebase/NOTIFICATIONS__EMAIL__APIKEY`, à côté du compte de service.
  # Inoffensif, et trompeur pour qui relit le montage.
  #
  # Clé Resend, de la forme « re_… ». Vide = envoi désactivé, et le service
  # REFUSE de démarrer en production : sans e-mail, aucune réinitialisation de
  # mot de passe n'est possible et les comptes restent enfermés dehors.
  NOTIFICATIONS__EMAIL__APIKEY: ""
