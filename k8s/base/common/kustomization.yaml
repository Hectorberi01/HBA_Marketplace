apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ═══════════════════════════════════════════════════════════════════════════════
# `secret.yaml` N'EST PLUS DANS LE BUILD, ET C'EST CE QUI SAUVE LE DÉPLOIEMENT.
#
# Le §3.7 tranche : `kubectl create secret`, hors GitOps. Le runbook crée donc le
# Secret à la main, PUIS lance `kubectl apply -k`.
#
# Tant que ce fichier était une ressource, cette seconde commande RÉÉCRIVAIT le
# Secret avec les valeurs vides du dépôt. Les huit pods redémarraient avec une
# clé de signature vide et des chaînes de connexion vides — quelques minutes
# après une création de secret qui avait pourtant réussi. Rien dans la sortie de
# `kubectl apply` ne l'aurait dit : il annonce `secret/hba-platform configured`,
# ce qui est exact.
#
# Le fichier RESTE dans le dépôt : c'est le contrat, la seule liste des clés
# attendues, et il documente la forme de chaque valeur. Il n'est simplement plus
# appliqué.
#
# À REMETTRE le jour où External Secrets ou Vault entre en jeu (§25) : l'objet
# sera alors écrasé par l'opérateur, et l'appliquer vide redevient sans danger.
# ═══════════════════════════════════════════════════════════════════════════════
resources:
  - configmap.yaml
  # - secret.yaml            # voir l'encadré ci-dessus — créé par kubectl, pas par kustomize
  # - secret-identites.yaml  # idem : identités gRPC, engendrées par scripts/generer-identites-internes.sh
