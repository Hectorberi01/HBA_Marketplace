# ═══════════════════════════════════════════════════════════════════════════════
# LES IDENTITÉS gRPC INTERNES — LE SECRET QUI MANQUAIT.
#
# SANS LUI, LE CLUSTER PARAÎT SAIN ET ÉCHOUE AU PREMIER TRAFIC.
#
# `Internal:IdentitesNonSignees` n'est pas posé hors développement, donc faux.
# `InternalCallClientInterceptor` exige alors une clé privée : sans elle, il lève
# `FailedPrecondition: Internal identity not configured.` — AU PREMIER APPEL, pas
# au démarrage. Les pods passent Ready, les sondes sont vertes, `kubectl get
# pods` ne montre rien, et chaque appel inter-services échoue.
# Symétriquement, le serveur refuse tout appel si son registre est vide.
#
# POURQUOI UN SECOND SECRET, ET NON DES CLÉS DANS `hba-platform`.
#
# `hba-platform` est monté par `envFrom` : TOUTES ses clés deviennent des
# variables d'environnement dans TOUS les pods. Y mettre les clés privées
# donnerait à chaque conteneur les treize autres — et un conteneur compromis
# pourrait alors signer au nom de n'importe qui. La propriété que le code
# revendique — « compromettre cette clé permet d'usurper CE service, et aucun
# autre » — disparaîtrait sans qu'aucun test ne le voie.
#
# Ce Secret-ci n'est PAS monté par `envFrom`. Chaque Deployment reprend UNE clé,
# la sienne, par un `secretKeyRef` nommé. Un pod ne reçoit que son identité.
#
# CE QUE CELA NE PROTÈGE PAS : quiconque peut lire les Secrets du namespace les
# lit toutes. L'isolation est celle des conteneurs, pas celle du RBAC.
#
# ═══ COMMENT LE REMPLIR ═══
#
#   scripts/generer-identites-internes.sh /chemin/hors/depot
#   kubectl create secret generic hba-identites-internes -n hba-staging \
#     --from-env-file=/chemin/hors/depot/identites.env
#
# Les noms de clés ci-dessous sont EXACTEMENT ceux que le script écrit :
# `HBA.Identity.Api` → `INTERNAL_KEY_HBA_IDENTITY_API`. Aucune transcription à la
# main, donc aucune ligne tronquée — le mode d'échec que l'en-tête du script
# décrit.
#
# CE FICHIER N'EST PAS APPLIQUÉ (voir `kustomization.yaml`) : l'appliquer vide
# effacerait les vraies valeurs.
#
# ═══ ROTATION ═══
#
# Tous les hôtes ENSEMBLE. Un hôte qui tourne encore avec l'ancien registre
# rejette les nouveaux appelants, et réciproquement : une rotation partielle
# coupe les appels dans les deux sens, en `Unauthenticated`.
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: hba-identites-internes
  annotations:
    hba.express/remplissage: "scripts/generer-identites-internes.sh — jamais commité"
type: Opaque
stringData:
  # Le registre des clés PUBLIQUES, `nom=base64;nom=base64`, IDENTIQUE sur tous
  # les hôtes. Rien à protéger : ces clés ne servent qu'à vérifier. Elles
  # transitent par l'environnement pour qu'une rotation ne demande pas de
  # reconstruire les images.
  INTERNAL_PUBLIC_KEYS: ""

  # ── Les clés PRIVÉES, une par hôte ────────────────────────────────────────
  # Les six services marketplace sont déclarés ici bien qu'ils ne soient pas
  # encore déployés (leur ligne est commentée dans `services/kustomization.yaml`).
  # Les omettre ferait découvrir l'oubli au lot suivant, sur un cluster en
  # marche.
  INTERNAL_KEY_HBA_IDENTITY_API: ""                 # identity-service
  INTERNAL_KEY_HBA_USERS_API: ""                    # user-service
  INTERNAL_KEY_HBA_MEDIA_API: ""                    # media-service
  INTERNAL_KEY_HBA_COMMUNICATION_API: ""            # notification-service
  INTERNAL_KEY_HBA_FINANCIAL_API: ""                # payment-service
  INTERNAL_KEY_HBA_PROMOTIONS_API: ""               # promotion-service
  INTERNAL_KEY_HBA_ENGAGEMENT_API: ""               # review-service
  INTERNAL_KEY_HBA_CATALOG_API: ""                  # catalog-service
  INTERNAL_KEY_HBA_COMMERCE_API: ""                 # cart-service
  INTERNAL_KEY_HBA_INVENTORY_API: ""                # inventory-service
  INTERNAL_KEY_HBA_ORDER_API: ""                    # order-service
  INTERNAL_KEY_HBA_MERCHANTS_API: ""                # seller-service
  INTERNAL_KEY_HBA_MARKETPLACE_RETURNREFUND_API: "" # return-refund-service

  INTERNAL_KEY_HBA_GATEWAY_API: ""                  # api-gateway
