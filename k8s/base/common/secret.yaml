# ═══════════════════════════════════════════════════════════════════════════════
# CE SECRET EST VOLONTAIREMENT VIDE, ET IL DOIT LE RESTER DANS GIT.
#
# Le §12 interdit tout secret dans Git. Cet objet ne sert qu'à DÉCLARER le nom
# que les Deployments montent (`envFrom.secretRef: hba-platform`) et la liste des
# clés attendues. Les valeurs sont injectées au runtime depuis le gestionnaire de
# secrets.
#
# Sans ce fichier, `envFrom` échouerait à la création du pod sur un secret absent,
# et l'erreur — « secret "hba-platform" not found » — n'indiquerait pas quelles
# clés il aurait fallu fournir.
#
# CE N'EST PAS UNE SOLUTION D'INJECTION, C'EST UN CONTRAT.
#
# Deux façons de le remplir, à trancher :
#   • External Secrets Operator / Vault Agent : l'objet est écrasé au runtime par
#     l'opérateur, qui lit le vrai coffre. Le fichier de Git reste vide.
#   • `kubectl create secret` hors GitOps : simple, mais le cluster cesse d'être
#     reconstructible depuis Git seul — ce que le §25 exige.
#
# Tant que rien n'est tranché, un déploiement échouera au démarrage sur une clé
# de signature JWT vide. C'est le bon échec : bruyant, immédiat, et impossible à
# confondre avec un service en bonne santé.
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: hba-platform
  annotations:
    hba.express/remplissage: "gestionnaire de secrets — jamais commité"
type: Opaque
stringData:
  # ═════════════════════════════════════════════════════════════════════════
  # UNE CHAÎNE DE CONNEXION PAR SERVICE, ET NON PLUS UNE SEULE.
  #
  # CE CONTRAT N'EN DÉCLARAIT QU'UNE, ET LES TREIZE BASES NE SERVAIENT À RIEN.
  #
  # Le Job `postgres-databases` crée les bases du §10 — « database ownership per
  # service » — depuis le début. Mais `envFrom` monte ce Secret À L'IDENTIQUE sur
  # tous les pods : avec une clé unique, les treize services auraient reçu la
  # même chaîne, migré dans la même base, et les autres seraient restées vides.
  # Rien ne l'aurait signalé : chaque `DbContext` porte son propre schéma, donc
  # les migrations se seraient empilées sans conflit visible.
  #
  # Chaque service reprend SA clé par un `env` explicite — qui l'emporte sur
  # `envFrom` — vers le nom `CONNECTIONSTRINGS__DEFAULT` que .NET attend. Voir le
  # patch de `services/<nom>/kustomization.yaml`.
  #
  # DEUX SERVICES PARTAGENT UNE BASE, ET C'EST L'ÉTAT RÉEL. `cart-service` et
  # `return-refund-service` pointent tous deux `hba_commerce`, schémas distincts,
  # exactement comme en développement. Le §10 dit « par service » ; la réalité
  # est « par famille de modules ». On décrit la réalité, pas l'intention.
  #
  # Les noms de base sont ceux du compose de développement. Les aligner sur les
  # nouveaux noms de service ferait diverger les deux environnements pour un gain
  # cosmétique, et imposerait une migration de données le jour de la bascule.
  # ═════════════════════════════════════════════════════════════════════════
  #
  #   Host=10.0.0.1;Port=5432;Database=<base>;Username=<role>;Password=<motdepasse>
  #
  # ═════════════════════════════════════════════════════════════════════════
  # L'HÔTE EST UNE ADRESSE DE TUNNEL, PAS UN SERVICE KUBERNETES.
  #
  # Ces chaînes visaient `postgres-rw`, le Service d'écriture de CloudNativePG.
  # La base ne tourne plus dans le cluster : elle est installée sur un second
  # VPS, et les deux machines se parlent par un tunnel WireGuard dont le côté
  # base porte 10.0.0.1.
  #
  # POURQUOI PAS L'IP PUBLIQUE. Postgres n'écoute que sur l'interface du tunnel.
  # Y mettre l'adresse publique ferait sortir la connexion du tunnel : elle
  # arriverait sur une interface où Postgres n'écoute pas, et la panne serait
  # « connection refused » sur une base qui tourne parfaitement.
  #
  # UNE RÔLE PAR BASE. Chaque service se connecte avec son propre compte, qui
  # n'a de droits que sur sa base. Un service compromis ne lit pas les tables
  # d'un autre — ce que ne donnait pas le compte `hba` unique du développement.
  # `cart-service` et `return-refund-service` partagent `hba_commerce`, donc le
  # même rôle : c'est la seule paire dans ce cas.
  #
  # LA RÈGLE D'EGRESS DOIT SUIVRE. `k8s/base/policies/` n'autorise la sortie que
  # vers les pods du namespace, plus cette adresse en `/32` sur le port 5432.
  # Changer l'IP du tunnel ici sans l'y changer donne un délai d'attente, pas un
  # refus — et le diagnostic part vers le pare-feu du VPS.
  # ═════════════════════════════════════════════════════════════════════════

  # ── common ───────────────────────────────────────────────────────────────
  CONNECTIONSTRINGS__IDENTITY: ""      # hba_identity
  CONNECTIONSTRINGS__USER: ""          # hba_user
  CONNECTIONSTRINGS__MEDIA: ""         # hba_media
  CONNECTIONSTRINGS__NOTIFICATION: ""  # hba_communication
  CONNECTIONSTRINGS__PAYMENT: ""       # hba_financial
  CONNECTIONSTRINGS__PROMOTION: ""     # hba_promotion
  CONNECTIONSTRINGS__REVIEW: ""        # hba_engagement

  # ── marketplace ──────────────────────────────────────────────────────────
  CONNECTIONSTRINGS__CATALOG: ""       # hba_catalog
  CONNECTIONSTRINGS__CART: ""          # hba_commerce
  CONNECTIONSTRINGS__INVENTORY: ""     # hba_inventory
  CONNECTIONSTRINGS__ORDER: ""         # hba_order
  CONNECTIONSTRINGS__SELLER: ""        # hba_merchant
  CONNECTIONSTRINGS__RETURNREFUND: ""  # hba_commerce, comme cart

  # ── delivery ─────────────────────────────────────────────────────────────
  #
  # Les trois partagent `hba_delivery`, donc le rôle `hba_delivery` : c'est
  # l'état réel du code — delivery-pricing-service lit les tables que
  # delivery-service crée. Même situation que cart / return-refund sur
  # `hba_commerce`, et la seconde du dépôt.
  CONNECTIONSTRINGS__DELIVERY: ""         # hba_delivery
  CONNECTIONSTRINGS__DRIVER: ""           # hba_delivery, comme delivery
  CONNECTIONSTRINGS__DELIVERYPRICING: ""  # hba_delivery, comme delivery

  # CONSERVÉE POUR LA PASSERELLE ET TOUT HÔTE SANS BASE PROPRE.
  #
  # La passerelle n'a pas de `DbContext` ; la laisser sans chaîne du tout
  # obligerait à distinguer deux formes de Secret. Elle reste donc déclarée, et
  # ne sert plus de valeur par défaut à un service applicatif — chacun a la
  # sienne au-dessus.
  CONNECTIONSTRINGS__DEFAULT: ""

  REDIS__CONNECTIONSTRING: ""
  AUTHENTICATION__SIGNINGKEY: ""
  INTERNAL__APIKEY: ""

  # LA MÊME VALEUR POUR identity-service ET notification-service.
  #
  # identity chiffre les codes de vérification et de réinitialisation avant de les
  # poser dans l'outbox ; notifications les déchiffre avant l'envoi de l'e-mail.
  # Deux clés différentes ne provoquent aucune erreur au démarrage : elles se
  # traduisent par des e-mails qui ne partent plus, chaque message finissant en
  # lettre morte. Comme les deux services montent CE secret, la valeur est
  # forcément partagée — c'est voulu.
  #
  # Format attendu : 32 octets aléatoires encodés en base64 (AES-256).
  #   openssl rand -base64 32
  #
  # `AesGcmSecretProtector` REFUSE de démarrer en production si elle est vide.
  # C'est le bon échec : sans elle, les codes repartiraient en clair sur Kafka et
  # dans l'outbox, sans que rien ne le signale.
  SECURITY__SECRETPROTECTION__KEY: ""
