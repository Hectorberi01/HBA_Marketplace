# ═══════════════════════════════════════════════════════════════════════════════
# CE SECRET EST VOLONTAIREMENT VIDE, ET IL DOIT LE RESTER DANS GIT.
#
# Le §12 interdit tout secret dans Git. Cet objet ne sert qu'à DÉCLARER le nom
# que les Deployments montent (`envFrom.secretRef: hba-platform`) et la liste des
# clés attendues. Les valeurs sont injectées au runtime depuis le gestionnaire de
# secrets.
#
# Sans ce fichier, `envFrom` échouerait à la création du pod sur un secret absent,
# et l'erreur — « secret "hba-platform" not found » — n'indiquerait pas quelles
# clés il aurait fallu fournir.
#
# CE N'EST PAS UNE SOLUTION D'INJECTION, C'EST UN CONTRAT.
#
# Deux façons de le remplir, à trancher :
#   • External Secrets Operator / Vault Agent : l'objet est écrasé au runtime par
#     l'opérateur, qui lit le vrai coffre. Le fichier de Git reste vide.
#   • `kubectl create secret` hors GitOps : simple, mais le cluster cesse d'être
#     reconstructible depuis Git seul — ce que le §25 exige.
#
# Tant que rien n'est tranché, un déploiement échouera au démarrage sur une clé
# de signature JWT vide. C'est le bon échec : bruyant, immédiat, et impossible à
# confondre avec un service en bonne santé.
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: hba-platform
  annotations:
    hba.express/remplissage: "gestionnaire de secrets — jamais commité"
type: Opaque
stringData:
  CONNECTIONSTRINGS__DEFAULT: ""
  REDIS__CONNECTIONSTRING: ""
  AUTHENTICATION__SIGNINGKEY: ""
  INTERNAL__APIKEY: ""

  # LA MÊME VALEUR POUR identity-service ET notification-service.
  #
  # identity chiffre les codes de vérification et de réinitialisation avant de les
  # poser dans l'outbox ; notifications les déchiffre avant l'envoi de l'e-mail.
  # Deux clés différentes ne provoquent aucune erreur au démarrage : elles se
  # traduisent par des e-mails qui ne partent plus, chaque message finissant en
  # lettre morte. Comme les deux services montent CE secret, la valeur est
  # forcément partagée — c'est voulu.
  #
  # Format attendu : 32 octets aléatoires encodés en base64 (AES-256).
  #   openssl rand -base64 32
  #
  # `AesGcmSecretProtector` REFUSE de démarrer en production si elle est vide.
  # C'est le bon échec : sans elle, les codes repartiraient en clair sur Kafka et
  # dans l'outbox, sans que rien ne le signale.
  SECURITY__SECRETPROTECTION__KEY: ""
