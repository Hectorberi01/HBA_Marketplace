# ═══════════════════════════════════════════════════════════════════════════════
# LES JOBS DE MIGRATION NE SONT PAS DANS `k8s/base` PAR DEFAUT.
#
# Ce kustomization existe pour etre applique SEUL, avant les services :
#
#     kubectl apply -k k8s/overlays/migrations-prod
#
# L'inclure dans la base ferait tourner une migration a chaque `apply -k`, donc
# a chaque changement de configuration sans rapport. Une migration se declenche,
# elle ne se subit pas.
#
# TENU A LA MAIN depuis le 2 septembre 2026.
#
# Ce fichier etait engendre par `scripts/generer-jobs-migration.py`, supprime
# avec l'outillage Python. Le generateur sera repris par l'outil de controles
# .NET ; d'ici la, ajouter un service de migration se fait a la main, ici et
# dans `kustomization.yaml`, et RIEN ne verifie que les deux concordent.
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - identity-service
  - user-service
  - media-service
  - payment-service
  - promotion-service
  - review-service
  - delivery-service
  - driver-service
  - delivery-pricing-service
  - catalog-service
  - cart-service
  - inventory-service
  - order-service
  - seller-service
  - food-cart-service
  - food-order-service
  - restaurant-service
