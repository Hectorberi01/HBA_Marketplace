# ═══════════════════════════════════════════════════════════════════════════════
# ENGENDRE PAR scripts/generer-jobs-migration.py — NE PAS EDITER A LA MAIN.
#
# Le cablage vient de k8s/base/services/media-service/kustomization.yaml. Modifier le
# service, puis relancer le script : une divergence entre le Job et le Deployment
# ferait migrer contre une configuration qui n'est plus celle du service.
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: batch/v1
kind: Job
metadata:
  name: migration
  labels:
    app.kubernetes.io/component: migration
spec:
  # Une seule tentative supplementaire. Une migration qui echoue deux fois
  # echoue pour une raison qu'un troisieme essai ne changera pas, et chaque
  # reprise rouvre la fenetre de concurrence.
  backoffLimit: 1

  # Le Job disparait une heure apres sa fin. Assez pour lire ses journaux,
  # assez peu pour ne pas accumuler des objets termines dans le namespace.
  ttlSecondsAfterFinished: 3600

  template:
    metadata:
      labels:
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never

      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: migration
          image: hba/service:latest

          envFrom:
            - configMapRef:
                name: hba-platform
            - secretRef:
                name: hba-platform

          env:
            # LA CLE DE TOUT CE JOB. Sans elle, le conteneur demarre un serveur
            # web qui ecoute indefiniment : le Job reste `Running`, et
            # `kubectl wait --for=condition=complete` expire sur une migration
            # pourtant reussie.
            - name: DATABASE__MIGRATEONLY
              value: "true"
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: SERVICE_NAME
              value: media-service

            # ═══════════════════════════════════════════════════════════
            # CHAQUE SERVICE SA BASE, ET C'EST CETTE ENTRÉE QUI LE FAIT.
            #
            # Le Job `postgres-databases` crée les bases du §10 depuis le
            # début. Rien ne les BRANCHAIT : le Secret partagé ne portait
            # qu'une seule clé `CONNECTIONSTRINGS__DEFAULT`, montée à
            # l'identique par `envFrom` sur tous les pods. Les bases
            # étaient donc créées et aucun service ne pointait la sienne —
            # les treize auraient migré dans la même.
            #
            # Une entrée `env` explicite l'emporte sur `envFrom` : le nom
            # de variable reste celui que .NET attend, et la VALEUR vient
            # d'une clé propre au service. Le mot de passe ne quitte pas le
            # Secret, donc rien de sensible n'entre dans Git.
            #
            # Base « hba_media » : celle qu'emploie déjà le compose de
            # développement. La renommer ici ferait diverger les deux
            # environnements pour un gain cosmétique.
            # ═══════════════════════════════════════════════════════════
            - name: CONNECTIONSTRINGS__DEFAULT
              valueFrom:
                secretKeyRef:
                  name: hba-platform
                  key: CONNECTIONSTRINGS__MEDIA

            # ═══════════════════════════════════════════════════════════
            # L'IDENTITÉ DE CET HÔTE, ET D'AUCUN AUTRE.
            #
            # Le nom présenté aux autres services est celui de l'assemblage
            # d'entrée — « HBA.Media.Api » — car `Internal:ServiceName`
            # n'est pas posé (la variable `SERVICE_NAME` ci-dessus est un
            # autre réglage, elle ne l'alimente pas). La clé du Secret suit
            # donc ce nom, exactement comme l'écrit
            # `scripts/generer-identites-internes.sh`.
            #
            # Se tromper de clé ici ne casse RIEN au démarrage : le pod
            # part, signe sous une identité qui n'est pas la sienne, et
            # tous ses appels reviennent en `Unauthenticated`.
            # ═══════════════════════════════════════════════════════════
            - name: INTERNAL__PRIVATEKEY
              valueFrom:
                secretKeyRef:
                  name: hba-identites-internes
                  key: INTERNAL_KEY_HBA_MEDIA_API

            # ═══════════════════════════════════════════════════════════
            # LE STOCKAGE OBJET — SANS LUI, LE SERVICE REFUSE DE DÉMARRER.
            #
            # `MediaModuleInstaller` lève en production quand la section
            # `Media:Storage` n'est pas renseignée, et le message dit
            # pourquoi : le repli en mémoire perdrait à chaque redémarrage
            # les pièces KYB et les preuves de livraison. Aucune de ces
            # clés n'existait dans `k8s/`, alors que MinIO était déployé.
            #
            # L'ENDPOINT EST INTERNE AU CLUSTER. `minio:9000` est le
            # Service posé par `k8s/base/data/minio`. En clair et non en
            # TLS : le trafic ne quitte pas le namespace, et la
            # NetworkPolicy n'autorise la sortie que vers les pods du
            # namespace plus la base.
            #
            # CE QUE CE CÂBLAGE NE COUVRE PAS, ET IL FAUT LE SAVOIR :
            #
            #  • MinIO vit sur LE MÊME VPS que les pods, sur un disque
            #    unique, sans sauvegarde. Ce sont des pièces de conformité
            #    — cartes d'identité, registres de commerce — et des
            #    preuves de livraison. Perdre ce disque, c'est perdre un
            #    dossier de litige. Un stockage externe reste le bon choix.
            #  • Les identifiants sont ceux du compte ROOT de MinIO. Un
            #    compte de service limité aux deux buckets vaudrait mieux ;
            #    MinIO n'en fournit pas sans configuration supplémentaire.
            #  • LES BUCKETS NE SONT PAS CRÉÉS ICI. MinIO ne les crée pas
            #    tout seul, et rien dans ce dépôt ne le fait : `hba-public`
            #    et `hba-private` sont à créer avant le premier envoi.
            # ═══════════════════════════════════════════════════════════
            - name: MEDIA__STORAGE__ENDPOINT
              value: http://minio:9000
            - name: MEDIA__STORAGE__REGION
              value: us-east-1
            - name: MEDIA__STORAGE__PUBLICBUCKET
              value: hba-public
            - name: MEDIA__STORAGE__PRIVATEBUCKET
              value: hba-private
            - name: MEDIA__STORAGE__ACCESSKEYID
              valueFrom:
                secretKeyRef:
                  name: minio
                  key: root-user
            - name: MEDIA__STORAGE__SECRETACCESSKEY
              valueFrom:
                secretKeyRef:
                  name: minio
                  key: root-password

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
