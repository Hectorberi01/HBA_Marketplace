# ═══════════════════════════════════════════════════════════════════════════════
# TENU A LA MAIN depuis le 2 septembre 2026.
#
# Ce fichier etait engendre par `scripts/generer-jobs-migration.py`, supprime
# avec l'outillage Python. Le generateur sera repris par l'outil de controles
# .NET ; d'ici la, ajouter un service de migration se fait a la main, ici et
# dans `kustomization.yaml`, et RIEN ne verifie que les deux concordent.
#
# Le cablage vient de k8s/base/services/payment-service/kustomization.yaml. Modifier le
# service, puis relancer le script : une divergence entre le Job et le Deployment
# ferait migrer contre une configuration qui n'est plus celle du service.
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: batch/v1
kind: Job
metadata:
  name: migration
  labels:
    app.kubernetes.io/component: migration
spec:
  # Une seule tentative supplementaire. Une migration qui echoue deux fois
  # echoue pour une raison qu'un troisieme essai ne changera pas, et chaque
  # reprise rouvre la fenetre de concurrence.
  backoffLimit: 1

  # Le Job disparait une heure apres sa fin. Assez pour lire ses journaux,
  # assez peu pour ne pas accumuler des objets termines dans le namespace.
  ttlSecondsAfterFinished: 3600

  template:
    metadata:
      labels:
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never

      # LE MEME COMPTE QUE LE SERVICE, ET C'EST NECESSAIRE.
      #
      # Le secret de tirage `ghcr` est porte par le ServiceAccount de chaque
      # service (`_service/serviceaccount.yaml`). Un Job sans
      # `serviceAccountName` tourne sous `default`, qui ne le porte pas : le Job
      # resterait en ImagePullBackOff alors que le Deployment du meme service
      # tire la meme image sans difficulte — une difference que rien ne designe.
      #
      # `namePrefix` du kustomization renomme `service` en `<service>`, donc ce
      # nom-ci suit automatiquement.
      serviceAccountName: service

      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: migration
          image: hba/service:latest

          envFrom:
            - configMapRef:
                name: hba-platform
            - secretRef:
                name: hba-platform

          env:
            # LA CLE DE TOUT CE JOB. Sans elle, le conteneur demarre un serveur
            # web qui ecoute indefiniment : le Job reste `Running`, et
            # `kubectl wait --for=condition=complete` expire sur une migration
            # pourtant reussie.
            - name: DATABASE__MIGRATEONLY
              value: "true"
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: SERVICE_NAME
              value: payment-service

            # ═══════════════════════════════════════════════════════════
            # CHAQUE SERVICE SA BASE, ET C'EST CETTE ENTRÉE QUI LE FAIT.
            #
            # Le Job `postgres-databases` crée les bases du §10 depuis le
            # début. Rien ne les BRANCHAIT : le Secret partagé ne portait
            # qu'une seule clé `CONNECTIONSTRINGS__DEFAULT`, montée à
            # l'identique par `envFrom` sur tous les pods. Les bases
            # étaient donc créées et aucun service ne pointait la sienne —
            # les treize auraient migré dans la même.
            #
            # Une entrée `env` explicite l'emporte sur `envFrom` : le nom
            # de variable reste celui que .NET attend, et la VALEUR vient
            # d'une clé propre au service. Le mot de passe ne quitte pas le
            # Secret, donc rien de sensible n'entre dans Git.
            #
            # Base « hba_financial » : celle qu'emploie déjà le compose de
            # développement. La renommer ici ferait diverger les deux
            # environnements pour un gain cosmétique.
            # ═══════════════════════════════════════════════════════════
            - name: CONNECTIONSTRINGS__DEFAULT
              valueFrom:
                secretKeyRef:
                  name: hba-platform
                  key: CONNECTIONSTRINGS__PAYMENT

            # ═══════════════════════════════════════════════════════════
            # L'IDENTITÉ DE CET HÔTE, ET D'AUCUN AUTRE.
            #
            # Le nom présenté aux autres services est celui de l'assemblage
            # d'entrée — « HBA.Financial.Api » — car `Internal:ServiceName`
            # n'est pas posé (la variable `SERVICE_NAME` ci-dessus est un
            # autre réglage, elle ne l'alimente pas). La clé du Secret suit
            # donc ce nom, exactement comme l'écrit
            # `scripts/generer-identites-internes.sh`.
            #
            # Se tromper de clé ici ne casse RIEN au démarrage : le pod
            # part, signe sous une identité qui n'est pas la sienne, et
            # tous ses appels reviennent en `Unauthenticated`.
            # ═══════════════════════════════════════════════════════════
            - name: INTERNAL__PRIVATEKEY
              valueFrom:
                secretKeyRef:
                  name: hba-identites-internes
                  key: INTERNAL_KEY_HBA_FINANCIAL_API

            # ═══════════════════════════════════════════════════════════
            # FEDAPAY — DEUX SECRETS, QUATRE DÉCISIONS.
            #
            # LES SECRETS VIENNENT DE `hba-paiements`, PAS DE
            # `hba-platform`. Le gabarit monte `hba-platform` par
            # `envFrom` : toutes ses clés, dans tous les conteneurs. Une
            # clé `sk_live_…` y serait lisible par les dix-huit autres
            # services, dont aucun n'encaisse. Une clé live n'est pas un
            # mot de passe de base — elle DÉPLACE DE L'ARGENT.
            #
            # LES QUATRE AUTRES SONT EN CLAIR, ET C'EST VOULU. Ce ne sont
            # pas des secrets mais des décisions : elles doivent se relire
            # dans Git, et une revue doit pouvoir les contester.
            #
            # SANS L'UNE DES DEUX PREMIÈRES, LE SERVICE NE DÉMARRE PAS.
            # `PaymentsModuleInstaller` refuse la production sans
            # prestataire réel, et refuse aussi les versements sans clé
            # LIVE avec `EnablePayouts`. Les deux gardes sont délibérées.
            # ═══════════════════════════════════════════════════════════
            - name: PAYMENTS__FEDAPAY__APIKEY
              valueFrom:
                secretKeyRef:
                  name: hba-paiements
                  key: PAYMENTS__FEDAPAY__APIKEY

            - name: PAYMENTS__FEDAPAY__WEBHOOKSECRET
              valueFrom:
                secretKeyRef:
                  name: hba-paiements
                  key: PAYMENTS__FEDAPAY__WEBHOOKSECRET

            # `KeyMatchesEnvironment` refuse le démarrage si la clé et
            # l'URL ne désignent pas le même monde. `sk_live_…` exige
            # celle-ci ; `sk_sandbox_…` exigerait sandbox-api.fedapay.com.
            - name: PAYMENTS__FEDAPAY__BASEURL
              value: "https://api.fedapay.com/v1"

            # Les versements réels ne sont possibles qu'en LIVE : le bac à
            # sable refuse les dépôts Mobile Money (403), et un retrait
            # simulé serait clôturé « payé » sans qu'aucun argent ne parte.
            - name: PAYMENTS__FEDAPAY__ENABLEPAYOUTS
              value: "true"

            - name: PAYMENTS__FEDAPAY__CURRENCY
              value: "XOF"

            # Où FedaPay notifie ET renvoie l'acheteur. Le chemin est le
            # chemin PUBLIC : la passerelle réécrit `/api/payments/**` en
            # `/api/financial/payments/**` avant de transmettre.
            - name: PAYMENTS__FEDAPAY__CALLBACKURL
              value: "https://api.hba-express.com/api/payments/webhooks/fedapay"

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
