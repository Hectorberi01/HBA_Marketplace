# ═══════════════════════════════════════════════════════════════════════════════
# LES IDENTIFIANTS DE MINIO — VIDES DANS GIT (§12), COMME LES AUTRES SECRETS.
#
# CE QUI ÉTAIT CASSÉ : CE FICHIER N'EXISTAIT PAS.
#
# `statefulset.yaml` lit `MINIO_ROOT_USER` et `MINIO_ROOT_PASSWORD` dans un Secret
# nommé `minio`, et aucun manifeste ne le déclarait. Il était créé à la main, sans
# qu'aucun fichier ne le mentionne : le seul endroit où l'exigence apparaissait
# était le `secretKeyRef` lui-même. Un déploiement sur un cluster neuf laissait
# MinIO en `CreateContainerConfigError`, et media-service — qui refuse de démarrer
# sans stockage objet — tombait juste après, pour une cause située deux crans plus
# loin.
#
# `scripts/check-k8s.py` a signalé le manque au moment où media-service a été
# câblé dessus. C'est ce fichier qui rend l'exigence lisible.
#
# COMME LES AUTRES : IL RESTE HORS DES `resources`.
#
# Les valeurs ne sont jamais dans Git. Le Secret se pose avant tout déploiement :
#
#   kubectl -n hba-prod create secret generic minio \
#     --from-literal=root-user="hba-minio" \
#     --from-literal=root-password="$(openssl rand -base64 24)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# LE MOT DE PASSE EST AUSSI CELUI DE media-service. `MEDIA__STORAGE__SECRETACCESSKEY`
# lit la MÊME clé : le changer ici sans redémarrer media-service lui laisse un
# identifiant périmé, et l'échec se lit « SignatureDoesNotMatch » — un message qui
# désigne la signature, pas la rotation.
#
# CE QUE CE FICHIER NE COUVRE PAS. Il ne crée pas les buckets `hba-public` et
# `hba-private` : MinIO ne les crée pas tout seul, et rien dans ce dépôt ne le
# fait. Il ne met en place aucune sauvegarde — le disque est unique.
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: minio
type: Opaque
stringData:
  root-user: ""
  root-password: ""
