# ═══════════════════════════════════════════════════════════════════════════════
# MINIO — STOCKAGE OBJET COMPATIBLE S3 (§11).
#
# Images produit, photos restaurants, justificatifs, preuves de livraison. C'est
# media-service qui l'utilise, et lui seul : les autres services ne gardent qu'un
# `MediaId`.
#
# CE N'EST PAS LÀ QUE VONT LES SAUVEGARDES POSTGRES.
#
# Le WAL et les bases complètes partent vers OVH Object Storage, HORS cluster —
# voir l'encadré de `../postgres/cluster.yaml`. Sauvegarder ici reviendrait à
# ranger le double des clés dans la maison.
#
# LES BUCKETS NE SONT PAS PUBLICS PAR DÉFAUT (§11).
#
# Le bucket « privé » ne se lit que par URL signée à durée limitée. Le bucket
# « public » — images produit validées — peut être servi par CDN. La distinction
# est portée par `MediaTypePolicy` côté service, et c'est elle qui décide dans
# lequel un fichier atterrit ; ici on ne fait que les créer.
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/part-of: hba-express
        hba.express/role: datastore
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-10-13T13-34-11Z
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio
                  key: root-password
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          securityContext:
            allowPrivilegeEscalation: false
            # PAS DE `readOnlyRootFilesystem` ICI, CONTRAIREMENT AUX SERVICES.
            #
            # MinIO écrit ses métadonnées internes hors de /data. L'imposer ferait
            # échouer le démarrage sur un chemin que rien n'annonce.
            capabilities:
              drop: ["ALL"]
          # MinIO analyse son volume au démarrage. Sur 50 Gio et après un arrêt
          # brutal, le contrôle d'intégrité prend un temps que la liveness ne doit
          # pas interpréter comme une panne.
          startupProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            periodSeconds: 5
            failureThreshold: 60

          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: s3
      port: 9000
    - name: console
      port: 9001
