# ═══════════════════════════════════════════════════════════════════════════════
# LE MOT DE PASSE DE REDIS — VIDE DANS GIT (§12), COMME LES AUTRES SECRETS.
#
# CE QUI ÉTAIT CASSÉ : CE FICHIER N'EXISTAIT PAS — LE MÊME DÉFAUT QUE MINIO.
#
# `statefulset.yaml` lit `REDIS_PASSWORD` dans un Secret nommé `redis`, clé
# `password`, et AUCUN manifeste ne le déclarait. Le seul endroit où l'exigence
# apparaissait était le `secretKeyRef` lui-même — exactement la situation que
# `minio/secret.yaml` a été écrit pour corriger, restée ouverte ici.
#
# SUR UN CLUSTER NEUF, LE SYMPTÔME EST À DEUX CRANS DE LA CAUSE. Redis reste en
# `CreateContainerConfigError`, donc son Service n'a aucun endpoint, donc les
# dix-neuf services échouent à la connexion Redis — verrous distribués,
# idempotence, cache. Ce sont eux qu'on regarde, et leur configuration est
# correcte.
#
# LA VALEUR DOIT CONCORDER AVEC `REDIS__CONNECTIONSTRING` DE `hba-platform`.
#
# Les services ne lisent PAS ce Secret : ils lisent une chaîne de connexion
# complète dans `hba-platform`. Deux valeurs différentes ne lèvent nulle part au
# démarrage — elles se traduisent par des `NOAUTH Authentication required` au
# premier accès, longtemps après le déploiement. Poser les deux ensemble :
#
#   MDP="$(openssl rand -base64 24)"
#   kubectl -n hba-prod create secret generic redis \
#     --from-literal=password="$MDP" \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n hba-prod patch secret hba-platform --type merge \
#     -p "{\"stringData\":{\"REDIS__CONNECTIONSTRING\":\"redis:6379,password=$MDP\"}}"
#   unset MDP
#
# COMME LES AUTRES : IL RESTE HORS DES `resources` de la kustomization. Les
# valeurs ne sont jamais dans Git ; ce fichier ne sert qu'à rendre l'exigence
# lisible et à donner un contrat à `scripts/check-secrets-cluster.sh`.
#
# CE QUE CE FICHIER NE COUVRE PAS. Il ne met en place aucune persistance
# vérifiée ni aucune sauvegarde : le volume de Redis fait 5 Gi sur le disque
# unique du nœud. Ce qui y vit — verrous, idempotence, cache — est reconstruit
# après une perte, mais la fenêtre de reconstruction n'est pas gratuite.
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: redis
type: Opaque
stringData:
  password: ""
