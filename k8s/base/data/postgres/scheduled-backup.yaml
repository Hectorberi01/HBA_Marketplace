# ═══════════════════════════════════════════════════════════════════════════════
# SAUVEGARDE DE BASE COMPLÈTE, QUOTIDIENNE (§18).
#
# ELLE NE REMPLACE PAS L'ARCHIVAGE WAL — ELLE LE REND UTILISABLE.
#
# Le WAL continu déclaré dans `cluster.yaml` permet le PITR, mais rejouer six mois
# de journaux depuis une base complète unique prendrait des heures. Une base
# complète par jour borne le temps de restauration à « au pire, une journée de
# WAL à rejouer » — c'est ce qui rend le RTO de 60 minutes du §17 atteignable.
#
# 02h00 UTC : creux de charge côté Bénin (UTC+1).
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-quotidien
spec:
  # Six champs, pas cinq : CloudNativePG attend les secondes en tête.
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  cluster:
    name: postgres
