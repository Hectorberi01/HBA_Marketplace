# ═══════════════════════════════════════════════════════════════════════════════
# POSTGRESQL PAR CLOUDNATIVEPG (§10, §18).
#
# CE FICHIER SUPPOSE L'OPÉRATEUR DÉJÀ INSTALLÉ.
#
#   kubectl apply --server-side -f \
#     https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.24/releases/cnpg-1.24.0.yaml
#
# Sans lui, ce `Cluster` est créé et RIEN NE SE PASSE : aucun pod, aucune erreur.
# Un CRD sans contrôleur est un objet inerte dans etcd. C'est le premier piège de
# tout ce dossier, et il ne ressemble pas à une panne — il ressemble à l'attente.
#
# POURQUOI UN OPÉRATEUR PLUTÔT QU'UN StatefulSet ÉCRIT À LA MAIN.
#
# La décision D9 a acté que l'auto-hébergement met le §18 entièrement à notre
# charge : snapshots, WAL/PITR, rétention 30 jours, test de restauration mensuel.
# Écrit à la main, cela devient un CronJob `pg_basebackup` que personne n'a jamais
# restauré — et « une sauvegarde n'est valide qu'après un test de restauration »
# est la phrase exacte du §18.
#
# L'opérateur apporte le WAL continu, le PITR, la réplication synchrone et la
# bascule. Ce sont des choses qu'on ne veut pas écrire soi-même le jour où la
# primaire est perdue.
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  # TROIS INSTANCES : UNE PRIMAIRE, DEUX RÉPLICAS.
  #
  # Le §4 demande « DB managée ou nœud dédié + réplica » en production. Avec deux
  # instances seulement, la perte de la primaire laisse un survivant qui ne peut
  # plus former de quorum pour une bascule sûre. Trois est le premier nombre où
  # l'opérateur peut décider seul, sans arbitre humain à trois heures du matin.
  #
  # Les overlays dev et staging le ramènent à 1 : la haute disponibilité y coûte
  # deux nœuds pour une propriété que personne n'y observe.
  instances: 3

  imageName: ghcr.io/cloudnative-pg/postgresql:16.4

  # Ressources du §7. Postgres n'est pas un service stateless : `requests` et
  # `limits` sont ici la différence entre un plan d'exécution stable et un OOM
  # kill au milieu d'un checkout.
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "2Gi"

  postgresql:
    parameters:
      max_connections: "300"

      # LE POOL DE CHAQUE SERVICE SE MULTIPLIE PAR LE NOMBRE DE PODS.
      #
      # Npgsql ouvre jusqu'à 100 connexions par défaut, par processus. Quinze
      # services à deux replicas, c'est 3 000 connexions possibles pour 300
      # disponibles. Ce plafond n'est donc pas une limite théorique : c'est le
      # premier mur que la production rencontrera, et il se manifeste par
      # « remaining connection slots are reserved » sur un service au hasard.
      #
      # À résoudre par PgBouncer — l'opérateur fournit un `Pooler` — plutôt qu'en
      # montant ce nombre, chaque connexion Postgres coûtant un processus.
      shared_buffers: "512MB"

  storage:
    size: 20Gi

  # ═════════════════════════════════════════════════════════════════════════════
  # SAUVEGARDE CONTINUE — ET ELLE NE DOIT PAS VIVRE DANS CE CLUSTER.
  #
  # SAUVEGARDER LE CLUSTER DANS LE CLUSTER NE SAUVEGARDE RIEN.
  #
  # MinIO tourne à côté, dans le même namespace, sur les mêmes nœuds. Y archiver
  # les WAL donnerait un PITR parfaitement fonctionnel — jusqu'au jour où l'on en
  # a besoin, c'est-à-dire le jour où le cluster est perdu. La sauvegarde
  # disparaîtrait avec ce qu'elle protège.
  #
  # `destinationPath` doit donc pointer un stockage objet HORS cluster : OVH
  # Object Storage, compatible S3. C'est le seul endroit de toute l'infrastructure
  # où l'on paie délibérément une dépendance externe, et c'est pour cette raison.
  #
  # Le §18 demande aussi une rétention de 30 jours et un test de restauration
  # MENSUEL. Le premier est déclaré ci-dessous ; le second est une procédure, pas
  # un manifeste — voir `docs/RUNBOOKS.md`.
  # ═════════════════════════════════════════════════════════════════════════════
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: "s3://hba-backups/postgres"
      endpointURL: "https://s3.gra.io.cloud.ovh.net"
      s3Credentials:
        accessKeyId:
          name: postgres-backup-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: postgres-backup-s3
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
      data:
        compression: gzip

  # LES QUATORZE BASES NE SONT PAS CRÉÉES ICI.
  #
  # L'opérateur crée `app` et son propriétaire. Le §10 impose une base par service
  # (« database ownership per service ») : elles sont créées par le Job voisin,
  # qui est idempotent et rejouable — contrairement au script
  # `docker-entrypoint-initdb.d` du compose, qui ne s'exécute qu'au tout premier
  # démarrage du volume et se laisse oublier ensuite.
  bootstrap:
    initdb:
      database: app
      owner: hba
      secret:
        name: postgres-app
