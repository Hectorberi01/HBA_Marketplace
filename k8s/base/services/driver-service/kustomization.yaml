apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: driver-

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: driver-service
  - includeTemplates: true
    pairs:
      hba.express/domaine: delivery

resources:
  - ../_service

images:
  - name: hba/service
    newName: hba/driver-service

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: service
      spec:
        template:
          spec:
            containers:
              - name: service
                env:
                  - name: SERVICE_NAME
                    value: driver-service

                  # ═══════════════════════════════════════════════════════════
                  # LES TROIS SERVICES DE LIVRAISON PARTAGENT `hba_delivery`.
                  #
                  # C'est l'état réel du code : le compose de développement leur
                  # donne déjà la même base, et delivery-pricing-service LIT les
                  # tables que delivery-service crée. Trois clés distinctes
                  # pointent donc la même base et le même rôle — comme
                  # `cart-service` et `return-refund-service` sur `hba_commerce`.
                  #
                  # Une clé par service et non une clé partagée : le jour où
                  # l'un d'eux prend sa propre base, seule sa ligne bouge, et le
                  # Secret n'a pas à être relu en entier pour savoir qui est
                  # concerné.
                  # ═══════════════════════════════════════════════════════════
                  - name: CONNECTIONSTRINGS__DEFAULT
                    valueFrom:
                      secretKeyRef:
                        name: hba-platform
                        key: CONNECTIONSTRINGS__DRIVER

                  # L'identité gRPC de cet hôte. Le nom est celui de l'assemblage
                  # d'entrée — « HBA.Delivery.Driver.Api » — exactement comme l'écrit
                  # `scripts/generer-identites-internes.sh`. Se tromper de clé ne
                  # casse rien au démarrage : le pod part, signe sous une identité
                  # qui n'est pas la sienne, et tous ses appels reviennent en
                  # `Unauthenticated`.
                  - name: INTERNAL__PRIVATEKEY
                    valueFrom:
                      secretKeyRef:
                        name: hba-identites-internes
                        key: INTERNAL_KEY_HBA_DELIVERY_DRIVER_API
