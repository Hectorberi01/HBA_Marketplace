apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ═══════════════════════════════════════════════════════════════════════════════
# LES TREIZE SERVICES DES DOMAINES « common » ET « marketplace ».
#
# CETTE LISTE EN PORTAIT QUATORZE, ET SIX N'EXISTAIENT PLUS.
#
# `commerce-service`, `communication-service`, `engagement-service`,
# `financial-service`, `food-service` et `merchant-service` étaient nommés ici
# alors que le dépôt ne construit aucune image de ce nom depuis le redécoupage.
# À l'inverse, quinze processus réellement construits n'avaient aucun manifeste.
# Un `kubectl apply` aurait créé treize Deployments dont six auraient cherché des
# images inexistantes — `ImagePullBackOff`, sur des noms que personne ne
# reconnaîtrait.
#
# Renommés : commerce → cart, communication → notification, engagement → review,
# financial → payment, merchant → seller. Ajouté : return-refund.
#
# ═══ CE QUE CETTE LISTE NE COUVRE PAS, ET CE QUE ÇA DONNE ═══
#
# Les domaines `delivery` (delivery, driver, delivery-pricing, route) et
# `food` (restaurant, food-cart, food-order) ne sont PAS ici : ils font
# l'objet d'un second lot. Dispatch (D42), tracking et proof-of-delivery
# (D43) n'y figurent plus du tout : ils ont été retirés du dépôt.
#
# CONSÉQUENCE À CONNAÎTRE, ET ELLE EST VISIBLE DÈS LE PREMIER DÉPLOIEMENT : la
# passerelle déclare leurs adresses en `[Required, Url]` — elle démarrera donc
# normalement, mais chaque route vers ces SIX services répondra 502 —
# six et non sept : `route-service` n'a aucune entrée dans `ServicesOptions`,
# la passerelle ne lui parle donc jamais, déployé ou non. Ce n'est pas
# une panne à chercher, c'est le périmètre du lot. Les écrans concernés de la
# console d'administration l'annoncent de la même façon.
# ═══════════════════════════════════════════════════════════════════════════════

# ═══ CE PREMIER DÉPLOIEMENT NE PORTE QUE `common` ═══
#
# Sept services. `marketplace` suit immédiatement après : ses six entrées sont
# écrites ci-dessous, en commentaire, et leurs dossiers existent déjà — les
# décommenter est le seul geste à faire. Ses six bases sont créées elles aussi.
#
# POURQUOI DÉCOUPER ENCORE. Sept Deployments qui démarrent contre une base neuve,
# c'est sept endroits où un défaut de configuration peut se voir. Treize d'un coup
# double le bruit sans rien apprendre de plus — et le premier déploiement sert à
# APPRENDRE, pas à aller vite.

resources:
  # ── common ────────────────────────────────────────────────────────────────
  - identity-service
  - user-service
  - media-service
  # ═══════════════════════════════════════════════════════════════════════════
  # notification-service EST HORS DU LOT, ET CE N'EST PAS UN OUBLI.
  #
  # `NotificationsModuleInstaller` lève en production dans LES DEUX branches du
  # canal SMS : configuré, il refuse parce qu'aucun adaptateur `ISmsSender` de
  # production n'existe dans ce dépôt ; non configuré, il refuse parce que le SMS
  # est le canal OTP PAR DÉFAUT et qu'un code qui n'atteint personne est un échec
  # totalement silencieux. Il n'y a pas de troisième chemin : le pod partirait en
  # CrashLoopBackOff dès le premier démarrage.
  #
  # CE QUE SON ABSENCE COÛTE, ET C'EST À DIRE À VOIX HAUTE : aucun courriel ni
  # SMS ne part. Pas de vérification d'adresse, pas de « mot de passe oublié ».
  # Le compte administrateur amorcé par identity-service est donc le SEUL moyen
  # d'entrer, et son mot de passe ne se récupère pas.
  #
  # POUR LE RÉINTÉGRER : choisir un fournisseur SMS, écrire son adaptateur
  # `ISmsSender`, l'enregistrer dans l'installeur — ou retirer `SMS` de
  # `MfaChannels.All` côté identity et lever les deux garde-fous. Ses clés
  # (`INTERNAL_KEY_HBA_COMMUNICATION_API`, `CONNECTIONSTRINGS__NOTIFICATION`) et
  # son Secret `hba-notifications` sont déjà en place : décommenter la ligne
  # suivante suffira.
  # ═══════════════════════════════════════════════════════════════════════════
  # - notification-service
  - payment-service
  - promotion-service
  - review-service

  # ── delivery ──────────────────────────────────────────────────────────────
  #
  # Lot autonome : `delivery-service` n'enregistre qu'UN client gRPC —
  # `DeliveryPricing` — et son destinataire est dans le lot. Les trois partagent
  # `hba_delivery`, dont la base et le rôle existent depuis le premier passage de
  # `creer-bases.sh`.
  #
  # `route-service` EST LÀ DEPUIS LE 30 AOÛT, ET LA RAISON DE SON ABSENCE TIENT
  # TOUJOURS : l'audit du 27 août n'a trouvé aucun appelant dans le dépôt, et le
  # relevé du graphe gRPC le confirme — le domaine `route` n'apparaît dans la
  # liste d'appels d'AUCUN hôte.
  #
  # On le déploie quand même, sur décision explicite : la plateforme est mise en
  # production au complet, et un service absent est plus difficile à diagnostiquer
  # qu'un service inutilisé. CE QUE CELA COÛTE : un pod, sa part de mémoire, et
  # une base migrée que rien ne lit. Le jour où l'on cherche à réduire, c'est le
  # premier candidat.
  - delivery-service
  - driver-service
  - delivery-pricing-service
  - route-service

  # ── marketplace ───────────────────────────────────────────────────────────
  #
  # Ces six dossiers existaient, complets, et n'étaient référencés nulle part —
  # `kustomize build` les ignorait sans un mot pendant que l'overlay de production
  # déclarait pourtant leurs images. Le cluster n'aurait porté ni catalogue, ni
  # panier, ni commande, ni vendeur, et la passerelle aurait routé vers des
  # services inexistants. Un dossier non listé ne produit aucune erreur, seulement
  # une absence.
  #
  # `return-refund-service` DÉMARRE, mais deux de ses adaptateurs gRPC restent des
  # bouchons — `check-grpc-stubs.py` les nomme. La marchandise retournée n'est
  # jamais remise en stock, et aucune course d'enlèvement n'est créée alors qu'un
  # numéro de retour est rendu au client. Le déployer expose ces deux trous ; ne
  # pas le déployer les cache. On choisit de les exposer.
  - catalog-service
  - cart-service
  - inventory-service
  - order-service
  - seller-service
  - return-refund-service

  # ── food ──────────────────────────────────────────────────────────────────
  #
  # Les trois partagent `hba_food`. Chacun garde SA clé de chaîne de connexion :
  # le jour où l'un déménage vers sa propre base, on change une valeur de Secret
  # et aucun manifeste.
  - food-cart-service
  - food-order-service
  - restaurant-service
