apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# food-cart-service — domaine « food ». Reprend le gabarit commun `_service`.
#
# `namePrefix` renomme les cinq objets d'un coup — Deployment, Service,
# ServiceAccount, PDB, HPA — et kustomize suit les références :
# `serviceAccountName` et le `scaleTargetRef` du HPA sont réécrits sans qu'on
# ait à les nommer.

namePrefix: food-cart-

# `includeSelectors: true` EST CE QUI DISTINGUE CE SERVICE DES AUTRES.
#
# Le gabarit `_service` porte le sélecteur littéral
# `app.kubernetes.io/name: service`, identique dans les vingt dossiers. Sans
# l'injection dans les sélecteurs, chaque Deployment adopterait les pods des
# autres : tout répondrait, avec le mauvais service, et aucun pod ne serait en
# échec.
#
# ATTENTION SI LE CLUSTER TOURNE DÉJÀ : `spec.selector` est IMMUABLE. Modifier
# ces étiquettes sur un Deployment existant fait échouer `kubectl apply` — il
# faut alors le supprimer avant de réappliquer.
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: food-cart-service
  # Descriptive, et donc HORS du sélecteur : elle descend jusqu'aux pods pour
  # rendre `kubectl get pods -l hba.express/domaine=food` utile pendant un
  # déploiement par lot, sans rendre le sélecteur plus difficile à corriger.
  - includeTemplates: true
    pairs:
      hba.express/domaine: food

resources:
  - ../_service

images:
  # Le tag est posé par l'overlay : le §13 interdit `latest` en production, et
  # une image se promeut par SHA, jamais en reconstruisant.
  - name: hba/service
    newName: hba/food-cart-service

patches:
  # FUSION PAR NOM, ET NON PATCH POSITIONNEL. `/env/0/value` marcherait
  # aujourd'hui et changerait de cible en silence le jour où quelqu'un insère
  # une variable avant. La fusion stratégique apparie par la clé `name`.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: service
      spec:
        template:
          spec:
            containers:
              - name: service
                env:
                  - name: SERVICE_NAME
                    value: food-cart-service

                  # CHAQUE SERVICE SA CLÉ, MÊME QUAND LA BASE EST PARTAGÉE.
                  #
                  # food-cart-service écrit dans « hba_food », que food-cart, food-order et restaurant partagent.
                  # La clé du Secret reste propre au service : le jour où l'un
                  # d'eux déménage vers sa propre base, on change une valeur et
                  # aucun manifeste.
                  #
                  # Une entrée `env` explicite l'emporte sur l'`envFrom` du
                  # gabarit, qui monte `CONNECTIONSTRINGS__DEFAULT` à l'identique
                  # dans tous les pods.
                  - name: CONNECTIONSTRINGS__DEFAULT
                    valueFrom:
                      secretKeyRef:
                        name: hba-platform
                        key: CONNECTIONSTRINGS__FOODCART

                  # L'IDENTITÉ DE CET HÔTE, ET D'AUCUN AUTRE.
                  #
                  # Le nom présenté aux autres services est celui de l'assemblage
                  # d'entrée — « HBA.Food.Cart.Api » — car `Internal:ServiceName` n'est pas
                  # posé. La clé suit donc ce nom, exactement comme l'écrit
                  # `scripts/generer-identites-internes.sh`.
                  #
                  # Se tromper de clé ne casse RIEN au démarrage : le pod part,
                  # signe sous une identité qui n'est pas la sienne, et tous ses
                  # appels reviennent en `Unauthenticated`.
                  - name: INTERNAL__PRIVATEKEY
                    valueFrom:
                      secretKeyRef:
                        name: hba-identites-internes
                        key: INTERNAL_KEY_HBA_FOOD_CART_API
