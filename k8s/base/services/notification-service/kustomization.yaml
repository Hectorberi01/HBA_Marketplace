apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# notification-service — domaine « common ». Reprend le gabarit commun.
#
# `namePrefix: notification-` transforme « service » en « notification-service » sur les cinq
# objets d'un coup : Deployment, Service, ServiceAccount, PDB et HPA. Kustomize
# suit aussi les références — `serviceAccountName` et le `scaleTargetRef` du HPA
# sont réécrits sans qu'on ait à les nommer.

namePrefix: notification-

# ═══════════════════════════════════════════════════════════════════════════════
# `labels` ET NON `commonLabels` — ET LA DIFFÉRENCE N'EST PAS COSMÉTIQUE.
#
# Kustomize déprécie `commonLabels`. Le remplacer naïvement par `labels:` CASSE
# ce dossier en silence.
#
# `commonLabels` faisait DEUX choses : poser les étiquettes, ET les injecter dans
# les SÉLECTEURS. `labels:` seul ne fait que la première.
#
# Or le gabarit `_service` porte le sélecteur littéral
# `app.kubernetes.io/name: service` — le même dans les sept services. C'est
# exactement cette injection qui les distingue.
#
# SANS `includeSelectors: true`, LES SEPT DEPLOYMENTS PARTAGERAIENT UN SÉLECTEUR
# IDENTIQUE : chacun adopterait les pods des autres, et le Service d'identity
# répartirait le trafic vers les pods de payment. Tout répondrait — avec le
# mauvais service. Aucune erreur, aucun pod en échec.
#
# `hba.express/domaine` est dans un SECOND bloc, sans injection : c'est une
# étiquette descriptive, elle n'a rien à faire dans un sélecteur. `commonLabels`
# l'y mettait faute de pouvoir distinguer les deux.
#
# ATTENTION SI LE CLUSTER TOURNE DÉJÀ : `spec.selector` d'un Deployment est
# IMMUABLE. Modifier ces étiquettes sur un déploiement existant fait échouer
# `kubectl apply` — il faut alors supprimer le Deployment avant de réappliquer.
# ═══════════════════════════════════════════════════════════════════════════════
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: notification-service
  # `includeTemplates` ET NON `includeSelectors` : l'étiquette descend jusqu'aux
  # PODS — ce qui rend `kubectl get pods -l hba.express/domaine=common` utile
  # pendant un déploiement par domaine — sans entrer dans le sélecteur, où elle
  # n'aurait rien à faire et rendrait le sélecteur immuable plus difficile à
  # corriger.
  - includeTemplates: true
    pairs:
      hba.express/domaine: common

resources:
  - ../_service

images:
  # Le tag est posé par l'overlay : le §13 interdit `latest` en production, et
  # une image se promeut par SHA/semver, jamais en reconstruisant.
  - name: hba/service
    newName: hba/notification-service

patches:
  # FUSION PAR NOM, ET NON PATCH POSITIONNEL.
  #
  # `/env/0/value` aurait marché aujourd'hui et changé de cible en silence le jour
  # où quelqu'un insère une variable avant. La fusion stratégique apparie les
  # entrées par leur clé `name`.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: service
      spec:
        template:
          spec:
            containers:
              - name: service
                env:
                  - name: SERVICE_NAME
                    value: notification-service

                  # ═══════════════════════════════════════════════════════════
                  # CHAQUE SERVICE SA BASE, ET C'EST CETTE ENTRÉE QUI LE FAIT.
                  #
                  # Le Job `postgres-databases` crée les bases du §10 depuis le
                  # début. Rien ne les BRANCHAIT : le Secret partagé ne portait
                  # qu'une seule clé `CONNECTIONSTRINGS__DEFAULT`, montée à
                  # l'identique par `envFrom` sur tous les pods. Les bases
                  # étaient donc créées et aucun service ne pointait la sienne —
                  # les treize auraient migré dans la même.
                  #
                  # Une entrée `env` explicite l'emporte sur `envFrom` : le nom
                  # de variable reste celui que .NET attend, et la VALEUR vient
                  # d'une clé propre au service. Le mot de passe ne quitte pas le
                  # Secret, donc rien de sensible n'entre dans Git.
                  #
                  # Base « hba_communication » : celle qu'emploie déjà le compose de
                  # développement. La renommer ici ferait diverger les deux
                  # environnements pour un gain cosmétique.
                  # ═══════════════════════════════════════════════════════════
                  - name: CONNECTIONSTRINGS__DEFAULT
                    valueFrom:
                      secretKeyRef:
                        name: hba-platform
                        key: CONNECTIONSTRINGS__NOTIFICATION

                  # ═══════════════════════════════════════════════════════════
                  # L'IDENTITÉ DE CET HÔTE, ET D'AUCUN AUTRE.
                  #
                  # Le nom présenté aux autres services est celui de l'assemblage
                  # d'entrée — « HBA.Communication.Api » — car `Internal:ServiceName`
                  # n'est pas posé (la variable `SERVICE_NAME` ci-dessus est un
                  # autre réglage, elle ne l'alimente pas). La clé du Secret suit
                  # donc ce nom, exactement comme l'écrit
                  # `scripts/generer-identites-internes.sh`.
                  #
                  # Se tromper de clé ici ne casse RIEN au démarrage : le pod
                  # part, signe sous une identité qui n'est pas la sienne, et
                  # tous ses appels reviennent en `Unauthenticated`.
                  # ═══════════════════════════════════════════════════════════
                  - name: INTERNAL__PRIVATEKEY
                    valueFrom:
                      secretKeyRef:
                        name: hba-identites-internes
                        key: INTERNAL_KEY_HBA_COMMUNICATION_API

                  # ═══════════════════════════════════════════════════════════
                  # LE COMPTE DE SERVICE FIREBASE — UN CHEMIN, PAS UN CONTENU.
                  #
                  # `FcmOptions` accepte `ServiceAccountJson` en ligne ou
                  # `ServiceAccountPath` vers un fichier. On passe le CHEMIN : le
                  # JSON fait plusieurs kilo-octets et porte une clé privée PEM,
                  # qui n'a rien à faire dans l'environnement du processus. Le
                  # raisonnement complet est dans `secret-notifications.yaml`.
                  #
                  # SANS CE RÉGLAGE, LE SERVICE REFUSE DE DÉMARRER EN PRODUCTION.
                  # Ce n'est pas un confort : l'offre de course part au livreur
                  # par notification. Un `NullPushSender` en production, c'est un
                  # dispatch qui ne propose plus rien.
                  #
                  # LE CHEMIN DOIT S'ACCORDER AU `mountPath` PLUS BAS. Les deux
                  # sont à deux endroits du même fichier faute de pouvoir les
                  # écrire une fois — si l'un change, l'autre doit suivre, sans
                  # quoi `ResolveJson()` rend `null` et le refus de démarrage
                  # parle d'une configuration « non renseignée » alors qu'elle
                  # l'est.
                  # ═══════════════════════════════════════════════════════════
                  - name: NOTIFICATIONS__FCM__SERVICEACCOUNTPATH
                    value: /etc/hba/firebase/service-account.json

                  # ═══════════════════════════════════════════════════════════
                  # L'E-MAIL — RESEND. LA CLÉ SEULE EST UN SECRET.
                  #
                  # `EmailOptions.IsConfigured` exige les TROIS : `ApiKey`,
                  # `From` et `AppBaseUrl`. Les deux dernières ne sont pas des
                  # secrets et vivent dans le ConfigMap, où elles se relisent en
                  # revue et se surchargent par environnement — l'URL des liens
                  # cliquables n'est pas la même en staging et en production.
                  #
                  # SANS LES TROIS, LE SERVICE REFUSE DE DÉMARRER EN PRODUCTION.
                  # Le message le dit mieux que ce commentaire : sans canal
                  # e-mail, aucun mot de passe oublié ne se récupère, et les
                  # utilisateurs restent enfermés dehors définitivement.
                  #
                  # `secretKeyRef` ET NON `envFrom` : ce Secret porte aussi le
                  # compte de service Firebase, qui n'a rien à faire dans
                  # l'environnement du processus.
                  # ═══════════════════════════════════════════════════════════
                  - name: NOTIFICATIONS__EMAIL__APIKEY
                    valueFrom:
                      secretKeyRef:
                        name: hba-notifications
                        key: NOTIFICATIONS__EMAIL__APIKEY

                volumeMounts:
                  # `readOnly` EST REDONDANT SUR UN VOLUME DE SECRET — il l'est
                  # déjà — mais il le DIT, et le gabarit pose
                  # `readOnlyRootFilesystem: true` : un lecteur qui vérifie que
                  # rien n'écrit hors de /tmp n'a pas à aller chercher ailleurs.
                  - name: firebase
                    mountPath: /etc/hba/firebase
                    readOnly: true

            volumes:
              # LE SECRET EST DÉCLARÉ `optional: false`, ET C'EST VOULU.
              #
              # Absent, le pod reste en `ContainerCreating` avec un événement
              # explicite — « secret hba-notifications not found ». Avec
              # `optional: true` il démarrerait, ne trouverait pas le fichier, et
              # le refus de démarrage parlerait d'un FCM « non configuré » : on
              # chercherait une variable manquante au lieu d'un secret absent.
              - name: firebase
                secret:
                  secretName: hba-notifications
                  optional: false

                  # `items` RESTREINT LA PROJECTION À UN SEUL FICHIER.
                  #
                  # Un volume de Secret projette par défaut TOUTES ses clés. Ce
                  # Secret en porte deux — le compte de service ET la clé Resend —
                  # et sans cette liste, un fichier
                  # `NOTIFICATIONS__EMAIL__APIKEY` apparaîtrait à côté du JSON.
                  # Inoffensif, et trompeur : on lirait un répertoire « firebase »
                  # contenant un secret d'e-mail.
                  items:
                    - key: service-account.json
                      path: service-account.json
