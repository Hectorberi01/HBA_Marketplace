# ═══════════════════════════════════════════════════════════════════════════════
# PodDisruptionBudget (§7) — CONTRE LES ÉVICTIONS VOLONTAIRES, PAS LES PANNES.
#
# CE FICHIER POSAIT `minAvailable: 1`, ET C'ÉTAIT UN VERROU (audit, partie 3).
#
# Ce que disait l'ancien commentaire : « à un replica, ce budget empêcherait un
# `kubectl drain` d'aboutir : le nœud ne se viderait jamais. Kubernetes tranche
# en faveur du drain après un délai, mais l'opération devient bruyante pour rien. »
#
# LA SECONDE PHRASE EST FAUSSE, ET C'EST ELLE QUI RENDAIT LE DÉFAUT ACCEPTABLE.
# Kubernetes ne tranche JAMAIS en faveur du drain. L'API d'éviction rend 429 tant
# que le budget n'est pas satisfait, et `kubectl drain` réessaie INDÉFINIMENT. Il
# n'existe aucun délai au bout duquel le pod part : `--timeout` fait échouer la
# commande, il ne l'autorise pas. Sur un service à un seul replica — c'est-à-dire
# tous, hors des dix critiques de la prod — vider un nœud était donc IMPOSSIBLE,
# et rien dans la sortie de `drain` ne désigne le PDB comme la cause. On cherche
# du côté du pod, des volumes, du kubelet.
#
# ═══════════════════════════════════════════════════════════════════════════════
# `maxUnavailable: 1` DIT LA MÊME CHOSE, ET NE SE BLOQUE PAS.
#
# Les deux formes se calculent différemment :
#
#   minAvailable: 1   → évictions autorisées = sains − 1
#   maxUnavailable: 1 → évictions autorisées = 1 − (voulus − sains)
#
# À DEUX REPLICAS, elles sont ÉQUIVALENTES : une éviction à la fois, jamais les
# deux derniers pods ensemble. C'est exactement la garantie recherchée en prod.
#
# À UN SEUL REPLICA, elles divergent : `minAvailable: 1` autorise ZÉRO éviction et
# bloque le drain pour toujours ; `maxUnavailable: 1` en autorise UNE. Le pod part,
# le service est indisponible le temps d'un redémarrage — ce qui est de toute façon
# la seule issue possible à un replica — et la maintenance du nœud aboutit.
#
# À TROIS REPLICAS ET PLUS, `maxUnavailable: 1` est même PLUS STRICT :
# `minAvailable: 1` aurait laissé évincer deux pods sur trois d'un coup.
#
# ═══════════════════════════════════════════════════════════════════════════════
# CE QUE CE BUDGET NE COUVRE PAS, ET IL FAUT LE SAVOIR.
#
#   • IL NE PROTÈGE QUE DES ÉVICTIONS VOLONTAIRES. Un nœud qui tombe, un OOM, un
#     kubelet qui meurt : le budget n'a pas voix au chapitre. Il ne remplace pas
#     des replicas.
#
#   • À UN REPLICA, IL N'Y A PLUS DE PROTECTION DU TOUT — seulement l'absence de
#     blocage. C'est honnête : il n'existe rien à protéger quand il n'y a qu'un
#     pod. La vraie réponse est deux replicas, ce que l'overlay prod pose
#     désormais pour les dix services critiques, sur le HPA autant que sur le
#     Deployment.
#
#   • RIEN N'EMPÊCHE UN DRAIN DE VIDER PLUSIEURS SERVICES À LA FOIS. Chaque
#     budget raisonne sur SON service ; dix services à un replica sur le même
#     nœud partent tous ensemble, chacun dans son droit.
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: service
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: service
