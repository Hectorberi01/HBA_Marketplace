# Un ServiceAccount par workload (§19, moindre privilège). Aucun rôle ne lui est
# attaché : ces services n'appellent pas l'API Kubernetes. Le jeton n'est d'ailleurs
# pas monté — voir `automountServiceAccountToken` dans le Deployment.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: service

# ═══════════════════════════════════════════════════════════════════════════════
# LE SECRET DE TIRAGE VIT ICI, ET C'EST LE SEUL ENDROIT OÙ IL FONCTIONNE.
#
# CE QUI ÉTAIT CASSÉ. `docs/DEPLOIEMENT.md` §721 dit de poser le secret sur le
# compte `default` :
#
#     kubectl patch serviceaccount default -p '{"imagePullSecrets":[{"name":"ghcr"}]}'
#
# Or `deployment.yaml` pose `serviceAccountName: service`, que `namePrefix`
# renomme en `identity-service`, `user-service`, et ainsi de suite. AUCUN pod de
# service n'emploie `default` : la commande réussit, ne change rien, et les neuf
# Deployments restent en `ImagePullBackOff` sur un registre privé. Le message
# parle d'authentification, pas de compte de service — on cherche le jeton.
#
# Le déclarer sur ce gabarit le donne aux neuf comptes d'un coup, sans qu'aucune
# kustomization de service n'ait à y penser.
#
# CE QUE ÇA NE COUVRE PAS. Le Secret `ghcr` lui-même n'est pas ici — il porte un
# jeton GitHub, il est créé par `kubectl` (§12). S'il est absent, `kubelet` tire
# en anonyme : sur un dépôt PUBLIC ça marche, sur un dépôt privé non. Un dépôt
# rendu public plus tard masquerait donc l'oubli.
# ═══════════════════════════════════════════════════════════════════════════════
imagePullSecrets:
  - name: ghcr
