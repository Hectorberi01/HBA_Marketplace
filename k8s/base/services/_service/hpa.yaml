# ═══════════════════════════════════════════════════════════════════════════════
# HorizontalPodAutoscaler (§7) — CPU ET MÉMOIRE D'ABORD, MÉTRIQUES MÉTIER ENSUITE.
#
# LA MÉMOIRE EST UN MAUVAIS SIGNAL D'AUTOSCALING POUR .NET, ET ELLE EST
#    DÉLIBÉRÉMENT ABSENTE.
#
# Le ramasse-miettes de .NET ne rend pas la mémoire au système tant qu'il n'y est
# pas contraint : l'occupation monte, se stabilise haut, et ne redescend pas.
# Une règle sur la mémoire ajouterait donc des pods sans jamais les retirer, puis
# resterait bloquée au maximum. Le CPU, lui, suit la charge réelle.
#
# Le §7 dit « CPU/mémoire puis métriques applicatives » : les secondes viendront
# quand Prometheus Adapter exposera le RPS et la latence, qui sont les vrais
# signaux pour un service web.
#
# ═══════════════════════════════════════════════════════════════════════════════
# `minReplicas` EST LE VRAI NOMBRE DE PODS AU REPOS — PAS `spec.replicas`.
#
# Dès qu'un HPA cible un Deployment, c'est LUI qui écrit `spec.replicas` à chaque
# réconciliation. La valeur posée sur le Deployment n'est plus que le point de
# départ du premier lancement.
#
# C'est ce qui a produit le défaut relevé par l'audit : l'overlay prod passait dix
# services critiques à `replicas: 2` et ne touchait pas aux HPA, restés à
# `minReplicas: 1`. Quelques minutes après le déploiement, sous faible charge, les
# dix retombaient à UN pod. La redondance était écrite dans le dépôt, relue en
# revue, et jamais obtenue en production — sans qu'aucun signal ne la démente.
#
# Le gabarit garde `1` : c'est le bon défaut pour un service non critique, en dev
# comme en staging. La prod patche désormais les DEUX valeurs, côte à côte dans
# `overlays/prod/kustomization.yaml`, pour qu'elles ne puissent plus diverger.
#
# À VÉRIFIER APRÈS TOUT DÉPLOIEMENT : `kubectl get hpa` rend `MINPODS` et
# `REPLICAS`. C'est la seule lecture qui dise ce qui tourne vraiment ;
# `kubectl get deploy` montre ce que le HPA vient d'y écrire, pas une intention.
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    # Monter vite, redescendre lentement : une descente trop réactive coupe des
    # pods pendant un creux de dix secondes, et la remontée coûte un démarrage
    # complet — celui-là même que la startupProbe prévoit long.
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
