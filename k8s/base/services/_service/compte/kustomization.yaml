# ═══════════════════════════════════════════════════════════════════════════════
# LE COMPTE DE SERVICE, SEUL, DANS SON PROPRE DOSSIER.
#
# POURQUOI CE DÉCOUPAGE EXISTE.
#
# Les Jobs de migration ont besoin du MÊME compte de service que le Deployment
# qu'ils précèdent — c'est lui qui porte `imagePullSecrets: [ghcr]`, et c'est son
# nom que `serviceAccountName` doit désigner.
#
# La première tentative référençait le fichier directement :
#
#     - ../../services/_service/serviceaccount.yaml
#
# Kustomize refuse : « security; file ... is not in or below ... ». Un FICHIER
# doit se trouver dans le dossier de la kustomization ou en dessous. Un
# RÉPERTOIRE qui porte sa propre kustomization, en revanche, se référence de
# n'importe où — c'est le mécanisme des bases.
#
# D'où ce dossier. Le compte reste défini UNE FOIS : `_service` l'inclut pour les
# Deployments, `migrations/<service>` l'inclut pour les Jobs, et les deux
# reçoivent exactement le même objet — y compris le secret de tirage. Une copie
# aurait divergé au premier changement.
#
# CE QUE ÇA NE COUVRE PAS. Appliquer les deux kustomizations pose deux fois le
# même ServiceAccount. C'est sans conséquence — `apply` est idempotent — mais
# cela veut dire que supprimer l'overlay des migrations ne retire pas le compte,
# et réciproquement.
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - serviceaccount.yaml
