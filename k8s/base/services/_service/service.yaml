# Service ClusterIP (§3) : les communications internes ne sortent jamais du
# cluster. Aucun `type: LoadBalancer` ici — seul l'Ingress est exposé (§1).
apiVersion: v1
kind: Service
metadata:
  name: service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: service
  ports:
    - name: http
      port: 8080
      targetPort: http
    # LE PORT gRPC EST DANS LE MÊME Service, ET IL RESTE PRIVÉ.
    #
    # Le §5 le classe « privé » : c'est l'absence de route Ingress vers 9090 qui
    # le garantit, pas l'absence de port ici. Les services se découvrent par DNS
    # Kubernetes (§8) — `http://identity-service:9090` depuis n'importe quel pod
    # du namespace — et c'est la NetworkPolicy qui décide qui a le droit.
    - name: grpc
      port: 9090
      targetPort: grpc
