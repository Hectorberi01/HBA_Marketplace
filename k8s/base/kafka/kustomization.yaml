apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Le cluster seulement. Les `KafkaTopic` vivent dans les overlays : le §19.2 met
# l'environnement DANS le nom du topic, donc les trois listes diffèrent. Elles
# sont générées depuis les `[HbaEvent]` du code par
# `scripts/k8s-kafka-topics.py`, et `check-k8s.py` vérifie qu'elles sont à jour.
resources:
  - cluster.yaml
  # Le pool porte le nombre de brokers et leur stockage. En mode
  # `node-pools: enabled`, sans lui l'opérateur ne crée aucun broker et
  # laisse le Kafka en NotReady, sans pod à inspecter.
  - node-pool.yaml
