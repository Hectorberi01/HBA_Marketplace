      CONNECTIONSTRINGS__DEFAULT: Host=${HBA_PGHOST:-10.20.0.2};Port=5432;Database=hba_delivery;Username=hba_delivery;Password=${HBA_DELIVERY_PASSWORD:?mot de passe de hba_delivery absent}
      REDIS__CONNECTIONSTRING: redis:6379
