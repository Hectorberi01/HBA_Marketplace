# ═══════════════════════════════════════════════════════════════════════════════
# ENGENDRÉ PAR scripts/generer-compose-prod.py — NE PAS ÉDITER À LA MAIN.
#
# La source est `docker-compose.dev.yml`, seule description complète des vingt
# services. Modifier un service là-bas, puis relancer le script : un second
# compose écrit à la main divergerait au premier changement de variable, et la
# divergence ne se verrait qu'en production.
#
# LES VALEURS NE SONT PAS ICI. Chaque secret est une référence `${VAR:?...}` :
# Compose REFUSE de démarrer si la variable est absente, plutôt que de lancer un
# service avec une chaîne vide. Les valeurs vivent dans un fichier d'environnement
# hors du dépôt — voir docs/RUNBOOK-COMPOSE.md.
#
# CE QUE CE FICHIER NE PORTE PAS : le proxy TLS qui sert api.hba-express.com, la
# création des buckets MinIO, et les migrations de base. Tout est dans le runbook.
#
# SERVICES ÉCARTÉS, ET POURQUOI :
#
#   postgres
#     la base vit sur un second VPS, jointe par le tunnel
#
#   redis-ui
#     console d'exploration — jamais en production
#
#   kafka-ui
#     console d'exploration — jamais en production
#
#   minio-init
#     amorçage de développement ; en production, voir le runbook
#
#   return-refund-service
#     deux adaptateurs gRPC restent des bouchons — la marchandise retourné
#     e n'est jamais remise en stock, et aucune course d'enlèvement n'est 
#     créée alors qu'un numéro est rendu au client.
#
#   notification-service
#     aucun adaptateur ISmsSender de production n'existe ; le SMS est le c
#     anal OTP par défaut, et NotificationsModuleInstaller lève dans les d
#     eux branches. CONSÉQUENCE : aucun courriel ni SMS ne part.
# ═══════════════════════════════════════════════════════════════════════════════

# ═════════════════════════════════════════════════════════════════════════════
# LES CLES PARTAGEES PAR TOUS LES SERVICES.
#
# Meme forme que `x-dev-auth` dans le compose de developpement, memes cles —
# et c'est voulu : ce que les services attendent ne se decide pas ici. Seules
# les valeurs changent, remplacees par des references obligatoires.
#
# AUTHENTICATION__SIGNINGKEY et JWT__SIGNINGKEY doivent porter la MEME valeur :
# identity-service signe avec l'une, les autres verifient avec l'autre.
#
# INTERNAL__APIKEY doit etre IDENTIQUE partout — l'appelant la presente,
# l'appele la compare. Une divergence rend `NotFound`, muet sur la cause.
#
# SECURITY__SECRETPROTECTION__KEY ne se regenere PAS : ce qu'elle a chiffre ne
# se dechiffre pas avec la suivante.
# ═════════════════════════════════════════════════════════════════════════════
x-prod-auth: &prod-auth
  AUTHENTICATION__ISSUER: hba-identity
  AUTHENTICATION__AUDIENCE: hba-platform
  AUTHENTICATION__SIGNINGKEY: ${AUTHENTICATION__SIGNINGKEY:?AUTHENTICATION__SIGNINGKEY est obligatoire en production}
  INTERNAL__APIKEY: ${INTERNAL__APIKEY:?INTERNAL__APIKEY est obligatoire en production}
  # INTERNAL__IDENTITESNONSIGNEES : retire — identites gRPC non signees : `AddHbaGrpc` leve hors Development.
  SECURITY__SECRETPROTECTION__KEY: ${SECURITY__SECRETPROTECTION__KEY:?SECURITY__SECRETPROTECTION__KEY est obligatoire en production}

services:

  redis:
    container_name: hba-redis
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    # `ports:` retiré : publier sur le VPS, c'est publier sur Internet.
    # Les services se joignent par le réseau `hba-backend`.
    networks:
      - hba-backend

    restart: unless-stopped

  kafka:
    container_name: hba-kafka
    image: confluentinc/cp-kafka:8.3.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    # `ports:` retiré : publier sur le VPS, c'est publier sur Internet.
    # Les services se joignent par le réseau `hba-backend`.
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - hba-backend

    restart: unless-stopped

  minio:
    container_name: hba-minio
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER est obligatoire en production}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD est obligatoire en production}
    # `ports:` retiré : publier sur le VPS, c'est publier sur Internet.
    # Les services se joignent par le réseau `hba-backend`.
    volumes:
      - minio-data:/data
    networks:
      - hba-backend

    restart: unless-stopped

  rembg:
    container_name: hba-rembg
    image: ghcr.io/hectorberi01/rembg:${HBA_TAG:?le tag d'image est obligatoire}
    build:
      context: infra/rembg
    volumes:
      # Le modèle survit aux redémarrages : sans ce volume, 176 Mo repartent à
      # chaque `up`, et le premier détourage expire.
      - rembg-models:/root/.u2net
    networks:
      - hba-backend

    restart: unless-stopped

  identity-service:
    container_name: hba-identity-service
    image: ghcr.io/hectorberi01/identity-service:${HBA_TAG:?le tag d'image est obligatoire}
    build:
      context: .
      dockerfile: services/common/identity-service/Dockerfile
    environment:
      <<: *prod-auth
      SERVICE_NAME: identity-service
      ASPNETCORE_ENVIRONMENT: Production
      HOSTING__HTTPPORT: 8080
      HOSTING__GRPCPORT: 9090
      CONNECTIONSTRINGS__DEFAULT: Host=${HBA_PGHOST:-10.20.0.2};Port=5432;Database=hba_identity;Username=hba_identity;Password=${HBA_IDENTITY_PASSWORD:?mot de passe de hba_identity absent}
      REDIS__CONNECTIONSTRING: redis:6379
      KAFKA__BOOTSTRAPSERVERS: kafka:29092
      KAFKA__CONSUMERGROUP: hba-identity-service
      KAFKA__PRODUCER: identity-service
      JWT__ISSUER: hba-identity
      JWT__AUDIENCE: hba-platform
      JWT__SIGNINGKEY: ${JWT__SIGNINGKEY:?JWT__SIGNINGKEY est obligatoire en production}
      AUTHENTICATION__ISSUER: hba-identity
      AUTHENTICATION__AUDIENCE: hba-platform
      AUTHENTICATION__SIGNINGKEY: ${AUTHENTICATION__SIGNINGKEY:?AUTHENTICATION__SIGNINGKEY est obligatoire en production}

      # LE PREMIER ADMINISTRATEUR — SANS LUI, LA CONSOLE RESTE FERMÉE.
      #
      # Créer un admin exige d'être admin ; sur une base neuve personne ne l'est.
      # L'amorçage casse la boucle. Il est IDEMPOTENT : au deuxième démarrage il
      # ne touche à rien, et ne réinitialise jamais le mot de passe — sans quoi
      # en changer depuis l'application serait sans effet.
      #
      # Ces valeurs sont écrites en clair, comme le reste de ce fichier. Hors
      # Development, identity-service REFUSE de démarrer si elles manquent.
      ADMIN__EMAIL: hector.adjakpa@hbatechettrade.com
      ADMIN__PASSWORD: ${ADMIN__PASSWORD:?ADMIN__PASSWORD est obligatoire en production}
      ADMIN__FIRSTNAME: Admin
      ADMIN__LASTNAME: HBA
      ADMIN__PHONE: "+22900000000"
    depends_on:
      # postgres : retire — la base vit sur un second VPS, jointe par le tunnel.
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [hba-backend]

    restart: unless-stopped

  user-service:
    container_name: hba-user-service
    image: ghcr.io/hectorberi01/user-service:${HBA_TAG:?le tag d'image est obligatoire}
    build:
      context: .
      dockerfile: services/common/user-service/Dockerfile
    environment:
      <<: *prod-auth
      SERVICE_NAME: user-service
      ASPNETCORE_ENVIRONMENT: Production
      HOSTING__HTTPPORT: 8080
      HOSTING__GRPCPORT: 9090
      CONNECTIONSTRINGS__DEFAULT: Host=${HBA_PGHOST:-10.20.0.2};Port=5432;Database=hba_user;Username=hba_user;Password=${HBA_USER_PASSWORD:?mot de passe de hba_user absent}
      REDIS__CONNECTIONSTRING: redis:6379
      KAFKA__BOOTSTRAPSERVERS: kafka:29092
      KAFKA__CONSUMERGROUP: hba-user-service
      KAFKA__PRODUCER: user-service
      SERVICES__IDENTITY: http://identity-service:9090
    depends_on:
      # postgres : retire — la base vit sur un second VPS, jointe par le tunnel.
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      identity-service:
        condition: service_started
    networks: [hba-backend]

    restart: unless-stopped

  media-service:
    container_name: hba-media-service
    image: ghcr.io/hectorberi01/media-service:${HBA_TAG:?le tag d'image est obligatoire}
    build:
      context: .
      dockerfile: services/common/media-service/Dockerfile
    environment:
      <<: *prod-auth
      SERVICE_NAME: media-service
      ASPNETCORE_ENVIRONMENT: Production
      HOSTING__HTTPPORT: 8080
      HOSTING__GRPCPORT: 9090
      CONNECTIONSTRINGS__DEFAULT: Host=${HBA_PGHOST:-10.20.0.2};Port=5432;Database=hba_media;Username=hba_media;Password=${HBA_MEDIA_PASSWORD:?mot de passe de hba_media absent}
      KAFKA__BOOTSTRAPSERVERS: kafka:29092
      KAFKA__CONSUMERGROUP: hba-media-service
      KAFKA__PRODUCER: media-service
      # ═════════════════════════════════════════════════════════════════════
      # CES QUATRE CLÉS S'APPELAIENT `OBJECTSTORAGE__*` ET NE LIAIENT RIEN.
      #
      # `ObjectStorageOptions.SectionName` vaut « Media:Storage » : le préfixe
      # d'environnement correct est donc `MEDIA__STORAGE__`. Les noms de
      # propriétés ne correspondaient pas davantage — `AccessKeyId` et
      # `SecretAccessKey`, pas `ACCESSKEY`/`SECRETKEY` — et `USESSL` n'existe pas
      # du tout.
      #
      # Conséquence : `IsConfigured` rendait faux, et `MediaModuleInstaller`
      # basculait sur `InMemoryObjectStorage`. Toutes les photos produit vivaient
      # dans un dictionnaire, perdues à chaque redémarrage, avec des URL que rien
      # ne servait. C'est la cause de « l'image ne s'affiche pas » — MinIO
      # tournait, mais personne ne lui parlait.
      #
      # Le service AVERTIT au démarrage (`UnconfiguredStorageWarning`) : la ligne
      # était dans les journaux depuis le début.
      # ═════════════════════════════════════════════════════════════════════
      MEDIA__STORAGE__ENDPOINT: http://minio:9000
      MEDIA__STORAGE__ACCESSKEYID: ${MEDIA__STORAGE__ACCESSKEYID:?MEDIA__STORAGE__ACCESSKEYID est obligatoire en production}
      MEDIA__STORAGE__SECRETACCESSKEY: ${MEDIA__STORAGE__SECRETACCESSKEY:?MEDIA__STORAGE__SECRETACCESSKEY est obligatoire en production}
      MEDIA__STORAGE__REGION: us-east-1
      MEDIA__STORAGE__PUBLICBUCKET: hba-public
      MEDIA__STORAGE__PRIVATEBUCKET: hba-private

      # L'URL PUBLIQUE DOIT ÊTRE JOIGNABLE DEPUIS LE TÉLÉPHONE, PAS DEPUIS LE
      #    RÉSEAU DOCKER.
      #
      # Sans cette valeur, `GetPublicUrl` retombe sur l'`Endpoint`, donc
      # « http://minio:9000/... » — un nom que seul un conteneur résout. Sur un
      # appareil physique, l'image ne charge jamais, et sans message : le widget
      # affiche simplement son icône de repli.
      #
      # `HOST_LAN_IP` doit valoir l'adresse du Mac sur le Wi-Fi — la même que
      # celle passée à `--dart-define=API_BASE_URL`. En production, ce sera le
      # domaine du CDN.
      MEDIA__STORAGE__PUBLICBASEURL: http://${HOST_LAN_IP:-localhost}:9000/hba-public
    depends_on:
      # postgres : retire — la base vit sur un second VPS, jointe par le tunnel.
      kafka:
        condition: service_healthy
      # minio-init : retire — amorçage de développement ; en production, voir le runbook.
      minio:
        condition: service_started
    networks: [hba-backend]

    restart: unless-stopped

  seller-service:
    container_name: hba-seller-service
    image: ghcr.io/hectorberi01/seller-service:${HBA_TAG:?le tag d'image est obligatoire}
    build:
      context: .
      dockerfile: services/marketplace/seller-service/Dockerfile
    environment:
      <<: *prod-auth
      SERVICE_NAME: seller-service
      ASPNETCORE_ENVIRONMENT: Production
      HOSTING__HTTPPORT: 8080
      HOSTING__GRPCPORT: 9090
      CONNECTIONSTRINGS__DEFAULT: Host=${HBA_PGHOST:-10.20.0.2};Port=5432;Database=hba_merchant;Username=hba_merchant;Password=${HBA_MERCHANT_PASSWORD:?mot de passe de hba_merchant absent}
      KAFKA__BOOTSTRAPSERVERS: kafka:29092
      KAFKA__CONSUMERGROUP: hba-seller-service
      KAFKA__PRODUCER: seller-service
      SERVICES__IDENTITY: http://identity-service:9090
      SERVICES__MEDIA: http://media-service:9090
      # SANS ELLE, L'HÔTE NE SE CONSTRUIT PAS. Le rattachement d'un lieu
      # d'expédition vérifie désormais qu'il appartient bien à ce vendeur, et
      # `AddInventoryGrpcClient` lève à la construction si l'adresse manque.
      SERVICES__INVENTORY: http://inventory-service:9090
      # Le compteur de ventes est RECALCULÉ depuis order-service à chaque commande
      # confirmée : `AddOrderingGrpcClient` lève à la construction sans cette adresse.
      SERVICES__ORDER: http://order-service:9090
      # ═══════════════════════════════════════════════════════════════════════
      # LE CACHE D'AUTORISATION DES MEMBRES VIT ICI, ET NULLE PART AILLEURS.
      #
      # `MerchantAccessApi` mémorise « ce compte, ce vendeur, ces capacités » et
      # l'évince dans le MÊME `SaveChangesAsync` que la mutation qui le périme.
      # C'est ce qui rend la révocation d'un membre immédiate sur toutes les
      # répliques (§53) — mais seulement si le cache est PARTAGÉ.
      #
      # Sans cette ligne, `AddBuildingBlocksInfrastructure` retombe sur un cache
      # EN MÉMOIRE, par instance, et l'annonce au démarrage. Une seule réplique
      # en local, donc aucune conséquence visible — et c'est précisément le
      # problème : la pile de dev cesserait de ressembler à la production sur le
      # point le plus difficile à déboguer une fois là-bas.
      #
      # review-service l'avait, seller-service ne l'avait pas. C'était un
      # oubli du lot 0a, qui n'avait câblé que `infra/docker/compose.services.yml`.
      # ═══════════════════════════════════════════════════════════════════════
      REDIS__CONNECTIONSTRING: redis:6379
    depends_on:
      # postgres : retire — la base vit sur un second VPS, jointe par le tunnel.
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      identity-service:
        condition: service_started
      media-service:
        condition: service_started
    networks: [hba-backend]

    restart: unless-stopped

  catalog-service:
    container_name: hba-catalog-service
    image: ghcr.io/hectorberi01/catalog-service:${HBA_TAG:?le tag d'image est obligatoire}
    build:
      context: .
      dockerfile: services/marketplace/catalog-service/Dockerfile
    environment:
      <<: *prod-auth
      SERVICE_NAME: catalog-service
      ASPNETCORE_ENVIRONMENT: Production
      HOSTING__HTTPPORT: 8080
      HOSTING__GRPCPORT: 9090
      CONNECTIONSTRINGS__DEFAULT: Host=${HBA_PGHOST:-10.20.0.2};Port=5432;Database=hba_catalog;Username=hba_catalog;Password=${HBA_CATALOG_PASSWORD:?mot de passe de hba_catalog absent}
      REDIS__CONNECTIONSTRING: redis:6379
      KAFKA__BOOTSTRAPSERVERS: kafka:29092
      KAFKA__CONSUMERGROUP: hba-catalog-service
      KAFKA__PRODUCER: catalog-service
      SERVICES__MERCHANT: http://seller-service:9090
      SERVICES__MEDIA: http://media-service:9090
      SERVICES__INVENTORY: http://inventory-service:9090
      # SANS CETTE CLÉ, `CatalogModuleInstaller` INSTALLE `NullImageProcessor`.
      #
      # Le détourage échouait pour cette raison, et non parce que Cloudinary était
      # en panne : ni `Media:Rembg` ni `Media:Cloudinary` n'étaient renseignés, le
      # processeur nul se déclarait indisponible, et l'application affichait « Le
      # détourage a échoué ».
      MEDIA__REMBG__BASEURL: http://rembg:7000
      MEDIA__REMBG__TIMEOUTSECONDS: "120"
    depends_on:
      # postgres : retire — la base vit sur un second VPS, jointe par le tunnel.
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      seller-service:
        condition: service_started
      media-service:
        condition: service_started
      rembg:
        condition: service_started
    networks: [hba-backend]

    restart: unless-stopped

  inventory-service:
    container_name: hba-inventory-service
    image: ghcr.io/hectorberi01/inventory-service:${HBA_TAG:?le tag d'image est obligatoire}
    build:
      context: .
      dockerfile: services/marketplace/inventory-service/Dockerfile
    environment:
      <<: *prod-auth
      SERVICE_NAME: inventory-service
      ASPNETCORE_ENVIRONMENT: Production
      HOSTING__HTTPPORT: 8080
      HOSTING__GRPCPORT: 9090
      CONNECTIONSTRINGS__DEFAULT: Host=${HBA_PGHOST:-10.20.0.2};Port=5432;Database=hba_inventory;Username=hba_inventory;Password=${HBA_INVENTORY_PASSWORD:?mot de passe de hba_inventory absent}
      REDIS__CONNECTIONSTRING: redis:6379
      KAFKA__BOOTSTRAPSERVERS: kafka:29092
      KAFKA__CONSUMERGROUP: hba-inventory-service
      KAFKA__PRODUCER: inventory-service
      SERVICES__CATALOG: http://catalog-service:9090
      SERVICES__MERCHANT: http://seller-service:9090
    depends_on:
      # postgres : retire — la base vit sur un second VPS, jointe par le tunnel.
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      catalog-service:
        condition: service_started
      seller-service:
        condition: service_started
    networks: [hba-backend]

    restart: unless-stopped

  cart-service:
    container_name: hba-cart-service
    image: ghcr.io/hectorberi01/cart-service:${HBA_TAG:?le tag d'image est obligatoire}
    build:
      context: .
      dockerfile: services/marketplace/cart-service/Dockerfile
    environment:
      <<: *prod-auth
      SERVICE_NAME: cart-service
      ASPNETCORE_ENVIRONMENT: Production
      HOSTING__HTTPPORT: 8080
      HOSTING__GRPCPORT: 9090
      CONNECTIONSTRINGS__DEFAULT: Host=${HBA_PGHOST:-10.20.0.2};Port=5432;Database=hba_commerce;Username=hba_commerce;Password=${HBA_COMMERCE_PASSWORD:?mot de passe de hba_commerce absent}
      REDIS__CONNECTIONSTRING: redis:6379
      KAFKA__BOOTSTRAPSERVERS: kafka:29092
      KAFKA__CONSUMERGROUP: hba-cart-service
      KAFKA__PRODUCER: cart-service
      SERVICES__CATALOG: http://catalog-service:9090
      SERVICES__INVENTORY: http://inventory-service:9090
      SERVICES__ORDER: http://order-service:9090
      SERVICES__FOOD: http://restaurant-service:9090
      SERVICES__MERCHANT: http://seller-service:9090

      # ═══════════════════════════════════════════════════════════════════════
      # AJOUTÉE AVEC `AddPromotionGrpcClient`, ET DANS LE MÊME GESTE (ISSUE-033).
      #
      # `NeutralPricingModuleApi` rendait `SellerDiscount: 0, PlatformDiscount: 0,
      # FinalAmount = BaseAmount` et refusait TOUT coupon : aucune campagne
      # commerciale n'était possible, et promotion-service — complet, avec son
      # domaine, ses règles, ses coupons et son API gRPC — n'était appelé par
      # personne.
      #
      # Sans cette ligne, `AddPromotionGrpcClient` lève à la CONSTRUCTION de
      # l'hôte. C'est voulu : un panier qui démarre sans savoir joindre promotion
      # refuserait silencieusement tous les coupons, et les clients paieraient le
      # plein tarif sans que rien ne le signale.
      # ═══════════════════════════════════════════════════════════════════════
      SERVICES__PROMOTION: http://promotion-service:9090
    depends_on:
      # postgres : retire — la base vit sur un second VPS, jointe par le tunnel.
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      catalog-service:
        condition: service_started
      inventory-service:
        condition: service_started
    networks: [hba-backend]

    restart: unless-stopped

  order-service:
    container_name: hba-order-service
    image: ghcr.io/hectorberi01/order-service:${HBA_TAG:?le tag d'image est obligatoire}
    build:
      context: .
      dockerfile: services/marketplace/order-service/Dockerfile
    environment:
      <<: *prod-auth
      SERVICE_NAME: order-service
      ASPNETCORE_ENVIRONMENT: Production
      HOSTING__HTTPPORT: 8080
      HOSTING__GRPCPORT: 9090
      CONNECTIONSTRINGS__DEFAULT: Host=${HBA_PGHOST:-10.20.0.2};Port=5432;Database=hba_order;Username=hba_order;Password=${HBA_ORDER_PASSWORD:?mot de passe de hba_order absent}
      REDIS__CONNECTIONSTRING: redis:6379
      KAFKA__BOOTSTRAPSERVERS: kafka:29092
      KAFKA__CONSUMERGROUP: hba-order-service
      KAFKA__PRODUCER: order-service
      SERVICES__COMMERCE: http://cart-service:9090
      SERVICES__CATALOG: http://catalog-service:9090
      SERVICES__INVENTORY: http://inventory-service:9090
      SERVICES__FINANCIAL: http://payment-service:9090
      SERVICES__FOOD: http://restaurant-service:9090
      SERVICES__DELIVERY: http://delivery-service:9090
      SERVICES__USER: http://user-service:9090

      # LE DEVIS DE COURSE, RELU AU CHECKOUT.
      #
      # delivery-pricing ET NON delivery : `DeliveryApi.LookupQuote` n'a jamais
      # eu de corps de serveur, et delivery-service n'a plus de domaine de
      # tarification. `AddDeliveryPricingGrpcClient` LÈVE au démarrage sans cette
      # adresse — c'est ce qui empêche un checkout de repartir en 500 silencieux.
      SERVICES__DELIVERYPRICING: http://delivery-pricing-service:9090

      # AJOUTÉ AVEC `AddMerchantsGrpcClient`, ET DANS LE MÊME GESTE.
      #
      # `GET /api/sellers/{sellerId}/orders` doit prouver que l'appelant EST ce
      # vendeur : le jeton porte un identifiant d'utilisateur, la route un
      # identifiant de vendeur, et seul seller-service connaît la
      # correspondance.
      #
      # Sans cette ligne, `AddMerchantsGrpcClient` lève à la CONSTRUCTION de
      # l'hôte — le conteneur sort avant que la sonde n'existe, et rien dans
      # `docker compose ps` ne dit pourquoi.
      SERVICES__MERCHANT: http://seller-service:9090
    depends_on:
      # postgres : retire — la base vit sur un second VPS, jointe par le tunnel.
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      cart-service:
        condition: service_started
      inventory-service:
        condition: service_started
    networks: [hba-backend]

    restart: unless-stopped

  restaurant-service:
    container_name: hba-restaurant-service
    image: ghcr.io/hectorberi01/restaurant-service:${HBA_TAG:?le tag d'image est obligatoire}
    build:
      context: .
      dockerfile: services/food/restaurant-service/Dockerfile
    environment:
