      KAFKA__CONSUMERGROUP: hba-media-service
      KAFKA__PRODUCER: media-service
      MEDIA__STORAGE__ENDPOINT: http://minio:9000
      MEDIA__STORAGE__ACCESSKEYID: hba-minio
      MEDIA__STORAGE__SECRETACCESSKEY: hba-minio-secret
      MEDIA__STORAGE__REGION: us-east-1
      MEDIA__STORAGE__PUBLICBUCKET: hba-public
      MEDIA__STORAGE__PRIVATEBUCKET: hba-private
      MEDIA__STORAGE__PUBLICBASEURL: http://${HOST_LAN_IP:-localhost}:9000/hba-public
