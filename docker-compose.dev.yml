      KAFKA__CONSUMERGROUP: hba-review-service
      KAFKA__PRODUCER: review-service
      SERVICES__CATALOG: http://catalog-service:9090
      SERVICES__FOOD: http://restaurant-service:9090
      SERVICES__ORDER: http://order-service:9090
      SERVICES__USER: http://user-service:9090
      SERVICES__MERCHANT: http://seller-service:9090
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      catalog-service:
        condition: service_started
      order-service:
        condition: service_started
    networks: [hba-backend]

  notification-service:
