# ═══════════════════════════════════════════════════════════════════════════
# PILE DE DÉVELOPPEMENT LOCAL — services applicatifs + passerelle, sur une machine.
#
# C'EST DESORMAIS LA SEULE PILE COMPOSE DU DEPOT.
# 
# Ces lignes disaient qu'elle etait « volontairement distincte de
# infra/docker/compose*.yml, qui vise un serveur ». Ce dossier a ete retire
# le 2026-08-26 vers `_to_delete/2026-08-26-pile-compose-serveur/` : rien ne
# le lancait, il portait les treize anciens noms de service, et son contexte
# de construction sortait du depot. La cible serveur, c'est `k8s/`.
#
# LES SECRETS DE CE FICHIER SONT PUBLICS, ET C'EST ASSUMÉ.
#
# `hba`/`hba` en base, une clé de signature en clair : ce fichier est versionné
# et lisible de tous. Il ne doit JAMAIS servir ailleurs qu'en local. En HMAC, la
# clé qui vérifie est celle qui signe — qui lit ce fichier forge un jeton Admin.
# ═══════════════════════════════════════════════════════════════════════════

# UNE SEULE CLÉ, PARTAGÉE PAR LES QUATORZE CONTENEURS.
#
# identity-service SIGNE, les douze autres services et la passerelle VÉRIFIENT.
# En HMAC c'est la même clé des deux côtés : la moindre divergence produit un
# 401 sans le moindre message — le jeton est valide, il est simplement rejeté.
#
# C'est exactement ce qui se passait avant : seul identity recevait
# `Authentication__*`. Les douze autres services démarraient sans clé, et
# `AddAuthentication` n'installe alors NI `IssuerSigningKey` NI l'épinglage
# d'algorithme : chaque appel authentifié tombait en 401, sans erreur au
# démarrage pour l'expliquer.
x-dev-auth: &dev-auth
  AUTHENTICATION__ISSUER: hba-identity
  AUTHENTICATION__AUDIENCE: hba-platform
  AUTHENTICATION__SIGNINGKEY: hba-development-signing-key-32bytes-minimum

  # SANS CETTE CLÉ, AUCUN APPEL gRPC ENTRE SERVICES N'ABOUTIT.
  #
  # `InternalCallServerInterceptor` refuse tout appel quand `Internal:ApiKey`
  # est vide — et c'est le bon choix : laisser passer « puisqu'il n'y a rien à
  # vérifier » ouvrirait l'API interne au réseau entier au moindre oubli de
  # variable, sans aucun symptôme.
  #
  # Mais elle n'était renseignée NULLE PART. Chaque appel inter-services
  # échouait donc en
  #
  #     Unavailable : Internal API not configured.
  #
  # côté serveur, après un aller-retour HTTP réussi — ce qui envoie chercher un
  # problème de réseau ou de routage là où il n'y en a pas.
  #
  # Elle doit être IDENTIQUE partout : l'appelant la présente, l'appelé la
  # compare. Une divergence rendrait `NotFound`, réponse volontairement muette
  # qui ne dit pas qu'une clé est en cause.
  INTERNAL__APIKEY: hba-development-internal-key

  # ═══════════════════════════════════════════════════════════════════════════
  # IDENTITÉ D'APPELANT gRPC EN DÉVELOPPEMENT : NON SIGNÉE, ET SEULEMENT ICI.
  #
  # CE DRAPEAU EMPÊCHE L'HÔTE DE DÉMARRER HORS `Development`.
  #
  # `AddHbaGrpc` lève à la construction — pas au premier appel — si l'
  # environnement n'est pas `Development`. Une configuration de production qui
  # l'hériterait par recopie ne part pas.
  #
  # POURQUOI PAS DE VRAIES CLÉS ICI.
  #
  # Une clé privée est propre à UN hôte : elle ne peut pas vivre dans cette
  # ancre, qui est partagée par les vingt-trois. Les câbler demanderait
  # vingt-trois lignes de base64 recopiées à la main, plus un registre de trois
  # kilo-octets sur une seule ligne. Personne ne relit cela, et une erreur s'y
  # manifeste par un `Unauthenticated` sans cause lisible.
  #
  # CE QUI RESTE VÉRIFIÉ EN DÉVELOPPEMENT : la table `AutorisationsGrpc`. Un
  # appel non autorisé est refusé ici comme en production — donc une entrée
  # manquante se voit en montant la pile de développement, et non au premier
  # déploiement.
  #
  # CE QUI NE L'EST PAS : l'authenticité du nom présenté. Sur ce réseau de
  # développement, n'importe quel processus peut se dire n'importe qui — au
  # même degré que la clé interne écrite en clair juste au-dessus.
  # ═══════════════════════════════════════════════════════════════════════════
  INTERNAL__IDENTITESNONSIGNEES: "true"

  # LES CODES DE VÉRIFICATION ET DE RÉINITIALISATION NE TRAVERSENT PLUS LE BUS
  # EN CLAIR.
  #
  # Ils partaient tels quels dans `PasswordResetRequestedIntegrationEvent` et
  # `EmailVerificationRequestedIntegrationEvent` : sur un topic Kafka retenu
  # sept jours, ET en clair dans `identity.outbox_messages.Content`. Un accès
  # en LECTURE — une sauvegarde, un export analytique — suffisait à prendre
  # n'importe quel compte : le code EST le justificatif, la boîte mail n'est
  # que le canal de livraison.
  #
  # identity chiffre, notifications déchiffre. La clé doit donc être IDENTIQUE
  # des deux côtés : une divergence ne se voit pas au démarrage, elle se voit
  # quand plus aucun e-mail ne part — le déchiffrement lève et le message
  # finit en lettre morte.
  #
  # Cette valeur-ci est exactement la clé de développement intégrée
  # (SHA-256 d'une phrase fixe). Elle est PUBLIQUE, comme tout ce fichier ;
  # elle est écrite ici pour que la variable existe et se voie, pas pour
  # protéger quoi que ce soit. En production, `AesGcmSecretProtector` REFUSE
  # de démarrer sans clé fournie.
  SECURITY__SECRETPROTECTION__KEY: qn3pI+unmhy+CoohrVuLMPSlwHniiS6yMfMknVsofdY=

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hba
      POSTGRES_PASSWORD: hba
      POSTGRES_DB: hba

    # SANS SONDE, `condition: service_healthy` EST IMPOSSIBLE À EXPRIMER.
    #
    # Un conteneur postgres est « démarré » bien avant d'accepter une connexion :
    # l'entrypoint lance d'abord un serveur temporaire pour exécuter les scripts
    # de `docker-entrypoint-initdb.d`, puis redémarre. Les services applicatifs
    # tombaient dans cette fenêtre.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hba -d hba"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

      # SANS CE MONTAGE, LES BASES APPLICATIVES N'EXISTENT PAS.
      #
      # Chaque service reçoit `Database=hba_xxx`, mais l'image postgres ne crée
      # que celle de `POSTGRES_DB`. Le script était déjà écrit — il n'était
      # monté que par la pile serveur. Les services échouaient donc sur
      # « database does not exist », sans que rien ne désigne la
      # cause.
      #
      # IL NE S'EXÉCUTE QU'AU PREMIER DÉMARRAGE DU VOLUME.
      #
      # `docker-entrypoint-initdb.d` est ignoré si `postgres-data` contient déjà
      # des données. Si les bases manquent encore après cette correction :
      #   docker compose -f docker-compose.dev.yml down -v
      # LE MONTAGE POINTAIT UN CRAN TROP HAUT, ET NE CREAIT DONC RIEN.
      #
      # C'etait `./infra/docker/postgres`, dont le contenu est le seul
      # sous-repertoire `init/`. L'entrypoint de l'image postgres parcourt
      # les FICHIERS de /docker-entrypoint-initdb.d et ignore les
      # repertoires : le script etait monte, visible, et jamais lu.
      # Le commentaire ci-dessus affirmait le contraire depuis le debut.
      # Le repertoire a quitte `infra/docker/`, retire du depot : cette pile
      # etait le seul lecteur du script, et le dossier ne contenait par
      # ailleurs qu'une pile compose morte.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - hba-backend

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"
    networks:
      - hba-backend

  redis-ui:
    image: rediscommander/redis-commander:latest
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8082:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - hba-backend

  kafka:
    image: confluentinc/cp-kafka:8.3.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - hba-backend

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: hba-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - hba-backend

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hba-minio
      MINIO_ROOT_PASSWORD: hba-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - hba-backend

  # ═══════════════════════════════════════════════════════════════════════
  # CRÉE LES DEUX BUCKETS, ET OUVRE LE PUBLIC EN LECTURE ANONYME.
  #
  # RIEN DANS LE CODE NE CRÉE LE BUCKET. `S3CompatibleObjectStorage` fait un
  # `PutObject` et échoue en 404 « NoSuchBucket » si le bucket n'existe pas. Le
  # créer au démarrage du service aurait exigé de lui donner le droit de créer
  # des buckets — un privilège qu'un service applicatif ne doit pas porter en
  # production.
  #
  # LA POLITIQUE `download` EST INDISPENSABLE, ET C'EST LE PIÈGE SUIVANT.
  #
  # Un bucket MinIO est PRIVÉ par défaut : sans elle, l'URL publique rend 403 et
  # la photo ne s'affiche pas — exactement le même symptôme qu'un bucket
  # manquant, pour une cause différente. `hba-private` reste fermé : il ne se lit
  # que par URL signée (pièces KYB, photos de litige).
  #
  # `mc` est idempotent avec `--ignore-existing` : le conteneur peut tourner à
  # chaque `up` sans effet de bord.
  # ═══════════════════════════════════════════════════════════════════════
  # ═══════════════════════════════════════════════════════════════════════
  # DÉTOURAGE DES PHOTOS PRODUIT — segmentation locale, pas de compte tiers.
  #
  #  AUCUN PORT PUBLIÉ, ET C'EST UNE RÈGLE, PAS UN OUBLI.
  #
  # Le serveur rembg n'a ni authentification ni limitation de débit : exposé, il
  # devient un service d'inférence gratuit pour n'importe qui, et un moyen simple
  # de saturer la machine. `RembgOptions` le dit explicitement. Seul
  # catalog-service l'appelle, par le réseau interne.
  #
  # LE PREMIER APPEL EST LENT : le modèle u2net (~176 Mo) se télécharge puis
  # se met en session. D'où `TIMEOUTSECONDS` large côté catalog-service — et le
  # fait que l'échec de détourage soit RÉESSAYABLE côté application plutôt que
  # bloquant.
  #
  # LICENCE : u2net est publié en usage NON COMMERCIAL. Pour la production, il
  # faudra soit un modèle sous licence permissive, soit un prestataire (le
  # `CloudinaryImageProcessor` existe déjà pour ça). Acceptable en développement,
  # à trancher avant la mise en ligne.
  # ═══════════════════════════════════════════════════════════════════════
  # CONSTRUITE SUR PLACE, PAS TIRÉE DU REGISTRE : `danielgatis/rembg:latest`
  # n'est publiée qu'en linux/amd64 et échoue sur Apple Silicon (« no matching
  # manifest for linux/arm64/v8 »). Forcer `platform: linux/amd64` marcherait,
  # mais ferait tourner l'inférence sous émulation — le pire cas pour du calcul
  # matriciel. Voir l'encadré du Dockerfile.
  rembg:
    build:
      context: infra/rembg
    volumes:
      # Le modèle survit aux redémarrages : sans ce volume, 176 Mo repartent à
      # chaque `up`, et le premier détourage expire.
      - rembg-models:/root/.u2net
    networks:
      - hba-backend

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set hba http://minio:9000 hba-minio hba-minio-secret; do
        echo 'MinIO pas encore prêt, nouvelle tentative dans 2 s'; sleep 2;
      done;
      mc mb --ignore-existing hba/hba-public;
      mc mb --ignore-existing hba/hba-private;
      mc anonymous set download hba/hba-public;
      echo 'Buckets prêts : hba-public (lecture anonyme), hba-private (URL signée).';
      "
    networks: [hba-backend]

  identity-service:
    build:
      context: .
      dockerfile: services/common/identity-service/Dockerfile
    environment:
      <<: *dev-auth
      SERVICE_NAME: identity-service
      ASPNETCORE_ENVIRONMENT: Development
      HOSTING__HTTPPORT: 8080
      HOSTING__GRPCPORT: 9090
      CONNECTIONSTRINGS__DEFAULT: Host=postgres;Port=5432;Database=hba_identity;Username=hba;Password=hba
      REDIS__CONNECTIONSTRING: redis:6379
      KAFKA__BOOTSTRAPSERVERS: kafka:29092
      KAFKA__CONSUMERGROUP: hba-identity-service
      KAFKA__PRODUCER: identity-service
      JWT__ISSUER: hba-identity
      JWT__AUDIENCE: hba-platform
      JWT__SIGNINGKEY: hba-development-signing-key-32bytes-minimum
      AUTHENTICATION__ISSUER: hba-identity
      AUTHENTICATION__AUDIENCE: hba-platform
      AUTHENTICATION__SIGNINGKEY: hba-development-signing-key-32bytes-minimum

      # LE PREMIER ADMINISTRATEUR — SANS LUI, LA CONSOLE RESTE FERMÉE.
      #
      # Créer un admin exige d'être admin ; sur une base neuve personne ne l'est.
      # L'amorçage casse la boucle. Il est IDEMPOTENT : au deuxième démarrage il
      # ne touche à rien, et ne réinitialise jamais le mot de passe — sans quoi
      # en changer depuis l'application serait sans effet.
      #
      # Ces valeurs sont écrites en clair, comme le reste de ce fichier. Hors
      # Development, identity-service REFUSE de démarrer si elles manquent.
      ADMIN__EMAIL: admin@hba.local
      ADMIN__PASSWORD: Admin123!
      ADMIN__FIRSTNAME: Admin
      ADMIN__LASTNAME: HBA
      ADMIN__PHONE: "+22900000000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [hba-backend]

  user-service:
    build:
      context: .
      dockerfile: services/common/user-service/Dockerfile
    environment:
      <<: *dev-auth
      SERVICE_NAME: user-service
      ASPNETCORE_ENVIRONMENT: Development
      HOSTING__HTTPPORT: 8080
      HOSTING__GRPCPORT: 9090
      CONNECTIONSTRINGS__DEFAULT: Host=postgres;Port=5432;Database=hba_user;Username=hba;Password=hba
      REDIS__CONNECTIONSTRING: redis:6379
      KAFKA__BOOTSTRAPSERVERS: kafka:29092
      KAFKA__CONSUMERGROUP: hba-user-service
      KAFKA__PRODUCER: user-service
      SERVICES__IDENTITY: http://identity-service:9090
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      identity-service:
        condition: service_started
    networks: [hba-backend]

  media-service:
    build:
      context: .
      dockerfile: services/common/media-service/Dockerfile
    environment:
      <<: *dev-auth
      SERVICE_NAME: media-service
      ASPNETCORE_ENVIRONMENT: Development
      HOSTING__HTTPPORT: 8080
      HOSTING__GRPCPORT: 9090
      CONNECTIONSTRINGS__DEFAULT: Host=postgres;Port=5432;Database=hba_media;Username=hba;Password=hba
      KAFKA__BOOTSTRAPSERVERS: kafka:29092
      KAFKA__CONSUMERGROUP: hba-media-service
      KAFKA__PRODUCER: media-service
      # ═════════════════════════════════════════════════════════════════════
      # CES QUATRE CLÉS S'APPELAIENT `OBJECTSTORAGE__*` ET NE LIAIENT RIEN.
      #
      # `ObjectStorageOptions.SectionName` vaut « Media:Storage » : le préfixe
      # d'environnement correct est donc `MEDIA__STORAGE__`. Les noms de
      # propriétés ne correspondaient pas davantage — `AccessKeyId` et
      # `SecretAccessKey`, pas `ACCESSKEY`/`SECRETKEY` — et `USESSL` n'existe pas
      # du tout.
      #
      # Conséquence : `IsConfigured` rendait faux, et `MediaModuleInstaller`
      # basculait sur `InMemoryObjectStorage`. Toutes les photos produit vivaient
      # dans un dictionnaire, perdues à chaque redémarrage, avec des URL que rien
      # ne servait. C'est la cause de « l'image ne s'affiche pas » — MinIO
      # tournait, mais personne ne lui parlait.
      #
      # Le service AVERTIT au démarrage (`UnconfiguredStorageWarning`) : la ligne
      # était dans les journaux depuis le début.
      # ═════════════════════════════════════════════════════════════════════
      MEDIA__STORAGE__ENDPOINT: http://minio:9000
      MEDIA__STORAGE__ACCESSKEYID: hba-minio
      MEDIA__STORAGE__SECRETACCESSKEY: hba-minio-secret
      MEDIA__STORAGE__REGION: us-east-1
      MEDIA__STORAGE__PUBLICBUCKET: hba-public
      MEDIA__STORAGE__PRIVATEBUCKET: hba-private

      # L'URL PUBLIQUE DOIT ÊTRE JOIGNABLE DEPUIS LE TÉLÉPHONE, PAS DEPUIS LE
      #    RÉSEAU DOCKER.
      #
      # Sans cette valeur, `GetPublicUrl` retombe sur l'`Endpoint`, donc
      # « http://minio:9000/... » — un nom que seul un conteneur résout. Sur un
      # appareil physique, l'image ne charge jamais, et sans message : le widget
      # affiche simplement son icône de repli.
      #
      # `HOST_LAN_IP` doit valoir l'adresse du Mac sur le Wi-Fi — la même que
      # celle passée à `--dart-define=API_BASE_URL`. En production, ce sera le
      # domaine du CDN.
      MEDIA__STORAGE__PUBLICBASEURL: http://${HOST_LAN_IP:-localhost}:9000/hba-public
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      minio:
        condition: service_started
    networks: [hba-backend]

  seller-service:
    build:
      context: .
      dockerfile: services/marketplace/seller-service/Dockerfile
    environment:
      <<: *dev-auth
      SERVICE_NAME: seller-service
      ASPNETCORE_ENVIRONMENT: Development
      HOSTING__HTTPPORT: 8080
      HOSTING__GRPCPORT: 9090
      CONNECTIONSTRINGS__DEFAULT: Host=postgres;Port=5432;Database=hba_merchant;Username=hba;Password=hba
      KAFKA__BOOTSTRAPSERVERS: kafka:29092
      KAFKA__CONSUMERGROUP: hba-seller-service
      KAFKA__PRODUCER: seller-service
      SERVICES__IDENTITY: http://identity-service:9090
      SERVICES__MEDIA: http://media-service:9090
      # SANS ELLE, L'HÔTE NE SE CONSTRUIT PAS. Le rattachement d'un lieu
      # d'expédition vérifie désormais qu'il appartient bien à ce vendeur, et
      # `AddInventoryGrpcClient` lève à la construction si l'adresse manque.
      SERVICES__INVENTORY: http://inventory-service:9090
      # Le compteur de ventes est RECALCULÉ depuis order-service à chaque commande
      # confirmée : `AddOrderingGrpcClient` lève à la construction sans cette adresse.
      SERVICES__ORDER: http://order-service:9090
      # ═══════════════════════════════════════════════════════════════════════
      # LE CACHE D'AUTORISATION DES MEMBRES VIT ICI, ET NULLE PART AILLEURS.
      #
      # `MerchantAccessApi` mémorise « ce compte, ce vendeur, ces capacités » et
      # l'évince dans le MÊME `SaveChangesAsync` que la mutation qui le périme.
      # C'est ce qui rend la révocation d'un membre immédiate sur toutes les
      # répliques (§53) — mais seulement si le cache est PARTAGÉ.
      #
      # Sans cette ligne, `AddBuildingBlocksInfrastructure` retombe sur un cache
      # EN MÉMOIRE, par instance, et l'annonce au démarrage. Une seule réplique
      # en local, donc aucune conséquence visible — et c'est précisément le
      # problème : la pile de dev cesserait de ressembler à la production sur le
      # point le plus difficile à déboguer une fois là-bas.
      #
      # review-service l'avait, seller-service ne l'avait pas. C'était un
      # oubli du lot 0a, qui n'avait câblé que `infra/docker/compose.services.yml`.
      # ═══════════════════════════════════════════════════════════════════════
      REDIS__CONNECTIONSTRING: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      identity-service:
        condition: service_started
      media-service:
        condition: service_started
    networks: [hba-backend]

  catalog-service:
    build:
      context: .
      dockerfile: services/marketplace/catalog-service/Dockerfile
    environment:
      <<: *dev-auth
      SERVICE_NAME: catalog-service
      ASPNETCORE_ENVIRONMENT: Development
      HOSTING__HTTPPORT: 8080
      HOSTING__GRPCPORT: 9090
      CONNECTIONSTRINGS__DEFAULT: Host=postgres;Port=5432;Database=hba_catalog;Username=hba;Password=hba
      REDIS__CONNECTIONSTRING: redis:6379
      KAFKA__BOOTSTRAPSERVERS: kafka:29092
      KAFKA__CONSUMERGROUP: hba-catalog-service
      KAFKA__PRODUCER: catalog-service
      SERVICES__MERCHANT: http://seller-service:9090
      SERVICES__MEDIA: http://media-service:9090
      SERVICES__INVENTORY: http://inventory-service:9090
      # SANS CETTE CLÉ, `CatalogModuleInstaller` INSTALLE `NullImageProcessor`.
      #
      # Le détourage échouait pour cette raison, et non parce que Cloudinary était
      # en panne : ni `Media:Rembg` ni `Media:Cloudinary` n'étaient renseignés, le
      # processeur nul se déclarait indisponible, et l'application affichait « Le
      # détourage a échoué ».
      MEDIA__REMBG__BASEURL: http://rembg:7000
      MEDIA__REMBG__TIMEOUTSECONDS: "120"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      seller-service:
        condition: service_started
      media-service:
        condition: service_started
