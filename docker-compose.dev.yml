include:
  # ANALYTICS PORTE SA PROPRE DEFINITION, dans son dossier, a cote de son
  # code. Ce fichier ne la decrit plus : il la reunit avec les autres.
  - services/common/analytics-service/docker-compose.yml

x-dev-auth: &dev-auth
  AUTHENTICATION__ISSUER: hba-identity
  AUTHENTICATION__AUDIENCE: hba-platform
  AUTHENTICATION__SIGNINGKEY: hba-development-signing-key-32bytes-minimum
  INTERNAL__APIKEY: hba-development-internal-key
  INTERNAL__IDENTITESNONSIGNEES: "true"
  SECURITY__SECRETPROTECTION__KEY: qn3pI+unmhy+CoohrVuLMPSlwHniiS6yMfMknVsofdY=

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hba
      POSTGRES_PASSWORD: hba
      POSTGRES_DB: hba
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hba -d hba"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - hba-backend

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"
    networks:
      - hba-backend

  redis-ui:
    image: rediscommander/redis-commander:latest
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8082:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - hba-backend

  kafka:
    image: confluentinc/cp-kafka:8.3.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - hba-backend

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: hba-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - hba-backend

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hba-minio
      MINIO_ROOT_PASSWORD: hba-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - hba-backend
  rembg:
    build:
      context: infra/rembg
    volumes:
      - rembg-models:/root/.u2net
    networks:
      - hba-backend

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set hba http://minio:9000 hba-minio hba-minio-secret; do
        echo 'MinIO pas encore prêt, nouvelle tentative dans 2 s'; sleep 2;
      done;
      mc mb --ignore-existing hba/hba-public;
      mc mb --ignore-existing hba/hba-private;
      mc anonymous set download hba/hba-public;
      echo 'Buckets prêts : hba-public (lecture anonyme), hba-private (URL signée).';
      "
    networks: [hba-backend]

  identity-service:
    build:
      context: .
      dockerfile: services/common/identity-service/Dockerfile
    environment:
      <<: *dev-auth
      SERVICE_NAME: identity-service
      ASPNETCORE_ENVIRONMENT: Development
      HOSTING__HTTPPORT: 8080
      HOSTING__GRPCPORT: 9090
      CONNECTIONSTRINGS__DEFAULT: Host=postgres;Port=5432;Database=hba_identity;Username=hba;Password=hba
      REDIS__CONNECTIONSTRING: redis:6379
      KAFKA__BOOTSTRAPSERVERS: kafka:29092
      KAFKA__CONSUMERGROUP: hba-identity-service
      KAFKA__PRODUCER: identity-service
      JWT__ISSUER: hba-identity
      JWT__AUDIENCE: hba-platform
      JWT__SIGNINGKEY: hba-development-signing-key-32bytes-minimum
      AUTHENTICATION__ISSUER: hba-identity
      AUTHENTICATION__AUDIENCE: hba-platform
      AUTHENTICATION__SIGNINGKEY: hba-development-signing-key-32bytes-minimum
      ADMIN__EMAIL: admin@hba.local
      ADMIN__PASSWORD: Admin123!
      ADMIN__FIRSTNAME: Admin
      ADMIN__LASTNAME: HBA
      ADMIN__PHONE: "+22900000000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [hba-backend]

  user-service:
