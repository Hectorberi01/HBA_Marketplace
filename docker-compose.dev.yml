    build:
      context: .
      dockerfile: services/delivery/delivery-service/Dockerfile
    environment:
      <<: *dev-auth
      SERVICE_NAME: delivery-service
      ASPNETCORE_ENVIRONMENT: Development
      HOSTING__HTTPPORT: 8080
      HOSTING__GRPCPORT: 9090
      CONNECTIONSTRINGS__DEFAULT: Host=postgres;Port=5432;Database=hba_delivery;Username=hba;Password=hba
      REDIS__CONNECTIONSTRING: redis:6379
      KAFKA__BOOTSTRAPSERVERS: kafka:29092
      KAFKA__CONSUMERGROUP: hba-delivery-service
      KAFKA__PRODUCER: delivery-service
      SERVICES__ORDER: http://order-service:9090
      SERVICES__USER: http://user-service:9090
      SERVICES__MERCHANT: http://seller-service:9090
      SERVICES__FOOD: http://restaurant-service:9090
      SERVICES__MEDIA: http://media-service:9090
      SERVICES__FINANCIAL: http://payment-service:9090
      SERVICES__DELIVERYPRICING: http://delivery-pricing-service:9090
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      order-service:
        condition: service_started
      media-service:
        condition: service_started
      delivery-pricing-service:
        condition: service_started
    networks: [hba-backend]

  driver-service:
    build:
      context: .
      dockerfile: services/delivery/driver-service/Dockerfile
    environment:
      <<: *dev-auth
      SERVICE_NAME: driver-service
      ASPNETCORE_ENVIRONMENT: Development
      HOSTING__HTTPPORT: 8080
      HOSTING__GRPCPORT: 9090
      CONNECTIONSTRINGS__DEFAULT: Host=postgres;Port=5432;Database=hba_delivery;Username=hba;Password=hba
      REDIS__CONNECTIONSTRING: redis:6379
      KAFKA__BOOTSTRAPSERVERS: kafka:29092
      KAFKA__CONSUMERGROUP: hba-driver-service
      KAFKA__PRODUCER: driver-service
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [hba-backend]

  route-service:
    build:
      context: .
      dockerfile: services/delivery/route-service/Dockerfile
    environment:
      <<: *dev-auth
      SERVICE_NAME: route-service
      ASPNETCORE_ENVIRONMENT: Development
      HOSTING__HTTPPORT: 8080
      HOSTING__GRPCPORT: 9090
      CONNECTIONSTRINGS__DEFAULT: Host=postgres;Port=5432;Database=hba_delivery;Username=hba;Password=hba
      REDIS__CONNECTIONSTRING: redis:6379
      KAFKA__BOOTSTRAPSERVERS: kafka:29092
      KAFKA__CONSUMERGROUP: hba-route-service
      KAFKA__PRODUCER: route-service
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [hba-backend]

  payment-service:
    build:
      context: .
      dockerfile: services/common/payment-service/Dockerfile
    environment:
      <<: *dev-auth
      SERVICE_NAME: payment-service
      ASPNETCORE_ENVIRONMENT: Development
      HOSTING__HTTPPORT: 8080
      HOSTING__GRPCPORT: 9090
      CONNECTIONSTRINGS__DEFAULT: Host=postgres;Port=5432;Database=hba_financial;Username=hba;Password=hba
      REDIS__CONNECTIONSTRING: redis:6379
      KAFKA__BOOTSTRAPSERVERS: kafka:29092
      KAFKA__CONSUMERGROUP: hba-payment-service
      KAFKA__PRODUCER: payment-service
      SERVICES__ORDER: http://order-service:9090
      SERVICES__MERCHANT: http://seller-service:9090
      SERVICES__USER: http://user-service:9090
      SERVICES__CATALOG: http://catalog-service:9090
      SERVICES__FOOD: http://restaurant-service:9090

      # LE SECOND UNIVERS DE COMMANDES (lot 6.1).
      #
      # `SERVICES__FOOD` juste au-dessus vise restaurant-service : les menus, les
      # tickets de cuisine. Celui-ci vise food-order-service, qui porte les
      # COMMANDES de repas — c'est chez lui que `IPayableOrderReader` va lire le
      # montant et l'acheteur d'une commande food à payer.
      #
      # Sans cette ligne, `AddFoodOrdersGrpcClient` lève au démarrage : le service
      # ne part pas, plutôt que d'échouer au premier paiement de repas.
      SERVICES__FOODORDER: http://food-order-service:9090

      # AJOUTÉ AVEC `AddDeliveryGrpcClient`, POUR DEUX RAISONS.
      #
      #   • le gain du livreur : `CreditDriverOnDeliveryCompletedHandler`
      #     consomme la fin de course — sans quoi le montant est calculé,
      #     publié, et tombe dans le vide ;
      #   • l'autorisation de `GET /api/financial/wallets/drivers/{driverId}`,
      #     qui résout le livreur par `GetDriverAccountAsync`.
      #
      # Comme partout ailleurs, l'absence de l'adresse ne dégrade pas le
      # service : elle l'empêche de démarrer, avant toute sonde.
      SERVICES__DELIVERY: http://delivery-service:9090
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      order-service:
        condition: service_started
      seller-service:
        condition: service_started
    networks: [hba-backend]

  review-service:
    build:
      context: .
      dockerfile: services/common/review-service/Dockerfile
    environment:
      <<: *dev-auth
      SERVICE_NAME: review-service
      ASPNETCORE_ENVIRONMENT: Development
      HOSTING__HTTPPORT: 8080
      HOSTING__GRPCPORT: 9090
      CONNECTIONSTRINGS__DEFAULT: Host=postgres;Port=5432;Database=hba_engagement;Username=hba;Password=hba
      REDIS__CONNECTIONSTRING: redis:6379
      KAFKA__BOOTSTRAPSERVERS: kafka:29092
      KAFKA__CONSUMERGROUP: hba-review-service
      KAFKA__PRODUCER: review-service
      SERVICES__CATALOG: http://catalog-service:9090
      SERVICES__FOOD: http://restaurant-service:9090
      SERVICES__ORDER: http://order-service:9090
      SERVICES__USER: http://user-service:9090

      # AJOUTÉ AVEC LA GARDE DE RÉPONSE VENDEUR — ET SON OUBLI EMPÊCHAIT LE
      # SERVICE DE DÉMARRER, PAS SEULEMENT DE RÉPONDRE.
      #
      # `AddMerchantsGrpcClient` LÈVE à la construction de l'hôte quand l'adresse
      # manque : « Services:Merchant est absent ». C'est le bon sens de l'erreur
      # — un client gRPC sans adresse rendrait sinon une panne au premier appel,
      # sur un chemin d'autorisation, des heures plus tard.
      #
      # Répondre à un avis n'est plus ouvert à tout compte inscrit : il faut
      # être le vendeur du produit. Seul seller-service connaît la
      # correspondance entre le compte du jeton et le dossier vendeur.
      SERVICES__MERCHANT: http://seller-service:9090
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      catalog-service:
        condition: service_started
      order-service:
        condition: service_started
    networks: [hba-backend]

  notification-service:
    build:
      context: .
      dockerfile: services/common/notification-service/Dockerfile
    environment:
      <<: *dev-auth
      SERVICE_NAME: notification-service
      ASPNETCORE_ENVIRONMENT: Development
      HOSTING__HTTPPORT: 8080
      HOSTING__GRPCPORT: 9090
      CONNECTIONSTRINGS__DEFAULT: Host=postgres;Port=5432;Database=hba_communication;Username=hba;Password=hba
      REDIS__CONNECTIONSTRING: redis:6379
      KAFKA__BOOTSTRAPSERVERS: kafka:29092
      KAFKA__CONSUMERGROUP: hba-notification-service
      KAFKA__PRODUCER: notification-service
      SERVICES__USER: http://user-service:9090
      SERVICES__MEDIA: http://media-service:9090
      SERVICES__ORDER: http://order-service:9090
      # LE SECOND UNIVERS DE COMMANDES (lot 6.4) : `AcheteurDuTicket` y resout
      # l'acheteur d'un ticket de cuisine ne d'une commande de repas. Sans cette
      # ligne, ce client ne recevait aucune notification de suivi.
      SERVICES__FOODORDER: http://food-order-service:9090
      SERVICES__DELIVERY: http://delivery-service:9090

      # TROIS ADRESSES POUR LES CLIENTS gRPC DE LA TRANCHE NOTIFICATIONS.
      #
      # `AddProductsGrpcClient`, `AddMerchantsGrpcClient` et
      # `AddIdentityGrpcClient` LÈVENT au démarrage si leur adresse manque —
      # « Services:Catalog est absent. ». Le service ne démarre pas du tout, ce
      # qui vaut mieux qu'un gestionnaire qui échoue silencieusement à la
      # première notification.
      #
      # Products est hébergé par catalog-service : d'où `Services:Catalog`.
      SERVICES__CATALOG: http://catalog-service:9090
      SERVICES__MERCHANT: http://seller-service:9090
      SERVICES__IDENTITY: http://identity-service:9090

      # ── E-MAIL (Resend) ────────────────────────────────────────────────
      #
      # VIDE EN LOCAL, ET C'EST LE COMPORTEMENT VOULU.
      #
      # Sans `ApiKey`, l'installer bascule sur `DevelopmentEmailSender` : les
      # messages sont ÉCRITS DANS LA CONSOLE, jeton de vérification compris. Le
      # parcours « je crée un compte, je clique sur le lien » reste donc jouable
      # sans clé et sans domaine vérifié.
      #
      # Pour envoyer réellement depuis le poste : renseigner les trois valeurs.
      # Le domaine de `From` doit être vérifié chez Resend (SPF + DKIM), sinon
      # Resend répond 403 et l'outbox rejoue l'échec en boucle.
      #
      # Hors Development, l'absence de configuration REFUSE le démarrage : sans
      # e-mail, un mot de passe oublié n'est jamais récupérable.
      NOTIFICATIONS__EMAIL__APIKEY: ""
      NOTIFICATIONS__EMAIL__FROM: "HBA Express <no-reply@hbaexpress.com>"
      NOTIFICATIONS__EMAIL__APPBASEURL: "http://localhost:8080"

      # ── PUSH (Firebase Cloud Messaging) ────────────────────────────────
      #
      # Vide ⇒ `NullPushSender` : aucun push, et la raison est journalisée au
      # démarrage. Contrairement à l'e-mail, l'absence de FCM ne bloque personne
      # dehors — d'où un repli silencieux plutôt qu'un refus de démarrer.
      #
      # Pour l'activer, PRÉFÉRER LE FICHIER À LA VARIABLE : monter le compte de
      # service depuis un chemin HORS DU DÉPÔT et renseigner SERVICEACCOUNTPATH.
      # Coller le JSON dans SERVICEACCOUNTJSON marche aussi, mais le blob se
      # retrouve alors dans l'environnement du processus, dans `docker inspect`,
      # et dans l'historique du shell qui a lancé la pile.
      #
      #   volumes:
      #     - $HOME/secrets-hba-staging/firebase.json:/etc/hba/firebase/service-account.json:ro
      #   NOTIFICATIONS__FCM__SERVICEACCOUNTPATH: /etc/hba/firebase/service-account.json
      #
      # Le déploiement Kubernetes fait exactement cela, depuis un Secret : voir
      # `k8s/base/common/secret-notifications.yaml`. `.gitignore` attrape au
      # passage un `firebase.json` posé dans le dépôt « le temps d'un test ».
      NOTIFICATIONS__FCM__SERVICEACCOUNTJSON: ""
      NOTIFICATIONS__FCM__SERVICEACCOUNTPATH: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      user-service:
        condition: service_started
      media-service:
        condition: service_started
    networks: [hba-backend]

  promotion-service:
    build:
      context: .
      dockerfile: services/common/promotion-service/Dockerfile
    environment:
      <<: *dev-auth
      SERVICE_NAME: promotion-service
      ASPNETCORE_ENVIRONMENT: Development
      HOSTING__HTTPPORT: 8080
      HOSTING__GRPCPORT: 9090
      CONNECTIONSTRINGS__DEFAULT: Host=postgres;Port=5432;Database=hba_promotion;Username=hba;Password=hba
      KAFKA__BOOTSTRAPSERVERS: kafka:29092
      KAFKA__CONSUMERGROUP: hba-promotion-service
      KAFKA__PRODUCER: promotion-service

      # ═══════════════════════════════════════════════════════════════════════
      # UNE SEULE ADRESSE, ET ELLE EST D'AUTORISATION — PAS DE CALCUL.
      #
      # Ce bloc portait « AUCUNE ADRESSE `SERVICES__*`, ET C'EST LE POINT FORT DE
      # CE SERVICE ». La moitié de la phrase reste vraie : promotion ignore
      # toujours ce qu'est un produit, un plat ou un restaurant, et c'est ce qui
      # lui permet de servir les deux checkouts du §11 sans en connaître aucun.
      # Aucun calcul de remise ne sort du service.
      #
      # Ce qui a changé (D28) : `/api/v1/merchant/promotions` est ouverte au
      # vendeur PROPRIÉTAIRE. Le jeton porte un identifiant d'utilisateur, la
      # campagne un identifiant de vendeur, et un membre d'équipe n'a pas de
      # dossier vendeur à son nom — seul seller-service sait relier les trois.
      #
      # Sans cette ligne, `AddMerchantsGrpcClient` lève à la CONSTRUCTION de
      # l'hôte : le conteneur sort avant que la sonde n'existe, et rien dans
      # `docker compose ps` ne dit pourquoi.
      # ═══════════════════════════════════════════════════════════════════════
      SERVICES__MERCHANT: http://seller-service:9090
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [hba-backend]

  # ═════════════════════════════════════════════════════════════════════════
  # LES TROIS BFF SONT PARTIS — DÉCISION D38 : LA PASSERELLE EST LE BFF.
  #
  # `client-bff`, `seller-bff` et `driver-bff` étaient construits et démarrés ici,
  # et joignables par personne :
  #
  #   • absents de `HBA.sln` — aucune intégration continue ne les compilait ;
  #   • aucune route de passerelle ne visait leur préfixe `/api/v1/client` ;
  #   • `client-bff` portait 13 routes dont 9 rendaient 501, et son `/home` était
  #     écrit en dur ; `seller-bff` et `driver-bff` n'avaient qu'une sonde de santé.
  #
  # Pendant ce temps la passerelle portait son PROPRE BFF, complet et couvert par
  # six suites de tests : `HBA.Gateway.Application/Bff/` — client express, client
  # food, marchand, livreur, restaurant. La question n'était pas « finir les BFF »
  # mais « lequel des deux EST le BFF ». C'est la passerelle.
  #
  # CE QUE CE RETRAIT NE FAIT PAS : remplir `Bff:Screens`. Les deux sections
  # `client.express.home` et `client.food.home` de la passerelle sont des tableaux
  # VIDES — l'écran d'accueil agrège donc zéro source. Retirer les squelettes ne
  # crée pas l'agrégation ; cela supprime seulement l'illusion qu'elle existait
  # ailleurs. Voir RESTE_A_FAIRE.md.
  #
  # Les dossiers sont dans `_to_delete/bff-D38/` : `device_bash` ne peut pas
  # effacer sur cette machine.
  # ═════════════════════════════════════════════════════════════════════════

  # ═════════════════════════════════════════════════════════════════════════
  # LA PASSERELLE ÉTAIT ABSENTE DE CETTE PILE.
  #
  # Les services applicatifs démarraient, aucun n'était joignable : rien ne publiait
  # de port, et la seule définition de la passerelle vivait dans
  # infra/docker/compose.gateway.yml — derrière Traefik, en HTTPS,
  # sur `api.hba-express.com`. Inutilisable en local. Ce fichier a depuis
  # ete retire du depot ; la passerelle definie ici est la seule.
  #
  # C'est le SEUL conteneur qui publie un port. Les services restent sur le
  # réseau interne : les exposer donnerait des façades non authentifiées sur
  # la machine, et masquerait le fait que la passerelle est le point d'entrée.
  # Pour déboguer un service en direct, ajouter `ports:` ponctuellement.
  # ═════════════════════════════════════════════════════════════════════════
  gateway:
    build:
      # Contexte = racine `HBA/`, comme les services. Le Dockerfile a
      # besoin de `Directory.Build.props` et `Directory.Packages.props`, qui
      # vivent ici : sans eux, le projet n'a ni cadre cible ni version de paquet.
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      <<: *dev-auth
      ASPNETCORE_ENVIRONMENT: Development

      # La passerelle n'appelle pas `ListenAnyIP` : contrairement aux services,
      # `ASPNETCORE_URLS` y est bien pris en compte.
      ASPNETCORE_URLS: http://+:8080

      # PORT 8080 — CELUI DU REST, PAS CELUI DU gRPC.
      #
      # Ces adresses servent DEUX consommateurs dans la passerelle : les clients
      # typés des BFF et les clusters YARP. Les deux parlent HTTP/1 REST.
      #
      # Les `SERVICES__*` des services entre eux, plus bas, portent `:9090` et
      # c'est correct : côté service, `AddXGrpcClient` REMPLACE le port de
      # l'URL par `Hosting:GrpcPort`. Le numéro y est décoratif. Ici il ne l'est
      # pas — il est utilisé tel quel.
      # LE PORT gRPC D'EN FACE, POUR LE SEUL APPEL gRPC DE LA PASSERELLE.
      #
      # `AddIdentityGrpcClient` REMPLACE le port de `SERVICES__IDENTITY` par
      # celui-ci. Les `SERVICES__*` ci-dessous gardent :8080 parce que les
      # clients typés des BFF et les clusters YARP les utilisent tels quels, en
      # REST. Le contrôle de révocation, lui, doit joindre 9090.
      #
      # La passerelle n'ouvre PAS de port gRPC pour autant : elle n'appelle
      # jamais `AddHbaGrpc`. Cette variable ne fait qu'alimenter le client.
      HOSTING__GRPCPORT: 9090

      SERVICES__IDENTITY: http://identity-service:8080
      SERVICES__USER: http://user-service:8080
      SERVICES__MERCHANT: http://seller-service:8080
      SERVICES__CATALOG: http://catalog-service:8080
      SERVICES__INVENTORY: http://inventory-service:8080
      SERVICES__COMMERCE: http://cart-service:8080
      SERVICES__ORDER: http://order-service:8080
      SERVICES__FOOD: http://restaurant-service:8080
      SERVICES__DELIVERY: http://delivery-service:8080
      SERVICES__FINANCIAL: http://payment-service:8080
      SERVICES__ENGAGEMENT: http://review-service:8080
      SERVICES__COMMUNICATION: http://notification-service:8080
      SERVICES__MEDIA: http://media-service:8080

      # MANQUANTE, ALORS QUE LE CLUSTER YARP « Promotion » EXISTAIT DÉJÀ.
      #
      # `ServicesOptions` la déclare obligatoire : sans elle, la passerelle refuse
      # de démarrer. Avant qu'elle ne le soit, l'oubli était pire — le cluster se
      # chargeait SANS destination et rendait 503 sur toutes les promotions, alors
      # que la configuration avait l'air complète.
      SERVICES__PROMOTION: http://promotion-service:8080
      SERVICES__RETURNREFUND: http://return-refund-service:8080
      SERVICES__DELIVERYPRICING: http://delivery-pricing-service:8080
      SERVICES__DRIVERS: http://driver-service:8080
      SERVICES__ROUTES: http://route-service:8080

      # LE PARCOURS RESTAURANT A DEUX AMONTS DE PLUS.
      #
      # Le panier et la commande de repas ne sont plus servis par
      # cart-service ni par order-service. `ServicesOptions` les déclare
      # obligatoires : sans ces adresses, la passerelle refuse de démarrer —
      # ce qui vaut mieux qu'un cluster sans destination rendant 503 sur tout le
      # parcours, avec une configuration qui a l'air complète.
      SERVICES__FOODCART: http://food-cart-service:8080
      SERVICES__FOODORDER: http://food-order-service:8080

      # Le port 8080 est publié : la passerelle est donc atteignable sans passer
      # par un proxy. Faire confiance à n'importe quel `X-Forwarded-For`
      # laisserait alors un client se déclarer n'importe quelle adresse — et
      # contourner le limiteur de débit en changeant d'IP à chaque requête.
      PROXYTRUST__TRUSTANYPROXY: "false"

      # Aucun collecteur OTLP dans cette pile : une chaîne vide désactive
      # l'export. La laisser pointer sur `otel-collector:4317` produirait une
      # erreur de connexion toutes les quelques secondes dans les journaux.
      OPENTELEMETRY__ENDPOINT: ""

    # AUCUN `depends_on`, DÉLIBÉRÉMENT.
    #
    # La passerelle sert son trafic même si les services sont à terre :
    # 502 sur les routes concernées, et les autres fonctionnent. L'attendre
    # transformerait la panne d'un service en indisponibilité totale.
    networks: [hba-backend]

volumes:
  postgres-data:
  kafka-data:
  minio-data:
  rembg-models:

networks:
  hba-backend:
