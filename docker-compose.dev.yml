      KAFKA__CONSUMERGROUP: hba-order-service
      KAFKA__PRODUCER: order-service
      SERVICES__COMMERCE: http://cart-service:9090
      SERVICES__CATALOG: http://catalog-service:9090
      SERVICES__INVENTORY: http://inventory-service:9090
      SERVICES__FINANCIAL: http://payment-service:9090
      SERVICES__FOOD: http://restaurant-service:9090
      SERVICES__DELIVERY: http://delivery-service:9090
      SERVICES__USER: http://user-service:9090

      # LE DEVIS DE COURSE, RELU AU CHECKOUT.
      #
      # delivery-pricing ET NON delivery : `DeliveryApi.LookupQuote` n'a jamais
      # eu de corps de serveur, et delivery-service n'a plus de domaine de
      # tarification. `AddDeliveryPricingGrpcClient` LÈVE au démarrage sans cette
      # adresse — c'est ce qui empêche un checkout de repartir en 500 silencieux.
      SERVICES__DELIVERYPRICING: http://delivery-pricing-service:9090

      # AJOUTÉ AVEC `AddMerchantsGrpcClient`, ET DANS LE MÊME GESTE.
      #
      # `GET /api/sellers/{sellerId}/orders` doit prouver que l'appelant EST ce
      # vendeur : le jeton porte un identifiant d'utilisateur, la route un
      # identifiant de vendeur, et seul seller-service connaît la
      # correspondance.
      #
      # Sans cette ligne, `AddMerchantsGrpcClient` lève à la CONSTRUCTION de
      # l'hôte — le conteneur sort avant que la sonde n'existe, et rien dans
      # `docker compose ps` ne dit pourquoi.
      SERVICES__MERCHANT: http://seller-service:9090
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      cart-service:
        condition: service_started
      inventory-service:
        condition: service_started
    networks: [hba-backend]

  return-refund-service:
    build:
      context: .
      dockerfile: services/marketplace/return-refund-service/Dockerfile
    environment:
      <<: *dev-auth
      SERVICE_NAME: return-refund-service
      ASPNETCORE_ENVIRONMENT: Development
      HOSTING__HTTPPORT: 8080
      HOSTING__GRPCPORT: 9090
      CONNECTIONSTRINGS__DEFAULT: Host=postgres;Port=5432;Database=hba_commerce;Username=hba;Password=hba
      REDIS__CONNECTIONSTRING: redis:6379
      KAFKA__BOOTSTRAPSERVERS: kafka:29092
      KAFKA__CONSUMERGROUP: hba-return-refund-service
      KAFKA__PRODUCER: return-refund-service
      SERVICES__ORDER: http://order-service:9090
      SERVICES__FINANCIAL: http://payment-service:9090
      SERVICES__INVENTORY: http://inventory-service:9090
      SERVICES__DELIVERY: http://delivery-service:9090
      SERVICES__MEDIA: http://media-service:9090

      # SANS ELLE, LE SERVICE NE DÉMARRE PLUS — ET C'EST LE BON SENS DE L'ERREUR.
      #
      # Les routes vendeur vérifient désormais que le dossier de retour appartient
      # bien à l'équipe de l'appelant, en interrogeant seller-service. Sans cette
      # adresse, `AddMerchantsGrpcClient` lève à la construction de l'hôte.
      # Un service d'arbitrage de remboursements qui démarre sans savoir vérifier
      # l'appartenance vaut moins qu'un service qui ne démarre pas.
      SERVICES__MERCHANT: http://seller-service:9090
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      order-service:
        condition: service_started
      payment-service:
        condition: service_started
      media-service:
        condition: service_started
    networks: [hba-backend]

  restaurant-service:
    build:
      context: .
      dockerfile: services/food/restaurant-service/Dockerfile
    environment:
      <<: *dev-auth
      SERVICE_NAME: restaurant-service
      ASPNETCORE_ENVIRONMENT: Development
      HOSTING__HTTPPORT: 8080
      HOSTING__GRPCPORT: 9090
      CONNECTIONSTRINGS__DEFAULT: Host=postgres;Port=5432;Database=hba_food;Username=hba;Password=hba
      REDIS__CONNECTIONSTRING: redis:6379
      KAFKA__BOOTSTRAPSERVERS: kafka:29092
      KAFKA__CONSUMERGROUP: hba-restaurant-service
      KAFKA__PRODUCER: restaurant-service
      SERVICES__MERCHANT: http://seller-service:9090
      SERVICES__MEDIA: http://media-service:9090
      SERVICES__DELIVERY: http://delivery-service:9090
      SERVICES__USER: http://user-service:9090

      # REQUIS PAR LES DEUX PONTS DU PARCOURS FOOD.
      #
      # `AddOrderingGrpcClient` et `AddInventoryGrpcClient` LÈVENT au démarrage
      # si leur adresse manque — le service ne démarre pas du tout, ce qui vaut
      # mieux qu'un repas prêt sans livreur découvert trois semaines plus tard.
      #
      # Order : les lignes de la commande, l'adresse du client, le devis payé.
      # Inventory : le lieu d'enlèvement du restaurant, donc son adresse réelle.
      SERVICES__ORDER: http://order-service:9090
      SERVICES__INVENTORY: http://inventory-service:9090

      # LE CINQUIEME CLIENT : LES COMMANDES DE REPAS (lot 6.4).
      #
      # `SERVICES__ORDER` plus haut vise order-service. Celui-ci vise
      # food-order-service, qui porte les `MealOrder`. La creation de course
      # y lit l'ADRESSE DE REMISE : sans cette ligne, un ticket ne d'une
      # commande de repas n'obtenait jamais de livreur.
      #
      # Comme partout, l'absence de l'adresse n'est pas une degradation : le
      # service ne demarre pas.
      SERVICES__FOODORDER: http://food-order-service:9090
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      seller-service:
        condition: service_started
      media-service:
        condition: service_started
    networks: [hba-backend]

  food-cart-service:
    build:
      context: .
      dockerfile: services/food/food-cart-service/Dockerfile
    environment:
      <<: *dev-auth
      SERVICE_NAME: food-cart-service
      ASPNETCORE_ENVIRONMENT: Development
      HOSTING__HTTPPORT: 8080
      HOSTING__GRPCPORT: 9090
      CONNECTIONSTRINGS__DEFAULT: Host=postgres;Port=5432;Database=hba_food;Username=hba;Password=hba
      REDIS__CONNECTIONSTRING: redis:6379
      KAFKA__BOOTSTRAPSERVERS: kafka:29092
      KAFKA__CONSUMERGROUP: hba-food-cart-service
      KAFKA__PRODUCER: food-cart-service

      # CES DEUX ADRESSES LÈVENT AU DÉMARRAGE SI ELLES MANQUENT.
      #
      # Food : la carte, qui donne le prix. Sans elle, le panier retomberait
      # dans le défaut qu'il existe pour corriger — un montant venu du client.
      # FoodOrder : « cet acheteur en est-il à sa première commande ? », sans quoi
      # les promotions de bienvenue seraient inapplicables.
      SERVICES__FOOD: http://restaurant-service:9090
      SERVICES__FOODORDER: http://food-order-service:9090
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      restaurant-service:
        condition: service_started
    networks: [hba-backend]

  food-order-service:
    build:
      context: .
      dockerfile: services/food/food-order-service/Dockerfile
    environment:
      <<: *dev-auth
      SERVICE_NAME: food-order-service
      ASPNETCORE_ENVIRONMENT: Development
      HOSTING__HTTPPORT: 8080
      HOSTING__GRPCPORT: 9090
      CONNECTIONSTRINGS__DEFAULT: Host=postgres;Port=5432;Database=hba_food;Username=hba;Password=hba
      REDIS__CONNECTIONSTRING: redis:6379
      KAFKA__BOOTSTRAPSERVERS: kafka:29092
      KAFKA__CONSUMERGROUP: hba-food-order-service
      KAFKA__PRODUCER: food-order-service

      # FoodCart : le panier à figer. Food : établissement ouvert, minimum de
      # commande, appartenance au personnel. Delivery : la course à créer.
      SERVICES__FOODCART: http://food-cart-service:9090
      SERVICES__FOOD: http://restaurant-service:9090
      SERVICES__DELIVERY: http://delivery-service:9090

      # LE DEVIS RELU VIENT D'ICI, PAS DE delivery-service.
      #
      # Le devis est OBLIGATOIRE pour un repas — `PlaceMealOrderCommand` refuse
      # sans lui. Sa relecture passait par `DeliveryApi.LookupQuote`, qui n'a
      # jamais eu de corps de serveur : AUCUNE commande de repas ne pouvait
      # aboutir. Sans cette adresse, le service ne démarre pas.
      SERVICES__DELIVERYPRICING: http://delivery-pricing-service:9090
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      restaurant-service:
        condition: service_started
      delivery-service:
        condition: service_started
    networks: [hba-backend]

  delivery-pricing-service:
    build:
      context: .
      dockerfile: services/delivery/delivery-pricing-service/Dockerfile
    environment:
      <<: *dev-auth
      SERVICE_NAME: delivery-pricing-service
      ASPNETCORE_ENVIRONMENT: Development
      HOSTING__HTTPPORT: 8080
      HOSTING__GRPCPORT: 9090
      CONNECTIONSTRINGS__DEFAULT: Host=postgres;Port=5432;Database=hba_delivery;Username=hba;Password=hba
      REDIS__CONNECTIONSTRING: redis:6379
      KAFKA__BOOTSTRAPSERVERS: kafka:29092
      KAFKA__CONSUMERGROUP: hba-delivery-pricing-service
      KAFKA__PRODUCER: delivery-pricing-service
      # LES DEUX LEVIERS DE L'ESTIMATION D'ITINÉRAIRE — posés ici à leur valeur
      # par défaut pour qu'ils soient TROUVABLES, pas parce qu'il faut les régler.
      # 1.0 = aucune correction, soit exactement le comportement historique.
      # Les monter majore le prix de toutes les courses : voir D44.
      ESTIMATIONITINERAIRE__FACTEURCORRECTIONURBAINE: "1.0"
      ESTIMATIONITINERAIRE__VITESSEMOYENNEMETRESPARSECONDE: "5.8"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [hba-backend]

