      context: .
      dockerfile: services/marketplace/order-service/Dockerfile
    environment:
      <<: *dev-auth
      SERVICE_NAME: order-service
      ASPNETCORE_ENVIRONMENT: Development
      HOSTING__HTTPPORT: 8080
      HOSTING__GRPCPORT: 9090
      CONNECTIONSTRINGS__DEFAULT: Host=postgres;Port=5432;Database=hba_order;Username=hba;Password=hba
      REDIS__CONNECTIONSTRING: redis:6379
