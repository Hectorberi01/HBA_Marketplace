# ═══════════════════════════════════════════════════════════════════════════════
# INTÉGRATION CONTINUE (13).
#
# UN SEUL FICHIER, ET C'EST UN ÉCART ASSUMÉ AU README DE CE DOSSIER.
#
# `.github/README.md` demande « un workflow par service ». Sa RAISON est juste :
# ne pas reconstruire quinze services à chaque commit, pour pouvoir corriger la
# restauration sans redéployer les paiements.
#
# Quinze fichiers quasi identiques auraient satisfait la lettre et créé le défaut
# que ce dépôt combat partout ailleurs — quinze copies qui divergent, dont on en
# oublie deux le jour où l'on change une étape. La raison est ici satisfaite par
# `tools/HBA.Controls images-affectees`, qui calcule les images réellement touchées depuis le
# GRAPHE DE RÉFÉRENCES des `.csproj`, transitivement.
#
# Une liste de chemins tenue à la main aurait échoué autrement, et en silence : le
# service n'est pas reconstruit, l'image publiée reste l'ancienne, et la
# correction qu'on croit déployée ne l'est pas.
# ═══════════════════════════════════════════════════════════════════════════════
name: CI

on:
  pull_request:
  push:
    branches: [main, dev, staging, develop]

concurrency:
  # Une PR qui reçoit trois commits en cinq minutes n'a pas besoin de trois
  # exécutions complètes — seule la dernière est intéressante. Sur `main` en
  # revanche, on n'annule rien : chaque commit doit produire son image.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: "9.0.x"
  REGISTRY: ghcr.io
  # ═══════════════════════════════════════════════════════════════════════════
  # LE PROPRIÉTAIRE EN MINUSCULES — SANS QUOI AUCUNE IMAGE NE SE PUBLIE.
  #
  # `github.repository_owner` rend le nom TEL QU'IL EST ÉCRIT sur GitHub, ici
  # « Hectorberi01 ». Or la grammaire OCI impose des composants de chemin en
  # minuscules : `docker build -t ghcr.io/Hectorberi01/...` échoue sur
  # « repository name must be lowercase ».
  #
  # Le défaut ne se voit qu'AU PREMIER PUSH SUR `main` — une PR ne publie rien —
  # donc précisément le jour du premier déploiement, sur un message qui ne
  # désigne ni le workflow ni le compte.
  # ═══════════════════════════════════════════════════════════════════════════
  PROPRIETAIRE: hectorberi01

permissions:
  contents: read

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # 1. LES CONTRÔLES QUI SE PAIENT EN SECONDES.
  #
  # Ils passent AVANT la compilation, et c'est tout leur intérêt : chacun attrape
  # une classe d'erreurs que le compilateur ne voit pas — une dépendance injectée
  # que personne ne fournit, un `using` manquant sur un namespace frère, un projet
  # non copié dans une image, une table configurée sans migration.
  # ═══════════════════════════════════════════════════════════════════════════
  controles:
    name: Contrôles du dépôt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer kustomize
        run: |
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      # LES CONTROLES N'ONT PLUS AUCUNE DEPENDANCE DE PAQUET.
      #
      # `pip install pyyaml python-hcl2` etait installe ici parce que, sans eux,
      # `check-infra.py` et `check-k8s.py` ne cassaient pas : ils s'IGNORAIENT.
      # Une CI verte sur une infrastructure jamais relue. Les vingt-deux
      # controles sont en C# et lisent YAML et HCL avec leurs propres lecteurs —
      # ce qu'ils ne savent pas lire, ils le DISENT au lieu de se taire.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: check-all
        run: ./scripts/check-all.sh

  # ═══════════════════════════════════════════════════════════════════════════
  # 2. COMPILATION ET TESTS, SUR LA SOLUTION ENTIÈRE.
  #
  # PAS DE DÉCOUPAGE PAR SERVICE ICI, CONTRAIREMENT AUX IMAGES.
  #
  # Les quinze hôtes partagent `shared/` et se référencent par leurs contrats :
  # compiler « juste order-service » compile de toute façon la moitié du dépôt.
  # Le coût qu'on veut éviter est celui des IMAGES Docker, pas celui de `dotnet
  # build` — et un `dotnet test` partiel ferait rater les tests de contrat
  # d'événements, qui sont précisément ceux qui cassent entre services.
  # ═══════════════════════════════════════════════════════════════════════════
  build:
    name: Compilation et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-

      - run: dotnet restore HBA.sln

      # `--no-restore` ET `/m:1` : voir infra/README.md.
      #
      # La compilation parallèle de trente projets fait tomber le runner sur
      # « cannot allocate memory » — le même défaut que `COMPOSE_PARALLEL_LIMIT`
      # règle pour docker. Le symptôme est un code 137 sans message utile.
      - run: dotnet build HBA.sln --configuration Release --no-restore /m:1

      - name: Analyse de vulnérabilité des dépendances (§13)
        # NE FAIT PAS ÉCHOUER LA PR, ET C'EST DÉLIBÉRÉ.
        #
        # Une CVE publiée dans une dépendance transitive bloquerait toutes les PR
        # d'un coup, y compris celle qui la corrige. Le §13 demande un scan ; le
        # §23 demande « aucune criticité bloquante » AVANT LA PRODUCTION — c'est
        # dans `cd.yml` que la porte se ferme, pas ici.
        continue-on-error: true
        run: dotnet list HBA.sln package --vulnerable --include-transitive

      # ═════════════════════════════════════════════════════════════════════
      # LE SECOND LOGGER REND VISIBLE CE QUI MANQUAIT LE PLUS.
      #
      # Avec le seul logger `trx`, un echec d'integration ne laisse que le
      # message de l'assertion et le corps de la reponse HTTP. Or nos reponses
      # 500 ne portent qu'un `correlationId` : l'EXCEPTION est ecrite par le
      # gestionnaire global dans les journaux de l'hote de test, et ces
      # journaux n'apparaissaient nulle part.
      #
      # Consequence vecue les 30 et 31 aout : vingt-trois echecs identiques,
      # deux soirees d'analyse statique, et la cause jamais lue — seulement sa
      # consequence. `console;verbosity=detailed` fait remonter la sortie de
      # l'hote dans le journal du job.
      #
      # CE QUE CA COUTE : un journal de job nettement plus volumineux. C'est le
      # prix d'un echec diagnosticable du premier coup, et il est bien
      # inferieur au temps qu'on vient d'y passer.
      #
      # CE QUE CA NE COUVRE PAS : rien n'est capture si l'hote de test coupe
      # ses propres fournisseurs de journalisation. Si un echec reste muet
      # malgre ce logger, c'est la fixture qu'il faut regarder, pas ce reglage.
      # ═════════════════════════════════════════════════════════════════════
      # ═════════════════════════════════════════════════════════════════════
      # UN PROCESSUS PAR PROJET DE TEST — ET C'EST UNE CORRECTION DE DEFAUT,
      # PAS UN CONFORT.
      #
      # CE QUI SE PASSAIT. `dotnet test HBA.sln` remet PLUSIEURS assemblies de
      # test au MEME hote de test quand elles ciblent le meme cadre. Or quatre
      # harnais posent leur configuration en variables d'ENVIRONNEMENT — c'est-a-
      # dire au niveau du PROCESSUS :
      #
      #   MerchantsIntegrationFixture   SERVICE_NAME=seller-service,  OUTBOX_ENABLED=true
      #   CatalogIntegrationFixture     SERVICE_NAME=catalog-service, OUTBOX_ENABLED=true
      #   OrderIntegrationFixture       SERVICE_NAME=order-service,   OUTBOX_ENABLED=true
      #   AuthorizationTestFactory                                    OUTBOX_ENABLED=false
      #
      # et chacun y pose SA chaine de connexion, vers SON conteneur Postgres.
      # AUCUN ne remet ces variables a leur valeur d'origine : zero remise a
      # zero dans les quatre fichiers.
      #
      # Le dernier ecrivain gagne. Un hote deja demarre se retrouve a lire la
      # base d'une autre suite — conteneur qui, a ce moment-la, est souvent deja
      # detruit. D'ou 23 echecs IDENTIQUES dans Merchants, une suite qui passe
      # SEULE (38/38) et tombe en solution complete, et un ordre qui change d'une
      # execution a l'autre.
      #
      # Isoler les processus rend la collision impossible sans toucher au code de
      # test. C'est plus lent : chaque projet paie son propre demarrage.
      #
      # CE QUE CA NE CORRIGE PAS — et il faudra y revenir : deux harnais dans une
      # MEME assembly se marcheraient toujours dessus, et un `dotnet test
      # HBA.sln` lance a la main sur un poste retombe dans le meme piege. La vraie
      # reponse est que ces harnais cessent de configurer par variables de
      # processus et passent par `ConfigureAppConfiguration`, propre a chaque
      # hote.
      #
      # `|| echec=1` PLUTOT QU'UN ARRET IMMEDIAT : on veut la liste COMPLETE des
      # projets en echec en une execution, pas le premier seulement.
      # ═════════════════════════════════════════════════════════════════════
      - run: |
          set -uo pipefail
          echec=0
          for projet in $(dotnet sln HBA.sln list | grep -E 'tests[/\\].*\.csproj$'); do
            nom=$(basename "$projet" .csproj)
            echo "::group::$nom"
            dotnet test "$projet" --configuration Release --no-build \
              --logger "trx;LogFileName=$nom.trx" \
              --logger "console;verbosity=detailed" || echec=1
            echo "::endgroup::"
          done
          exit "$echec"

      - name: Conserver les résultats de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-tests
          path: "**/*.trx"
          if-no-files-found: ignore

  # ═══════════════════════════════════════════════════════════════════════════
  # 3. QUELLES IMAGES RECONSTRUIRE ?
  # ═══════════════════════════════════════════════════════════════════════════
  affectes:
    name: Services affectés
    runs-on: ubuntu-latest
    outputs:
      matrice: ${{ steps.calcul.outputs.matrice }}
      vide: ${{ steps.calcul.outputs.vide }}
    steps:
      - uses: actions/checkout@v4
        with:
          # L'HISTORIQUE COMPLET EST NÉCESSAIRE.
          #
          # `actions/checkout` clone en profondeur 1 par défaut. `git diff
          # origin/main...HEAD` échouerait alors — et le script, prudemment,
          # reconstruirait TOUT. Un pipeline correct mais quinze fois trop long.
          fetch-depth: 0

      # LE SDK EST NÉCESSAIRE DEPUIS QUE LE CALCUL EST EN C#. Ce travail ne
      # compilait rien auparavant : le calcul était en Python. Sans cette étape,
      # `dotnet` est absent, la commande échoue, et `matrice` reste vide — une CI
      # verte qui ne construit AUCUNE image.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      # ON CONSTRUIT AVANT, ET SÉPARÉMENT, POUR QUE `matrice` NE CONTIENNE QUE
      # DU JSON. `dotnet run` écrit ses diagnostics de compilation sur la sortie
      # standard : une seule ligne d'avertissement, et `$(...)` capture du texte
      # que `strategy.matrix` refuse — sans que rien ne dise que la cause est un
      # avertissement de build.
      - name: Construire l'outil de contrôles
        run: dotnet build tools/HBA.Controls -c Release --verbosity quiet

      - id: calcul
        run: |
          if [ "${{ github.event_name }}" = "push" ] && \
             { [ "${{ github.ref_name }}" = "dev" ] || \
               [ "${{ github.ref_name }}" = "staging" ] || \
               [ "${{ github.ref_name }}" = "develop" ]; }; then
            # Les branches qui déclenchent un déploiement posent le même SHA sur
            # tout l'overlay. Chaque image référencée doit donc exister avec ce SHA.
            matrice=$(dotnet run --project tools/HBA.Controls -c Release --no-build \
                        --verbosity quiet -- images-affectees --tous)
          else
            base="${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}"
            matrice=$(dotnet run --project tools/HBA.Controls -c Release --no-build \
                        --verbosity quiet -- images-affectees "$base")
          fi
          # UNE MATRICE QUI N'EST PAS DU JSON DOIT ARRÊTER LE TRAVAIL, PAS LE
          # LAISSER CONTINUER À VIDE. Sans ce contrôle, une sortie polluée donne
          # `vide=false` avec une matrice illisible, ou `vide=true` sur une
          # chaîne nulle : une CI verte qui ne construit aucune image.
          if ! printf '%s' "$matrice" | jq -e 'type == "array"' >/dev/null 2>&1; then
            echo "::error::le calcul de la matrice n'a pas rendu un tableau JSON :"
            printf '%s\n' "$matrice"
            exit 1
          fi

          echo "matrice=$matrice" >> "$GITHUB_OUTPUT"
          echo "vide=$([ "$matrice" = '[]' ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Services affectés : $matrice"

  # ═══════════════════════════════════════════════════════════════════════════
  # 4. IMAGE OCI : CONSTRUCTION, SBOM, SCAN, SIGNATURE, PUBLICATION (§13).
  #
  # SUR PUSH SEULEMENT.
  #
  # Une PR vérifie que l'image SE CONSTRUIT ; elle ne publie rien. Les branches
  # `dev`, `staging`, `develop` et `main` publient, car elles alimentent soit un
  # cluster, soit une promotion manuelle. La traçabilité reste le SHA du commit.
  # ═══════════════════════════════════════════════════════════════════════════
  image:
    name: Image ${{ matrix.service }}
    needs: [controles, build, affectes]
    if: needs.affectes.outputs.vide == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write        # requis par cosign en mode keyless
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.affectes.outputs.matrice) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Se connecter au registre
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire
        id: construire
        uses: docker/build-push-action@v6
        with:
          # Contexte = racine du dépôt : les Dockerfiles copient `shared/`, qui
          # vit hors du dossier du service.
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          # LE SHA DU COMMIT, JAMAIS `latest` (§13).
          #
          # Le §13 impose des images immuables identifiées par SHA ou semver, et
          # interdit `latest` pour un déploiement reproductible. Le tag de branche
          # ci-dessous existe pour la lisibilité humaine ; c'est le SHA qui est
          # déployé.
          tags: |
            ${{ env.REGISTRY }}/${{ env.PROPRIETAIRE }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.PROPRIETAIRE }}/${{ matrix.service }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: true
          sbom: true

      - name: Scan de vulnérabilité
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.PROPRIETAIRE }}/${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          # ON N'ÉCHOUE PAS ICI — voir le §23 et `cd.yml`.
          #
          # Le rapport est conservé et remonté ; la porte se ferme avant la
          # PRODUCTION, pas avant la publication. Bloquer ici empêcherait de
          # publier l'image qui CORRIGE la vulnérabilité.
          exit-code: "0"
          severity: HIGH,CRITICAL

      - name: Conserver le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.service }}
          path: trivy-${{ matrix.service }}.sarif
          if-no-files-found: ignore

      - name: "Signer l'image (§19 : registre privé et images signées)"
        if: github.event_name == 'push'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          curl -sSLo cosign https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
          chmod +x cosign
          # Signature « keyless » : l'identité vient du jeton OIDC du workflow, il
          # n'y a donc aucune clé privée à stocker ni à faire tourner. C'est ce que
          # le §12 préfère à un secret de plus.
          ./cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.PROPRIETAIRE }}/${{ matrix.service }}@${{ steps.construire.outputs.digest }}
