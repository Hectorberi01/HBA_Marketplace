# ═══════════════════════════════════════════════════════════════════════════════
# INTÉGRATION CONTINUE (13).
#
# UN SEUL FICHIER, ET C'EST UN ÉCART ASSUMÉ AU README DE CE DOSSIER.
#
# `.github/README.md` demande « un workflow par service ». Sa RAISON est juste :
# ne pas reconstruire quinze services à chaque commit, pour pouvoir corriger la
# restauration sans redéployer les paiements.
#
# Quinze fichiers quasi identiques auraient satisfait la lettre et créé le défaut
# que ce dépôt combat partout ailleurs — quinze copies qui divergent, dont on en
# oublie deux le jour où l'on change une étape. La raison est ici satisfaite par
# `tools/HBA.Controls images-affectees`, qui calcule les images réellement touchées depuis le
# GRAPHE DE RÉFÉRENCES des `.csproj`, transitivement.
#
# Une liste de chemins tenue à la main aurait échoué autrement, et en silence : le
# service n'est pas reconstruit, l'image publiée reste l'ancienne, et la
# correction qu'on croit déployée ne l'est pas.
# ═══════════════════════════════════════════════════════════════════════════════
name: CI

on:
  pull_request:
  push:
    branches: [main, dev, staging, develop]

concurrency:
  # Une PR qui reçoit trois commits en cinq minutes n'a pas besoin de trois
  # exécutions complètes — seule la dernière est intéressante. Sur `main` en
  # revanche, on n'annule rien : chaque commit doit produire son image.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: "9.0.x"
  REGISTRY: ghcr.io
  # ═══════════════════════════════════════════════════════════════════════════
  # LE PROPRIÉTAIRE EN MINUSCULES — SANS QUOI AUCUNE IMAGE NE SE PUBLIE.
  #
  # `github.repository_owner` rend le nom TEL QU'IL EST ÉCRIT sur GitHub, ici
  # « Hectorberi01 ». Or la grammaire OCI impose des composants de chemin en
  # minuscules : `docker build -t ghcr.io/Hectorberi01/...` échoue sur
  # « repository name must be lowercase ».
  #
  # Le défaut ne se voit qu'AU PREMIER PUSH SUR `main` — une PR ne publie rien —
  # donc précisément le jour du premier déploiement, sur un message qui ne
  # désigne ni le workflow ni le compte.
  # ═══════════════════════════════════════════════════════════════════════════
  PROPRIETAIRE: hectorberi01

permissions:
  contents: read

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # 1. LES CONTRÔLES QUI SE PAIENT EN SECONDES.
  #
  # Ils passent AVANT la compilation, et c'est tout leur intérêt : chacun attrape
  # une classe d'erreurs que le compilateur ne voit pas — une dépendance injectée
  # que personne ne fournit, un `using` manquant sur un namespace frère, un projet
  # non copié dans une image, une table configurée sans migration.
  # ═══════════════════════════════════════════════════════════════════════════
  controles:
    name: Contrôles du dépôt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer kustomize
        run: |
          # ═══════════════════════════════════════════════════════════════════
          # UNE VERSION FIGEE, TELECHARGEE DIRECTEMENT.
          #
          # `install_kustomize.sh` interroge l'API GitHub pour trouver la
          # derniere version. Sur un runner partage, cette API est limitee par
          # adresse : le 3 septembre, l'installation a rendu « Github
          # rate-limiter failed the request » et la barriere est tombee en 6
          # secondes, sans le moindre rapport avec l'etat du depot.
          #
          # Un actif de release ne passe pas par cette limite, et une version
          # figee rend la barriere reproductible : deux executions du meme
          # commit ne peuvent plus differer parce qu'amont a publie une version.
          #
          # CE QUE CA NE COUVRE PAS : plus rien ne remonte automatiquement de
          # version. Il faudra changer ce numero a la main le jour ou un
          # overlay demandera une fonctionnalite plus recente — le controle
          # `k8s` refuse deja kustomize en version 4, il le dira.
          # ═══════════════════════════════════════════════════════════════════
          # UN TELECHARGEMENT UNIQUE N'EST PAS UNE DEPENDANCE FIABLE.
          #
          # Deuxieme panne du meme pas en une soiree, pour une deuxieme raison
          # exterieure : d'abord le limiteur de debit de l'API GitHub, puis
          # « curl: (35) Recv failure: Connection reset by peer ». Aucune des
          # deux ne dit quoi que ce soit de l'etat du depot, et les deux
          # rendent la barriere rouge.
          #
          # Cinq tentatives avec attente croissante absorbent la coupure
          # passagere. L'echec DEFINITIF reste un echec : on ne poursuit pas
          # sans kustomize, sans quoi le controle `k8s` se contenterait de dire
          # « ignore » et la barriere passerait au vert sans avoir regarde les
          # overlays.
          version=5.4.3
          url="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${version}/kustomize_v${version}_linux_amd64.tar.gz"

          obtenu=0
          for essai in 1 2 3 4 5; do
            if curl -sSLf --connect-timeout 10 --max-time 180 -o kustomize.tar.gz "$url"; then
              obtenu=1
              break
            fi
            echo "kustomize : tentative $essai echouee, nouvelle tentative dans $((essai * 5))s"
            sleep $((essai * 5))
          done

          if [ "$obtenu" -ne 1 ]; then
            echo "::error title=kustomize::telechargement impossible apres 5 tentatives — $url"
            exit 1
          fi

          tar -xzf kustomize.tar.gz kustomize
          sudo mv kustomize /usr/local/bin/
          kustomize version

      # LES CONTROLES N'ONT PLUS AUCUNE DEPENDANCE DE PAQUET.
      #
      # `pip install pyyaml python-hcl2` etait installe ici parce que, sans eux,
      # `check-infra.py` et `check-k8s.py` ne cassaient pas : ils s'IGNORAIENT.
      # Une CI verte sur une infrastructure jamais relue. Les vingt-deux
      # controles sont en C# et lisent YAML et HCL avec leurs propres lecteurs —
      # ce qu'ils ne savent pas lire, ils le DISENT au lieu de se taire.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: check-all
        run: ./scripts/check-all.sh

  # ═══════════════════════════════════════════════════════════════════════════
  # 2. COMPILATION ET TESTS, SUR LA SOLUTION ENTIÈRE.
  #
  # PAS DE DÉCOUPAGE PAR SERVICE ICI, CONTRAIREMENT AUX IMAGES.
  #
  # Les quinze hôtes partagent `shared/` et se référencent par leurs contrats :
  # compiler « juste order-service » compile de toute façon la moitié du dépôt.
  # Le coût qu'on veut éviter est celui des IMAGES Docker, pas celui de `dotnet
  # build` — et un `dotnet test` partiel ferait rater les tests de contrat
  # d'événements, qui sont précisément ceux qui cassent entre services.
  # ═══════════════════════════════════════════════════════════════════════════
  build:
    name: Compilation et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-

      - run: dotnet restore HBA.sln

      # `--no-restore` ET `/m:1` : voir infra/README.md.
      #
      # La compilation parallèle de trente projets fait tomber le runner sur
      # « cannot allocate memory » — le même défaut que `COMPOSE_PARALLEL_LIMIT`
      # règle pour docker. Le symptôme est un code 137 sans message utile.
      - run: dotnet build HBA.sln --configuration Release --no-restore /m:1

      - name: Analyse de vulnérabilité des dépendances (§13)
        # NE FAIT PAS ÉCHOUER LA PR, ET C'EST DÉLIBÉRÉ.
        #
        # Une CVE publiée dans une dépendance transitive bloquerait toutes les PR
        # d'un coup, y compris celle qui la corrige. Le §13 demande un scan ; le
        # §23 demande « aucune criticité bloquante » AVANT LA PRODUCTION — c'est
        # dans `cd.yml` que la porte se ferme, pas ici.
        continue-on-error: true
        run: dotnet list HBA.sln package --vulnerable --include-transitive

      # ═════════════════════════════════════════════════════════════════════
      # LE SECOND LOGGER REND VISIBLE CE QUI MANQUAIT LE PLUS.
      #
      # Avec le seul logger `trx`, un echec d'integration ne laisse que le
      # message de l'assertion et le corps de la reponse HTTP. Or nos reponses
      # 500 ne portent qu'un `correlationId` : l'EXCEPTION est ecrite par le
      # gestionnaire global dans les journaux de l'hote de test, et ces
      # journaux n'apparaissaient nulle part.
      #
      # Consequence vecue les 30 et 31 aout : vingt-trois echecs identiques,
      # deux soirees d'analyse statique, et la cause jamais lue — seulement sa
      # consequence. `console;verbosity=detailed` fait remonter la sortie de
      # l'hote dans le journal du job.
      #
      # CE QUE CA COUTE : un journal de job nettement plus volumineux. C'est le
      # prix d'un echec diagnosticable du premier coup, et il est bien
      # inferieur au temps qu'on vient d'y passer.
      #
      # CE QUE CA NE COUVRE PAS : rien n'est capture si l'hote de test coupe
      # ses propres fournisseurs de journalisation. Si un echec reste muet
      # malgre ce logger, c'est la fixture qu'il faut regarder, pas ce reglage.
      # ═════════════════════════════════════════════════════════════════════
      # ═════════════════════════════════════════════════════════════════════
      # UN PROCESSUS PAR PROJET DE TEST — ET C'EST UNE CORRECTION DE DEFAUT,
      # PAS UN CONFORT.
      #
      # CE QUI SE PASSAIT. `dotnet test HBA.sln` remet PLUSIEURS assemblies de
      # test au MEME hote de test quand elles ciblent le meme cadre. Or quatre
      # harnais posent leur configuration en variables d'ENVIRONNEMENT — c'est-a-
      # dire au niveau du PROCESSUS :
      #
      #   MerchantsIntegrationFixture   SERVICE_NAME=seller-service,  OUTBOX_ENABLED=true
      #   CatalogIntegrationFixture     SERVICE_NAME=catalog-service, OUTBOX_ENABLED=true
      #   OrderIntegrationFixture       SERVICE_NAME=order-service,   OUTBOX_ENABLED=true
      #   AuthorizationTestFactory                                    OUTBOX_ENABLED=false
      #
      # et chacun y pose SA chaine de connexion, vers SON conteneur Postgres.
      # AUCUN ne remet ces variables a leur valeur d'origine : zero remise a
      # zero dans les quatre fichiers.
      #
      # Le dernier ecrivain gagne. Un hote deja demarre se retrouve a lire la
      # base d'une autre suite — conteneur qui, a ce moment-la, est souvent deja
      # detruit. D'ou 23 echecs IDENTIQUES dans Merchants, une suite qui passe
      # SEULE (38/38) et tombe en solution complete, et un ordre qui change d'une
      # execution a l'autre.
      #
      # Isoler les processus rend la collision impossible sans toucher au code de
      # test. C'est plus lent : chaque projet paie son propre demarrage.
      #
      # CE QUE CA NE CORRIGE PAS — et il faudra y revenir : deux harnais dans une
      # MEME assembly se marcheraient toujours dessus, et un `dotnet test
      # HBA.sln` lance a la main sur un poste retombe dans le meme piege. La vraie
      # reponse est que ces harnais cessent de configurer par variables de
      # processus et passent par `ConfigureAppConfiguration`, propre a chaque
      # hote.
      #
      # `|| echec=1` PLUTOT QU'UN ARRET IMMEDIAT : on veut la liste COMPLETE des
      # projets en echec en une execution, pas le premier seulement.
      # ═════════════════════════════════════════════════════════════════════
      - run: |
          set -uo pipefail
          rates=""
          passes=0
          for projet in $(dotnet sln HBA.sln list | grep -E 'tests[/\\].*\.csproj$'); do
            nom=$(basename "$projet" .csproj)
            echo "::group::$nom"
            if dotnet test "$projet" --configuration Release --no-build \
                 --logger "trx;LogFileName=$nom.trx" \
                 --logger "console;verbosity=detailed"; then
              passes=$((passes + 1))
            else
              rates="${rates}${nom} "
              echo "::error title=Tests en échec::$nom"
            fi
            echo "::endgroup::"
          done

          # ═══════════════════════════════════════════════════════════════════
          # LA BOUCLE DOIT NOMMER CE QUI A ECHOUE, PAS SEULEMENT ECHOUER.
          #
          # Premiere version : un `|| echec=1` et un `exit "$echec"`. Le pas
          # devenait rouge en fin de boucle, apres le journal du DERNIER projet —
          # qui, lui, avait reussi. Pour savoir lequel avait casse, il fallait
          # derouler seize mille lignes et ouvrir les groupes un par un.
          #
          # C'est le meme defaut que celui de `check-di.py` : un echec dont la
          # cause n'est pas nommee coute plus cher que l'echec lui-meme. Les
          # projets rates sont desormais listes ici, poses en annotation
          # `::error::` sur le travail, et ecrits dans le resume de l'execution.
          # ═══════════════════════════════════════════════════════════════════
          echo
          echo "── Bilan : $passes projet(s) au vert"
          if [ -n "$rates" ]; then
            echo "❌ En échec :"
            for nom in $rates; do echo "     $nom"; done
            {
              echo "## Tests en échec"
              echo
              for nom in $rates; do echo "- \`$nom\`"; done
              echo
              echo "Le détail est dans le groupe portant ce nom, et dans"
              echo "l'artefact \`resultats-tests\` (\`<nom>.trx\`)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✓ Les $passes projets de test passent."

      # ═════════════════════════════════════════════════════════════════════
      # NOMMER LE PROJET NE SUFFIT PAS : IL FAUT NOMMER LE CAS.
      #
      # La boucle ci-dessus dit « HBA.Merchants.IntegrationTests a échoué ».
      # Pour savoir LEQUEL de ses trente-huit cas est tombé, il fallait ensuite
      # dérouler le journal du job — lisible des seuls administrateurs du
      # dépôt — ou télécharger l'artefact `.trx`, qui demande la même chose.
      # Autrement dit : la cause d'un échec n'était accessible qu'à une
      # personne, et seulement depuis un poste.
      #
      # Ce pas relit les `.trx` et écrit le nom du cas, son assertion et le
      # haut de sa pile dans le résumé de l'exécution, visible sur la page du
      # run par quiconque voit le dépôt.
      #
      # `if: failure()` : sur un vert il n'y a rien à raconter.
      #
      # CE QUE ÇA NE COUVRE PAS : un projet dont l'hôte de test meurt avant
      # d'écrire son rapport ne laisse aucun `.trx`. Le verbe le DIT plutôt que
      # de conclure « aucun échec ».
      # ═════════════════════════════════════════════════════════════════════
      - name: Détail des cas en échec
        if: failure()
        run: |
          dotnet run --project tools/HBA.Controls -c Release --no-build \
            --verbosity quiet -- resume-tests

      - name: Conserver les résultats de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-tests
          path: "**/*.trx"
          if-no-files-found: ignore

  # ═══════════════════════════════════════════════════════════════════════════
  # 3. QUELLES IMAGES RECONSTRUIRE ?
  # ═══════════════════════════════════════════════════════════════════════════
  affectes:
    name: Services affectés
    runs-on: ubuntu-latest
    outputs:
      matrice: ${{ steps.calcul.outputs.matrice }}
      vide: ${{ steps.calcul.outputs.vide }}
    steps:
      - uses: actions/checkout@v4
        with:
          # L'HISTORIQUE COMPLET EST NÉCESSAIRE.
          #
          # `actions/checkout` clone en profondeur 1 par défaut. `git diff
          # origin/main...HEAD` échouerait alors — et le script, prudemment,
          # reconstruirait TOUT. Un pipeline correct mais quinze fois trop long.
          fetch-depth: 0

      # LE SDK EST NÉCESSAIRE DEPUIS QUE LE CALCUL EST EN C#. Ce travail ne
      # compilait rien auparavant : le calcul était en Python. Sans cette étape,
      # `dotnet` est absent, la commande échoue, et `matrice` reste vide — une CI
      # verte qui ne construit AUCUNE image.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      # ON CONSTRUIT AVANT, ET SÉPARÉMENT, POUR QUE `matrice` NE CONTIENNE QUE
      # DU JSON. `dotnet run` écrit ses diagnostics de compilation sur la sortie
      # standard : une seule ligne d'avertissement, et `$(...)` capture du texte
      # que `strategy.matrix` refuse — sans que rien ne dise que la cause est un
      # avertissement de build.
      - name: Construire l'outil de contrôles
        run: dotnet build tools/HBA.Controls -c Release --verbosity quiet

      - id: calcul
        run: |
          if [ "${{ github.event_name }}" = "push" ] && \
             { [ "${{ github.ref_name }}" = "dev" ] || \
               [ "${{ github.ref_name }}" = "staging" ] || \
               [ "${{ github.ref_name }}" = "develop" ]; }; then
            # Les branches qui déclenchent un déploiement posent le même SHA sur
            # tout l'overlay. Chaque image référencée doit donc exister avec ce SHA.
            matrice=$(dotnet run --project tools/HBA.Controls -c Release --no-build \
                        --verbosity quiet -- images-affectees --tous)
          else
            base="${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}"
            matrice=$(dotnet run --project tools/HBA.Controls -c Release --no-build \
                        --verbosity quiet -- images-affectees "$base")
          fi
          # UNE MATRICE QUI N'EST PAS DU JSON DOIT ARRÊTER LE TRAVAIL, PAS LE
          # LAISSER CONTINUER À VIDE. Sans ce contrôle, une sortie polluée donne
          # `vide=false` avec une matrice illisible, ou `vide=true` sur une
          # chaîne nulle : une CI verte qui ne construit aucune image.
          if ! printf '%s' "$matrice" | jq -e 'type == "array"' >/dev/null 2>&1; then
            echo "::error::le calcul de la matrice n'a pas rendu un tableau JSON :"
            printf '%s\n' "$matrice"
            exit 1
          fi

          echo "matrice=$matrice" >> "$GITHUB_OUTPUT"
          echo "vide=$([ "$matrice" = '[]' ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Services affectés : $matrice"

  # ═══════════════════════════════════════════════════════════════════════════
  # 4. IMAGE OCI : CONSTRUCTION, SBOM, SCAN, SIGNATURE, PUBLICATION (§13).
  #
  # SUR PUSH SEULEMENT.
  #
  # Une PR vérifie que l'image SE CONSTRUIT ; elle ne publie rien. Les branches
  # `dev`, `staging`, `develop` et `main` publient, car elles alimentent soit un
  # cluster, soit une promotion manuelle. La traçabilité reste le SHA du commit.
  # ═══════════════════════════════════════════════════════════════════════════
  image:
    name: Image ${{ matrix.service }}
    needs: [controles, build, affectes]
    if: needs.affectes.outputs.vide == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write        # requis par cosign en mode keyless
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.affectes.outputs.matrice) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Se connecter au registre
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire
        id: construire
        uses: docker/build-push-action@v6
        with:
          # Contexte = racine du dépôt : les Dockerfiles copient `shared/`, qui
          # vit hors du dossier du service.
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          # LE SHA DU COMMIT, JAMAIS `latest` (§13).
          #
          # Le §13 impose des images immuables identifiées par SHA ou semver, et
          # interdit `latest` pour un déploiement reproductible. Le tag de branche
          # ci-dessous existe pour la lisibilité humaine ; c'est le SHA qui est
          # déployé.
          tags: |
            ${{ env.REGISTRY }}/${{ env.PROPRIETAIRE }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.PROPRIETAIRE }}/${{ matrix.service }}:${{ github.ref_name }}
          # ═══════════════════════════════════════════════════════════════
          # LE LABEL QUI RATTACHE LE PAQUET AU DEPOT.
          #
          # Sans `org.opencontainers.image.source`, une image publiee sur GHCR
          # reste un paquet du COMPTE, sans lien avec le depot. Le
          # `GITHUB_TOKEN` d'un travail n'y a alors aucun droit d'ecriture,
          # meme avec `packages: write` declare — la permission porte sur les
          # paquets DU DEPOT, et celui-la n'en est pas un.
          #
          # C'est ce qui a produit « denied: permission_denied: read_package »
          # sur les vingt et un travaux : les paquets existaient deja, pousses
          # a la main depuis le poste, et la CI ne pouvait que les LIRE.
          #
          # CE QUE CA NE CORRIGE PAS : un paquet DEJA cree sans ce lien ne se
          # rattache pas retroactivement. Il faut le supprimer pour que la CI
          # le recree, ou lui donner acces au depot dans ses reglages.
          # ═══════════════════════════════════════════════════════════════
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: true
          sbom: true

      # ═════════════════════════════════════════════════════════════════════
      # ÉPINGLÉE PAR SON EMPREINTE, ET EN VERSION RÉCENTE. DEUX PANNES, DEUX
      #    LEÇONS.
      #
      # 1. `@0.28.0` a cessé de se résoudre — « unable to find version
      #    0.28.0 ». Amont publie ses versions sous `v0.28.0` ; l'étiquette
      #    sans `v` a été retirée, et les vingt et un travaux d'image sont
      #    tombés en trois secondes sans qu'une ligne du dépôt n'ait changé.
      #
      # 2. Épingler l'empreinte de v0.28.0 n'a PAS suffi, et c'est le point
      #    important : cette version référence elle-même
      #    `aquasecurity/setup-trivy@v0.2.1` PAR ÉTIQUETTE, et cette
      #    étiquette-là a disparu aussi. Amont ne conserve plus que v0.2.6,
      #    v0.3.0 et v0.3.1. Épingler une action ne fige donc pas ses propres
      #    dépendances : on hérite de la fragilité de son auteur.
      #
      # v0.36.0 corrige la cause : elle référence `setup-trivy` PAR EMPREINTE
      # (3fb12ec, v0.2.6). Une empreinte de commit ne peut ni disparaître ni
      # être redirigée — contrairement à une étiquette, qu'un auteur peut
      # déplacer sur du code qui s'exécutera avec le jeton de ce travail.
      #
      # Les cinq entrées utilisées ici — `image-ref`, `format`, `output`,
      # `exit-code`, `severity` — existent à l'identique en v0.36.0 ; seul le
      # défaut de `severity` a changé, et on le pose explicitement.
      #
      # CE QUE ÇA NE COUVRE PAS : plus aucune montée de version automatique, et
      # rien n'empêche une VERSION FUTURE de trivy-action de revenir à une
      # référence par étiquette. C'est un risque amont, pas un réglage d'ici.
      # ═════════════════════════════════════════════════════════════════════
      - name: Scan de vulnérabilité
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.PROPRIETAIRE }}/${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          # ON N'ÉCHOUE PAS ICI — voir le §23 et `cd.yml`.
          #
          # Le rapport est conservé et remonté ; la porte se ferme avant la
          # PRODUCTION, pas avant la publication. Bloquer ici empêcherait de
          # publier l'image qui CORRIGE la vulnérabilité.
          exit-code: "0"
          severity: HIGH,CRITICAL

      - name: Conserver le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.service }}
          path: trivy-${{ matrix.service }}.sarif
          if-no-files-found: ignore

      # ═════════════════════════════════════════════════════════════════════
      # LE JETON OIDC EST VERIFIE AVANT DE SIGNER, PARCE QUE COSIGN NE SAIT
      #    PAS DIRE CE QUI MANQUE.
      #
      # CE QU'ON A LU : « fetching ambient OIDC credentials: invalid character
      # 'u' looking for beginning of value ». Ce 'u' est la premiere lettre de
      # « unauthorized » : le point d'acces a rendu du TEXTE la ou cosign
      # attendait du JSON, et cosign a signale une erreur d'analyse au lieu du
      # refus qu'il venait de recevoir. Vingt et un travaux tombaient sur un
      # message qui ne nommait ni la cause ni le service concerne.
      #
      # Ce pas pose la meme question, avec curl, et rend le CODE HTTP. Le corps
      # n'est affiche que sur une erreur — une reponse a 200 contient le jeton
      # lui-meme, qui ne doit jamais atteindre un journal.
      #
      # CE QUE CA NE COUVRE PAS : la cause d'un 403 cote GitHub. Le code et le
      # corps la designeront ; c'est deja tout ce qui manquait pour la chercher.
      # ═════════════════════════════════════════════════════════════════════
      - name: Verifier le jeton OIDC avant signature
        if: github.event_name == 'push'
        run: |
          set -uo pipefail

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error title=OIDC::ACTIONS_ID_TOKEN_REQUEST_URL absent."
            echo "::error::La permission « id-token: write » n'est pas effective sur ce travail."
            exit 1
          fi

          code=$(curl -s -o /tmp/oidc.json -w '%{http_code}' \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore")

          if [ "$code" != "200" ]; then
            echo "::error title=OIDC::le point d'acces a repondu $code"
            # Un corps d'ERREUR ne contient aucun jeton : on peut le montrer.
            echo "reponse : $(head -c 300 /tmp/oidc.json)"
            rm -f /tmp/oidc.json
            exit 1
          fi

          echo "jeton OIDC obtenu ($(wc -c < /tmp/oidc.json) octets, non affiche)"
          rm -f /tmp/oidc.json

      - name: "Signer l'image (§19 : registre privé et images signées)"
        if: github.event_name == 'push'
        run: |
          set -euo pipefail

          # VERSION FIGEE, ET TELECHARGEMENT QUI REESSAIE — meme raison que
          # kustomize : `latest/download` fait dependre une execution
          # reproductible de ce qu'amont a publie ce matin, et un `curl` unique
          # transforme une coupure passagere en barriere rouge.
          version=v3.1.3
          url="https://github.com/sigstore/cosign/releases/download/${version}/cosign-linux-amd64"

          obtenu=0
          for essai in 1 2 3; do
            if curl -sSLf --connect-timeout 10 --max-time 120 -o cosign "$url"; then
              obtenu=1
              break
            fi
            echo "cosign : tentative $essai echouee, nouvelle tentative dans $((essai * 5))s"
            sleep $((essai * 5))
          done
          [ "$obtenu" -eq 1 ] || { echo "::error title=cosign::telechargement impossible — $url"; exit 1; }

          chmod +x cosign

          # `COSIGN_EXPERIMENTAL` N'EST PLUS POSE : depuis cosign 2, la signature
          # sans cle est le comportement par defaut et cette variable n'a plus
          # d'effet. La garder laissait croire qu'elle en avait un.
          #
          # Signature « keyless » : l'identite vient du jeton OIDC du workflow,
          # il n'y a donc aucune cle privee a stocker ni a faire tourner. C'est
          # ce que le §12 prefere a un secret de plus.
          ./cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.PROPRIETAIRE }}/${{ matrix.service }}@${{ steps.construire.outputs.digest }}
