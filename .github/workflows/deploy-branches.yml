name: Deploy Branches

# ══════════════════════════════════════════════════════════════════════════════
# `develop` EST LA BRANCHE DE PRODUCTION. `main` NE DEPLOIE RIEN.
#
# C'EST DELIBERE, ET C'EST CONTRE-INTUITIF — d'ou cet encadre.
#
# `main` est la branche PAR DEFAUT du depot (`origin/HEAD` y pointe). Quiconque
# arrive sur ce projet supposera donc que `main` est la production, poussera
# dessus, verra la CI passer au vert, et attendra un deploiement qui ne viendra
# jamais. Aucune erreur ne s'affichera : `main` n'est simplement pas dans la
# liste `branches:` ci-dessous, et le workflow ne se declenche pas du tout.
#
# La correspondance retenue le 31 aout 2026 :
#
#     dev      -> hba-dev       (calque dev,     sans migrations)
#     staging  -> hba-staging   (calque staging, sans migrations)
#     develop  -> hba-prod      (calque prod,    AVEC migrations)
#     main     -> rien
#
# CE QUE CE CHOIX NE COUVRE PAS. Rien n'empeche de pousser sur `main` : la
# branche vit, la CI la construit, et son contenu ne part jamais en production.
# Si `main` doit un jour devenir la branche de production, il faut changer
# TROIS endroits ensemble — la liste `branches:` du declencheur, le `case` du
# job `cible`, et cet encadre. Changer le `case` seul ne ferait rien : le
# workflow ne se declencherait toujours pas.
# ══════════════════════════════════════════════════════════════════════════════

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [dev, staging, develop]

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  cible:
    name: Choisir la cible
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      environnement: ${{ steps.cible.outputs.environnement }}
      namespace: ${{ steps.cible.outputs.namespace }}
      overlay: ${{ steps.cible.outputs.overlay }}
      migrations: ${{ steps.cible.outputs.migrations }}
    steps:
      - id: cible
        run: |
          case "${{ github.event.workflow_run.head_branch }}" in
            dev)
              echo "environnement=dev" >> "$GITHUB_OUTPUT"
              echo "namespace=hba-dev" >> "$GITHUB_OUTPUT"
              echo "overlay=k8s/overlays/dev" >> "$GITHUB_OUTPUT"
              echo "migrations=false" >> "$GITHUB_OUTPUT"
              ;;
            staging)
              echo "environnement=staging" >> "$GITHUB_OUTPUT"
              echo "namespace=hba-staging" >> "$GITHUB_OUTPUT"
              echo "overlay=k8s/overlays/staging" >> "$GITHUB_OUTPUT"
              echo "migrations=false" >> "$GITHUB_OUTPUT"
              ;;
            develop)
              echo "environnement=prod" >> "$GITHUB_OUTPUT"
              echo "namespace=hba-prod" >> "$GITHUB_OUTPUT"
              echo "overlay=k8s/overlays/prod" >> "$GITHUB_OUTPUT"
              echo "migrations=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Branche ignorée"
              ;;
          esac

  deployer:
    name: Déployer ${{ needs.cible.outputs.environnement }}
    needs: cible
    if: needs.cible.outputs.environnement != ''
    runs-on: ubuntu-latest
    environment: ${{ needs.cible.outputs.environnement }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: azure/setup-kubectl@v4

      - name: Installer kustomize
        run: |
          # ═══════════════════════════════════════════════════════════════════
          # UNE VERSION FIGEE, TELECHARGEE DIRECTEMENT.
          #
          # `install_kustomize.sh` interroge l'API GitHub pour trouver la
          # derniere version. Sur un runner partage, cette API est limitee par
          # adresse : le 3 septembre, l'installation a rendu « Github
          # rate-limiter failed the request » et la barriere est tombee en 6
          # secondes, sans le moindre rapport avec l'etat du depot.
          #
          # Un actif de release ne passe pas par cette limite, et une version
          # figee rend la barriere reproductible : deux executions du meme
          # commit ne peuvent plus differer parce qu'amont a publie une version.
          #
          # CE QUE CA NE COUVRE PAS : plus rien ne remonte automatiquement de
          # version. Il faudra changer ce numero a la main le jour ou un
          # overlay demandera une fonctionnalite plus recente — le controle
          # `k8s` refuse deja kustomize en version 4, il le dira.
          # ═══════════════════════════════════════════════════════════════════
          # UN TELECHARGEMENT UNIQUE N'EST PAS UNE DEPENDANCE FIABLE.
          #
          # Deuxieme panne du meme pas en une soiree, pour une deuxieme raison
          # exterieure : d'abord le limiteur de debit de l'API GitHub, puis
          # « curl: (35) Recv failure: Connection reset by peer ». Aucune des
          # deux ne dit quoi que ce soit de l'etat du depot, et les deux
          # rendent la barriere rouge.
          #
          # Cinq tentatives avec attente croissante absorbent la coupure
          # passagere. L'echec DEFINITIF reste un echec : on ne poursuit pas
          # sans kustomize, sans quoi le controle `k8s` se contenterait de dire
          # « ignore » et la barriere passerait au vert sans avoir regarde les
          # overlays.
          version=5.4.3
          url="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${version}/kustomize_v${version}_linux_amd64.tar.gz"

          obtenu=0
          for essai in 1 2 3 4 5; do
            if curl -sSLf --connect-timeout 10 --max-time 180 -o kustomize.tar.gz "$url"; then
              obtenu=1
              break
            fi
            echo "kustomize : tentative $essai echouee, nouvelle tentative dans $((essai * 5))s"
            sleep $((essai * 5))
          done

          if [ "$obtenu" -ne 1 ]; then
            echo "::error title=kustomize::telechargement impossible apres 5 tentatives — $url"
            exit 1
          fi

          tar -xzf kustomize.tar.gz kustomize
          sudo mv kustomize /usr/local/bin/
          kustomize version

      # Les controles sont en C# et n'ont plus de dependance Python ; le SDK
      # remplace `pip install pyyaml python-hcl2`.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Configurer kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          test -n "$KUBECONFIG_B64" || { echo "::error::Secret KUBECONFIG_B64 absent dans l'environnement GitHub"; exit 1; }
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl config current-context

      - name: Poser le SHA sur l'overlay
        env:
          OVERLAY: ${{ needs.cible.outputs.overlay }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          PROPRIETAIRE: hectorberi01
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import yaml

          overlay = os.environ["OVERLAY"]
          sha = os.environ["SHA"]
          owner = os.environ["PROPRIETAIRE"]

          with open(os.path.join(overlay, "kustomization.yaml"), encoding="utf-8") as f:
              kustomization = yaml.safe_load(f) or {}

          for image in kustomization.get("images", []):
              nom = image["name"]
              service = nom.removeprefix("hba/")
              subprocess.run(
                  ["kustomize", "edit", "set", "image", f"{nom}=ghcr.io/{owner}/{service}:{sha}"],
                  cwd=overlay,
                  check=True,
              )
              print(f"{service} -> {sha}")
          PY

      - name: Poser le SHA sur les migrations prod
        if: needs.cible.outputs.migrations == 'true'
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          PROPRIETAIRE: hectorberi01
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import yaml

          overlay = "k8s/overlays/migrations-prod"
          sha = os.environ["SHA"]
          owner = os.environ["PROPRIETAIRE"]

          with open(os.path.join(overlay, "kustomization.yaml"), encoding="utf-8") as f:
              kustomization = yaml.safe_load(f) or {}

          for image in kustomization.get("images", []):
              nom = image["name"]
              service = nom.removeprefix("hba/")
              subprocess.run(
                  ["kustomize", "edit", "set", "image", f"{nom}=ghcr.io/{owner}/{service}:{sha}"],
                  cwd=overlay,
                  check=True,
              )
              print(f"migration {service} -> {sha}")
          PY

      - name: Vérifier les signatures avant production
        if: needs.cible.outputs.environnement == 'prod'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          PROPRIETAIRE: hectorberi01
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          curl -sSLo cosign https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
          chmod +x cosign

          python3 - <<'PY' > /tmp/hba-services-a-verifier.txt
          import yaml
          k = yaml.safe_load(open("k8s/overlays/prod/kustomization.yaml", encoding="utf-8")) or {}
          for image in k.get("images", []):
              print(image["name"].removeprefix("hba/"))
          PY

          # ═══════════════════════════════════════════════════════════════
          # L'IDENTITE EST ANCREE SUR CE DEPOT ET CE WORKFLOW.
          #
          # CE CONTROLE ACCEPTAIT N'IMPORTE QUEL SIGNATAIRE. Avec
          # `--certificate-identity-regexp ".*"`, cosign se contentait de
          # verifier que l'image avait ete signee PAR UN workflow GitHub
          # Actions — n'importe lequel, dans n'importe quel depot public de la
          # planete. L'etape s'appelait « Verifier les signatures avant
          # production » et ne verifiait pas la provenance : elle verifiait
          # qu'une signature existait.
          #
          # Le motif ci-dessous exige `Hectorberi01/HBA_Marketplace`, le
          # workflow `ci.yml`, et une branche du depot. Le `refs/heads/` final
          # laisse la branche libre — dev, staging et develop signent tous — mais
          # refuse une signature venue d'un tag ou d'une pull request forkee.
          #
          # CE QUE CE CONTROLE NE COUVRE PAS. Il prouve QUI a signe, pas QUOI :
          # une image compromise signee par notre propre CI passerait. C'est le
          # role des controles de build, pas de celui-ci.
          # ═══════════════════════════════════════════════════════════════
          IDENTITE='^https://github\.com/Hectorberi01/HBA_Marketplace/\.github/workflows/ci\.yml@refs/heads/'

          while IFS= read -r service; do
            image="ghcr.io/${PROPRIETAIRE}/${service}:${SHA}"
            ./cosign verify \
              --certificate-identity-regexp "$IDENTITE" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$image" >/dev/null
            echo "signature OK : $image"
          done < /tmp/hba-services-a-verifier.txt

      - name: Pré-vol
        run: bash scripts/preflight-k8s.sh ${{ needs.cible.outputs.environnement }} --cluster

      - name: Appliquer les migrations prod
        if: needs.cible.outputs.migrations == 'true'
        run: |
          kubectl apply -k k8s/overlays/migrations-prod
          python3 - <<'PY'
          import json
          import subprocess
          import sys
          import time

          deadline = time.time() + 900
          while time.time() < deadline:
              raw = subprocess.check_output([
                  "kubectl", "-n", "hba-prod", "get", "job",
                  "-l", "app.kubernetes.io/component=migration", "-o", "json",
              ], text=True)
              jobs = json.loads(raw).get("items", [])
              if not jobs:
                  print("Aucun Job de migration trouvé", file=sys.stderr)
                  sys.exit(1)

              failed = []
              complete = []
              for job in jobs:
                  name = job["metadata"]["name"]
                  conditions = {
                      c.get("type"): c.get("status")
                      for c in job.get("status", {}).get("conditions", [])
                  }
                  if conditions.get("Failed") == "True":
                      failed.append(name)
                  if conditions.get("Complete") == "True":
                      complete.append(name)

              if failed:
                  print("Jobs de migration échoués : " + ", ".join(failed), file=sys.stderr)
                  sys.exit(1)
              if len(complete) == len(jobs):
                  print("Jobs de migration complets : " + ", ".join(sorted(complete)))
                  sys.exit(0)

              print(f"Migrations en cours : {len(complete)}/{len(jobs)} complètes")
              time.sleep(5)

          print("Timeout en attendant les migrations", file=sys.stderr)
          sys.exit(1)
          PY

      - name: Déployer les services
        run: |
          kubectl apply -k ${{ needs.cible.outputs.overlay }}
          kubectl -n ${{ needs.cible.outputs.namespace }} rollout status deploy --timeout=15m
