syntax = "proto3";

package hba.media.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "HBA.Media.Grpc.V1";

// Équivalent de `IMediaModuleApi`, méthode pour méthode.
//
// LA CORRESPONDANCE AVEC L'INTERFACE C# EST VOLONTAIREMENT LITTÉRALE.
//
// Le code applicatif continue de dépendre de `IMediaModuleApi` ; gRPC n'est
// qu'un transport. Si ce contrat s'éloignait de l'interface, la traduction
// cesserait d'être mécanique et deviendrait un endroit où des règles se cachent.
service MediaApi {
  rpc Get(GetMediaRequest) returns (GetMediaResponse);
  rpc GetMany(GetManyMediaRequest) returns (MediaList);
  rpc ListByOwner(ListByOwnerRequest) returns (MediaList);
  rpc CreateSignedUrl(CreateSignedUrlRequest) returns (CreateSignedUrlResponse);
}

message GetMediaRequest {
  string media_id = 1;
}

// UNE RÉPONSE ENVELOPPÉE PLUTÔT QUE `MediaView` DIRECTEMENT.
//
// L'interface C# rend `MediaView?` — l'absence est un cas NORMAL, pas une erreur.
// Signaler l'absence par un statut `NOT_FOUND` la transformerait en exception
// côté client : un média supprimé ferait lever une `RpcException` au milieu de
// l'affichage d'une galerie, là où le monolithe rendait simplement `null`.
message GetMediaResponse {
  bool found = 1;
  MediaView media = 2;
}

message GetManyMediaRequest {
  repeated string media_ids = 1;
}

message ListByOwnerRequest {
  string owner_type = 1;
  string owner_id = 2;
}

message MediaList {
  repeated MediaView items = 1;
}

message CreateSignedUrlRequest {
  string media_id = 1;
  int32 expires_seconds = 2;
}

message CreateSignedUrlResponse {
  bool found = 1;
  string url = 2;
  int32 expires_in_seconds = 3;
}

// Miroir de `MediaView`. Les `Guid` circulent en `string` : Protobuf n'a pas de
// type UUID, et un couple d'entiers 64 bits économiserait huit octets au prix
// d'une charge utile illisible dans les traces.
message MediaView {
  string id = 1;
  string owner_type = 2;
  string owner_id = 3;
  string media_type = 4;
  string original_file_name = 5;
  string content_type = 6;
  int64 size_bytes = 7;
  string visibility = 8;
  string status = 9;

  // `optional` N'EST PAS DÉCORATIF ICI.
  //
  // En proto3, un champ scalaire absent est indiscernable de sa valeur par
  // défaut : une chaîne vide et « pas d'URL » deviendraient la même chose.
  //
  // Or `MediaView.Url` est NULLE pour un fichier privé, et c'est une garantie du
  // §10 : une pièce d'identité n'a pas d'URL permanente. Sans `optional`, un
  // appelant recevrait `""` et pourrait le prendre pour un média public dont
  // l'URL n'a pas été calculée. `optional` restaure la distinction et génère
  // `HasUrl` côté C#.
  optional string url = 10;

  optional int32 width = 11;
  optional int32 height = 12;

  repeated MediaVariantView variants = 13;
  google.protobuf.Timestamp created_on_utc = 14;

  // ═══════════════════════════════════════════════════════════════════════════
  // QUI A DÉPOSÉ LE FICHIER — LE CHAMP QUI MANQUAIT, ET CE QUE SON ABSENCE A FAIT.
  //
  // `MediaView.CreatedByUserId` a été ajouté au contrat C# le 28 août, avec le
  // contrôle qui s'en sert : seller-service refuse de rattacher une pièce KYB
  // déposée par quelqu'un qui n'appartient pas à la boutique.
  //
  // Le proto, lui, n'a PAS été touché. Or seller-service ne parle à
  // media-service qu'en gRPC : la valeur ne traversait donc jamais, et
  // `ToContract` construisait un `MediaView` avec `Guid.Empty`. Le contrôle
  // comparait alors l'identifiant du déposant à `Guid.Empty`, ne trouvait aucune
  // adhésion, et rendait 403 — À TOUT VENDEUR DÉPOSANT SA PROPRE PIÈCE.
  //
  // Le champ C# était `= default` « pour que les appelants existants continuent
  // de compiler ». C'est exactement ce qui a permis au trou de passer : rien
  // n'a cessé de compiler, et le défaut n'est apparu qu'à l'exécution des tests
  // d'intégration, sous la forme d'un 403 qui ressemblait à un durcissement
  // volontaire.
  //
  // PAS `optional` : contrairement à `url`, la chaîne vide est ici une valeur
  // légitime — elle veut dire « inconnu », ce que rend une instance de
  // media-service pas encore redéployée. `ToContract` la traduit en
  // `Guid.Empty`, et l'appelant décide quoi en faire.
  // ═══════════════════════════════════════════════════════════════════════════
  string created_by_user_id = 15;
}

message MediaVariantView {
  string variant_type = 1;
  string url = 2;
  int32 width = 3;
  int32 height = 4;
  int64 size_bytes = 5;
}
