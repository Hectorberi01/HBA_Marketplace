# ==============================================================================
# DEPLOIEMENT DE PRODUCTION — DU POSTE VERS LE VPS.
#
# Lance par `scripts/deployer-ansible.sh`, qui execute la barriere de tests
# AVANT d'appeler ce playbook. Ne pas l'invoquer directement sans savoir ce
# qu'on saute.
#
#     ansible-playbook deployer-prod.yml
#     ansible-playbook deployer-prod.yml --tags preparation
#     ansible-playbook deployer-prod.yml --tags migration,sujets
#
# ETIQUETTES : preparation, transfert, images, migration, sujets, demarrage,
#              tls, verification
#
# CE QUE CE PLAYBOOK NE FAIT PAS :
#   - il ne lance AUCUN test. C'est le role du script appelant, sur le poste,
#     ou le code est ;
#   - il ne construit ni ne publie d'image. Voir `scripts/publier-images.sh` ;
#   - il ne touche PAS au VPS de base de donnees, qui n'est pas dans
#     l'inventaire — voir l'encadre de `inventaire/prod.yml` ;
#   - il ne cree ni base ni role PostgreSQL. C'est `scripts/db/creer-bases.sh`,
#     a la main, sur l'autre serveur.
# ==============================================================================
- name: Deployer HBA Express en production
  hosts: production
  gather_facts: true

  # ══════════════════════════════════════════════════════════════════════
  # PLUS DE `vars_prompt` : CE PLAYBOOK TOURNE DANS LA CI.
  #
  # Il demandait le jeton GHCR au clavier. Un prompt dans un travail GitHub
  # Actions n'attend personne : il lit l'entree standard fermee, prend la valeur
  # par defaut — la chaine vide — et le playbook continue SANS jeton. La panne
  # arrive alors au `docker pull`, sur une image privee, avec un message qui
  # parle d'autorisation et pas de prompt.
  #
  # Le jeton vient desormais d'une variable, passee par `-e` depuis un secret
  # GitHub. Vide reste accepte : c'est le cas ou le VPS est deja connecte au
  # registre, et le bloc `images` le traite deja.
  # ══════════════════════════════════════════════════════════════════════
  vars:
    ghcr_token: "{{ lookup('env', 'HBA_GHCR_TOKEN') | default('', true) }}"
    fichier_env: "{{ lookup('env', 'HBA_ENV_FILE') | default(lookup('env','HOME') + '/secrets-hba-prod/prod.env', true) }}"
    compose: "{{ hba_racine }}/docker-compose.prod.yml"

    # ══════════════════════════════════════════════════════════════════════
    # `-f` EST OBLIGATOIRE : LE NOM DU FICHIER N'EST PAS DECOUVRABLE.
    #
    # `docker compose` ne cherche QUE `compose.yaml`, `compose.yml`,
    # `docker-compose.yaml` et `docker-compose.yml` dans le repertoire
    # courant. Le notre s'appelle `docker-compose.prod.yml` — un nom qui ne
    # figure pas dans cette liste. Avec le seul `chdir`, compose repondait
    # « no configuration file provided: not found », un message qui ne nomme
    # ni le repertoire regarde ni les noms attendus.
    #
    # Le renommer en `docker-compose.yml` sur le VPS aurait aussi marche, et
    # aurait fait perdre l'information la plus utile quand on se connecte au
    # serveur : QUEL compose y tourne.
    #
    # Une seule variable pour les six invocations : elles ne peuvent plus
    # diverger, et la prochaine heritera du `-f` sans que personne y pense.
    # ══════════════════════════════════════════════════════════════════════
    dc: "docker compose -p {{ hba_projet }} -f {{ compose }}"

  pre_tasks:
    # ══════════════════════════════════════════════════════════════════════
    # LE FICHIER D'ENVIRONNEMENT EST VERIFIE AVANT DE TOUCHER AU VPS.
    #
    # Il porte quarante-six variables obligatoires, dont quatorze mots de passe
    # de base. Une seule absente et Compose refuse de demarrer — mais APRES que
    # le playbook a copie des fichiers, tire vingt-cinq images et migre les
    # bases. Autant echouer a la premiere seconde.
    # ══════════════════════════════════════════════════════════════════════
    - name: Le fichier d'environnement existe et n'est lisible que par son proprietaire
      delegate_to: localhost
      become: false
      ansible.builtin.stat:
        path: "{{ fichier_env }}"
      register: env_local

    - name: Refuser si le fichier d'environnement manque ou est trop ouvert
      ansible.builtin.assert:
        that:
          - env_local.stat.exists
          - env_local.stat.mode is match('0[0-7]00')
        fail_msg: >-
          {{ fichier_env }} est absent, ou son mode ({{ env_local.stat.mode | default('?') }})
          le rend lisible par d'autres. Il porte quatorze mots de passe de base,
          les cles de signature et la cle FedaPay. `chmod 600` puis relancer.

    # ══════════════════════════════════════════════════════════════════════
    # LE VERIFICATEUR EXISTE-T-IL ? LA QUESTION N'EST PAS RHETORIQUE.
    #
    # Cette tache appelait `scripts/verifier-env-compose.py`, supprime par le
    # portage des controles en C#. L'appel, lui, est reste. La commande
    # echouait donc sur « can't open file » — et `no_log: true` cachait ce
    # message : le deploiement semblait accuser des variables manquantes alors
    # que le VERIFICATEUR etait absent. Meme defaut que `check-di.py`, en pire,
    # parce que muet.
    # ══════════════════════════════════════════════════════════════════════
    - name: Le verificateur d'environnement est present
      delegate_to: localhost
      become: false
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../scripts/verifier-env-compose.sh"
      register: verificateur

    - name: Refuser si le verificateur manque
      ansible.builtin.assert:
        that: verificateur.stat.exists
        fail_msg: >-
          scripts/verifier-env-compose.sh est absent. Sans lui, les quarante-six
          variables ne sont pas relues avant l'envoi, et compose ne nommerait la
          premiere manquante qu'apres avoir tout transfere sur le VPS.

    - name: Verifier les quarante-six variables obligatoires du compose
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        cmd: bash scripts/verifier-env-compose.sh docker-compose.prod.yml {{ fichier_env }}
        chdir: "{{ playbook_dir }}/.."
      changed_when: false
      # ══════════════════════════════════════════════════════════════════════
      # `no_log: false`, ET C'EST UN CHOIX, PAS UN OUBLI.
      #
      # Il valait `true` « par prudence ». Le jour ou la tache a echoue, cette
      # prudence a cache la cause pendant vingt minutes : Ansible n'a rendu que
      # « the output has been hidden ».
      #
      # Le script n'affiche QUE des noms de variables — c'est l'invariante
      # ecrite en tete de son fichier, et la seule qui compte la-bas. Tant
      # qu'elle tient, montrer sa sortie ne divulgue rien ; le jour ou
      # quelqu'un y ajoute une ligne de mise au point qui imprime une valeur,
      # c'est CETTE ligne qu'il faut refuser en revue, pas la visibilite de
      # l'echec.
      # ══════════════════════════════════════════════════════════════════════
      no_log: false

  tasks:
    # ══════════════════════════════════════════════════════════════════════
    - name: Preparation du VPS
      tags: [preparation]
      block:
        - name: Docker et le greffon compose sont installes
          ansible.builtin.apt:
            name:
              - docker.io
              - docker-compose-plugin
            state: present
            update_cache: true
            cache_valid_time: 3600

        - name: Le service docker est demarre et actif au boot
          ansible.builtin.systemd:
            name: docker
            state: started
            enabled: true

        # ══════════════════════════════════════════════════════════════════
        # k3s DOIT ETRE ARRETE : IL TIENT 80 ET 443.
        #
        # ingress-nginx s'y lie par `hostPort`. Traefik demande les memes ports :
        # le second a demarrer echoue sur « address already in use ».
        #
        # `enabled: false` AUTANT QUE `state: stopped` — sans lui, k3s repart au
        # prochain redemarrage du VPS et reprend les deux ports. La panne
        # surviendrait des semaines plus tard, apres un reboot, et personne ne
        # ferait le lien.
        #
        # `failed_when: false` : sur une machine ou k3s n'a jamais ete installe,
        # l'unite n'existe pas, et ce n'est pas une erreur.
        # ══════════════════════════════════════════════════════════════════
        - name: k3s est arrete et desactive — il tient 80 et 443
          ansible.builtin.systemd:
            name: k3s
            state: stopped
            enabled: false
          failed_when: false
          register: k3s_arret

        - name: Le repertoire de la pile existe
          ansible.builtin.file:
            path: "{{ hba_racine }}"
            state: directory
            owner: root
            group: root
            mode: "0750"

        # ══════════════════════════════════════════════════════════════════
        # `ss` NE DIT JAMAIS « traefik » POUR UN PORT PUBLIE PAR DOCKER.
        #
        # CE QUI ETAIT CASSE. Cette garde cherchait la chaine « traefik » dans
        # la sortie de `ss`. Or Docker publie un port en interposant son propre
        # relais : le processus qui DETIENT la socket s'appelle toujours
        # `docker-proxy`, quel que soit le conteneur derriere.
        #
        # La garde ne pouvait donc JAMAIS passer des lors qu'un conteneur tient
        # 80 ou 443 — y compris notre propre Traefik. Elle bloquait le
        # deploiement en accusant « autre chose que Traefik » alors qu'elle
        # etait incapable, par construction, de reconnaitre Traefik.
        #
        # On demande donc a Docker, qui sait quel CONTENEUR publie quoi. Ce que
        # `ss` rend reste affiche dans le message : quand le coupable n'est pas
        # un conteneur, c'est la seule piste.
        #
        # CE QUE CA NE COUVRE PAS : un conteneur qui porterait « traefik » dans
        # son nom sans etre le notre — celui de Coolify, par exemple, s'appelle
        # `coolify-proxy` et sera bien refuse, mais un `traefik` etranger
        # passerait. Le nom est un indice, pas une preuve.
        # ══════════════════════════════════════════════════════════════════
        - name: Ce qui tient 80 et 443 au niveau du systeme
          ansible.builtin.shell:
            cmd: ss -tulpn | grep -E ':(80|443)\s' || true
          changed_when: false
          register: ports_occupes

        - name: Les conteneurs qui publient 80 ou 443
          ansible.builtin.shell:
            cmd: >-
              docker ps --filter publish=80 --filter publish=443
              --format '{% raw %}{{.Names}}{% endraw %}' || true
          changed_when: false
          register: conteneurs_ports

        - name: Refuser si autre chose que Traefik tient 80 ou 443
          vars:
            intrus: "{{ conteneurs_ports.stdout_lines | reject('search', 'traefik') | list }}"
          ansible.builtin.assert:
            that: >-
              ports_occupes.stdout | trim == ''
              or (conteneurs_ports.stdout_lines | length > 0 and intrus | length == 0)
            fail_msg: >-
              80 ou 443 sont pris par autre chose que Traefik.
              Conteneurs qui publient ces ports : {{ conteneurs_ports.stdout_lines | default([]) | join(', ') | default('aucun', true) }}.
              Intrus : {{ intrus | join(', ') | default('aucun conteneur — un processus hote tient le port', true) }}.
              Detail systeme : {{ ports_occupes.stdout }}
              Traefik ne pourra pas se lier, et l'erreur ne nommera pas le coupable.

    # ══════════════════════════════════════════════════════════════════════
    - name: Transfert du compose, de l'environnement et de rembg
      tags: [transfert]
      block:
        - name: Le compose de production
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../docker-compose.prod.yml"
            dest: "{{ compose }}"
            owner: root
            group: root
            mode: "0640"

        # LE SEUL SERVICE ENCORE CONSTRUIT SUR PLACE. Il n'est publie dans aucun
        # registre — image Python legere, pas un des vingt hotes .NET.
        - name: Le contexte de construction de rembg
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../infra/rembg/"
            dest: "{{ hba_racine }}/infra/rembg/"
            owner: root
            group: root
            mode: "0640"
            directory_mode: "0750"

        - name: Le fichier d'environnement
          ansible.builtin.copy:
            src: "{{ fichier_env }}"
            dest: "{{ hba_racine }}/.env"
            owner: root
            group: root
            mode: "0600"
          no_log: true

    # ══════════════════════════════════════════════════════════════════════
    - name: Images
      tags: [images]
      block:
        # Le jeton n'apparait ni dans le journal, ni dans la table des processus
        # du VPS : `--password-stdin` le lit sur l'entree standard.
        - name: Connexion au registre prive
          ansible.builtin.shell:
            cmd: printf '%s' '{{ ghcr_token }}' | docker login ghcr.io -u hectorberi01 --password-stdin
          when: ghcr_token | length > 0
          no_log: true
          changed_when: true

        # `pull` SEPAREMENT DU `up` : c'est ici que se voit une image absente du
        # registre ou un tag qui n'existe pas, et l'erreur NOMME l'image. Melange
        # au demarrage, le meme echec arrive au milieu de vingt-cinq conteneurs.
        - name: Tirer les images publiees
          ansible.builtin.command:
            cmd: "{{ dc }} pull"
            chdir: "{{ hba_racine }}"
          register: tirage
          changed_when: "'Pulled' in tirage.stderr or 'Downloaded' in tirage.stderr"

        - name: Construire rembg, qui n'est publie nulle part
          ansible.builtin.command:
            cmd: "{{ dc }} build rembg"
            chdir: "{{ hba_racine }}"
          changed_when: true

    # ══════════════════════════════════════════════════════════════════════
    - name: Migration des bases
      tags: [migration]
      block:
        # LA LISTE EST DERIVEE DU DEPOT, JAMAIS ECRITE ICI.
        #
        # `services-a-migrer.py` retient les services dont le code appelle
        # `MigrateHbaDatabaseAsync`, et met identity-service en tete — c'est lui
        # qui amorce le compte administrateur, et le voir passer en premier dit
        # tout de suite si la base repond.
        - name: Deduire les services porteurs de migrations
          delegate_to: localhost
          become: false
          ansible.builtin.command:
            cmd: python3 scripts/services-a-migrer.py
            chdir: "{{ playbook_dir }}/.."
          changed_when: false
          register: a_migrer

        - name: Afficher ce qui va etre migre
          ansible.builtin.debug:
            msg: "{{ a_migrer.stdout_lines | length }} service(s) : {{ a_migrer.stdout_lines | join(', ') }}"

        # `--no-deps` : sans lui, `compose run` demarre toute la cascade de
        # `depends_on` — Kafka, Redis, MinIO — pour un processus qui n'en a pas
        # besoin. `DATABASE__MIGRATEONLY` fait sortir l'hote AVANT `app.Run()` :
        # aucun port ouvert, aucun courtier a joindre.
        - name: Migrer chaque service, un par un
          ansible.builtin.command:
            cmd: >-
              {{ dc }} run --rm --no-deps
              -e DATABASE__MIGRATEONLY=true {{ item }}
            chdir: "{{ hba_racine }}"
          loop: "{{ a_migrer.stdout_lines }}"
          register: migrations
          changed_when: true

    # ══════════════════════════════════════════════════════════════════════
    - name: Initialisation des sujets Kafka
      tags: [sujets]
      block:
        - name: Demarrer le courtier seul
          ansible.builtin.command:
            cmd: "{{ dc }} up -d kafka"
            chdir: "{{ hba_racine }}"
          changed_when: true

        - name: Attendre que le courtier reponde
          ansible.builtin.command:
            cmd: docker exec hba-kafka kafka-topics --bootstrap-server localhost:9092 --list
          register: kafka_pret
          retries: 30
          delay: 5
          until: kafka_pret.rc == 0
          changed_when: false

        # LA LISTE VIENT DU CALQUE ENGENDRE, PAS D'ICI.
        #
        # `k8s/overlays/prod/kafka-topics.yaml` est produit par
        # `scripts/k8s-kafka-topics.py`, miroir de `HbaTopics.DomaineParService`,
        # et `check-kafka-topics.py` verifie qu'il n'a pas derive. Recopier les
        # vingt noms ici en ferait une quatrieme source, qui divergerait.
        #
        # POURQUOI LES CREER PLUTOT QUE LES LAISSER NAITRE.
        # `auto.create.topics.enable` vaut vrai : le premier producteur fait
        # naitre son sujet, avec UNE partition et la retention par defaut. Rien
        # ne casse, tout parait marcher, et le parallelisme des consommateurs est
        # plafonne a un pod sans que rien ne le dise.
        - name: Lire les sujets du catalogue
          delegate_to: localhost
          become: false
          ansible.builtin.shell:
            # Guillemets OBLIGATOIRES : `topicName: ` contient un deux-points
            # suivi d'un espace, que YAML lirait comme une association.
            cmd: "grep -o 'topicName: ' -A0 k8s/overlays/prod/kafka-topics.yaml >/dev/null; sed -n 's/^ *topicName: //p' k8s/overlays/prod/kafka-topics.yaml"
            chdir: "{{ playbook_dir }}/.."
          changed_when: false
          register: sujets

        - name: Refuser si le catalogue est vide
          ansible.builtin.assert:
            that: sujets.stdout_lines | length > 0
            fail_msg: >-
              Aucun sujet lu dans k8s/overlays/prod/kafka-topics.yaml.
              Regenerer avec `python3 scripts/k8s-kafka-topics.py`.

        # UN SEUL COURTIER : replication 1, et `--if-not-exists` rend la tache
        # rejouable. Trois repliques sur un noeud unique vivraient sur le meme
        # disque — la garantie serait ecrite et jamais obtenue, et Kafka
        # refuserait meme la creation faute de courtiers.
        - name: Creer les sujets, trois partitions, une replique
          ansible.builtin.command:
            cmd: >-
              docker exec hba-kafka kafka-topics --bootstrap-server localhost:9092
              --create --if-not-exists --topic {{ item }}
              --partitions 3 --replication-factor 1
            chdir: "{{ hba_racine }}"
          loop: "{{ sujets.stdout_lines }}"
          changed_when: true

    # ══════════════════════════════════════════════════════════════════════
    - name: Demarrage de la pile
      tags: [demarrage]
      ansible.builtin.command:
        cmd: "{{ dc }} up -d"
        chdir: "{{ hba_racine }}"
      changed_when: true

    # ══════════════════════════════════════════════════════════════════════
    - name: TLS et nom de domaine
      tags: [tls]
      block:
        # LE DNS EST VERIFIE DEPUIS LE POSTE, PAS DEPUIS LE VPS.
        #
        # Le VPS peut resoudre son propre nom par `/etc/hosts` et repondre
        # « tout va bien » alors qu'aucun client d'Internet n'y arrive. La
        # question qui compte est celle que se pose Let's Encrypt, depuis
        # l'exterieur.
        - name: Le domaine pointe bien cette machine
          delegate_to: localhost
          become: false
          ansible.builtin.command:
            cmd: dig +short {{ hba_domaine }}
          changed_when: false
          register: dns

        - name: Refuser si le DNS ne designe pas le VPS
          ansible.builtin.assert:
            that: hba_adresse_publique in dns.stdout
            fail_msg: >-
              {{ hba_domaine }} rend « {{ dns.stdout | trim }} » au lieu de
              {{ hba_adresse_publique }}. Le defi HTTP-01 echouera, et Let's
              Encrypt limite a cinq echecs par heure et par domaine.

        - name: Attendre que Traefik obtienne le certificat
          delegate_to: localhost
          become: false
          ansible.builtin.uri:
            url: "https://{{ hba_domaine }}/health/ready"
            validate_certs: true
            status_code: [200, 404, 503]
          register: tls
          retries: 20
          delay: 15
          until: tls.status is defined
          # Un 404 ou un 503 prouve que le TLS est valide : la reponse vient de
          # la passerelle, a travers un certificat que le client a accepte. Seul
          # un echec de VALIDATION du certificat nous interesse ici.

    # ══════════════════════════════════════════════════════════════════════
    - name: Verification
      tags: [verification]
      block:
        - name: Etat des conteneurs
          ansible.builtin.command:
            cmd: "{{ dc }} ps --format json"
            chdir: "{{ hba_racine }}"
          changed_when: false
          register: etat

        - name: Conteneurs qui ne tournent pas
          ansible.builtin.shell:
            cmd: docker ps -a --filter "label=com.docker.compose.project={{ hba_projet }}" --format '{{ "{{" }}.Names{{ "}}" }}\t{{ "{{" }}.Status{{ "}}" }}' | grep -v ' Up ' || true
          changed_when: false
          register: en_panne

        - name: Le resultat
          ansible.builtin.debug:
            msg: >-
              {{ (en_panne.stdout | trim == '')
                 | ternary('Tous les conteneurs tournent.',
                           'CONTENEURS EN PANNE :\n' + en_panne.stdout) }}
