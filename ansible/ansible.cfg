# ==============================================================================
# Configuration Ansible du depot HBA.
# ==============================================================================
[defaults]
inventory            = inventaire/prod.yml
host_key_checking    = True
retry_files_enabled  = False
stdout_callback      = yaml
display_skipped_hosts = False
interpreter_python   = auto_silent

# LES SECRETS NE DOIVENT PAS ATTERRIR DANS UN JOURNAL.
# `no_log` est pose tache par tache dans le playbook ; ce reglage-ci evite en
# plus qu'un module verbeux ne recrache une variable au premier `-v`.
no_target_syslog = True

[ssh_connection]
# Le pipelining evite un fichier temporaire par tache : plus rapide, et surtout
# rien n'est ecrit sur le disque du VPS entre deux etapes.
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s
