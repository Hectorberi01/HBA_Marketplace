services:
  analytics-service:
    build:
      context: ../../..
      dockerfile: services/common/analytics-service/Dockerfile
    env_file:
      - ../../../infra/env/dev-auth.env
    environment:
      SERVICE_NAME: analytics-service
      ASPNETCORE_ENVIRONMENT: Development
      HOSTING__HTTPPORT: 8080
      HOSTING__GRPCPORT: 9090
      CONNECTIONSTRINGS__DEFAULT: Host=postgres;Port=5432;Database=hba_analytics;Username=hba;Password=hba
      KAFKA__BOOTSTRAPSERVERS: kafka:29092
      KAFKA__CONSUMERGROUP: hba-analytics-service
      SERVICES__MERCHANT: http://seller-service:9090
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks: [hba-backend]

networks:
  hba-backend:
