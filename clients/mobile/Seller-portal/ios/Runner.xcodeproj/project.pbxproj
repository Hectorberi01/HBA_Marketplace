		A9F31334FDE0B7F6E3914D5A /* FlutterFire: "flutterfire upload-crashlytics-symbols" */ = {
			isa = PBXShellScriptBuildPhase;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
			);
			inputPaths = (
			);
			name = "FlutterFire: \"flutterfire upload-crashlytics-symbols\"";
			outputFileListPaths = (
			);
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "\n#!/bin/bash\n# =========================================================================\n# L'ENVOI DES SYMBOLES EST SAUTÉ EN DEBUG, ET C'EST DÉLIBÉRÉ.\n#\n# Cette phase échouait le build de `flutter run` avec :\n#   ProcessException: No such file or directory\n#   .../SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run --validate\n#\n# Le script cherche le programme d'envoi à DEUX endroits — CocoaPods\n# (`$PODS_ROOT/FirebaseCrashlytics/run`) ou Swift Package Manager\n# (`DerivedData/.../SourcePackages/checkouts/`). Ce projet est un TROISIÈME cas :\n# CocoaPods est bien là (voir la phase « [CP] Embed Pods Frameworks »), mais\n# Firebase arrive par SPM — et le paquet n'est pas résolu à l'emplacement que le\n# script attend. Aucune des deux branches ne trouve donc son fichier.\n#\n# POURQUOI SAUTER PLUTÔT QUE CORRIGER LE CHEMIN.\n#\n# Un dSYM de build DEBUG n'a aucun usage : il n'y a ni utilisateur, ni rapport de\n# plantage à désymboliser. Le téléverser à chaque `flutter run` coûte du temps\n# pour rien. Le vrai besoin est en RELEASE, et cette branche reste intacte.\n#\n# ON NE MET PAS `|| true` SUR LA RELEASE, SURTOUT PAS.\n#\n# Une release qui saute l'envoi en silence produit des rapports de plantage\n# illisibles — des adresses mémoire au lieu de noms de fonctions — et on ne le\n# découvre qu'en cherchant la cause d'un incident en production. Mieux vaut un\n# build qui refuse de passer.\n# =========================================================================\nif [ \"${CONFIGURATION}\" = \"Debug\" ]; then\n  echo \"note: Crashlytics — envoi des symboles sauté (configuration Debug).\"\n  exit 0\nfi\n\nPATH=\"${PATH}:$FLUTTER_ROOT/bin:${PUB_CACHE}/bin:$HOME/.pub-cache/bin\"\n\nif [ -z \"$PODS_ROOT\" ] || [ ! -d \"$PODS_ROOT/FirebaseCrashlytics\" ]; then\n  # Cannot use \"BUILD_DIR%/Build/*\" as per Firebase documentation, it points to \"flutter-project/build/ios/*\" path which doesn't have run script\n  DERIVED_DATA_PATH=$(echo \"$BUILD_ROOT\" | sed -E 's|(.*DerivedData/[^/]+).*|\\1|')\n  PATH_TO_CRASHLYTICS_UPLOAD_SCRIPT=\"${DERIVED_DATA_PATH}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run\"\nelse\n  PATH_TO_CRASHLYTICS_UPLOAD_SCRIPT=\"$PODS_ROOT/FirebaseCrashlytics/run\"\nfi\n\n# Command to upload symbols script used to upload symbols to Firebase server\nflutterfire upload-crashlytics-symbols --upload-symbols-script-path=\"$PATH_TO_CRASHLYTICS_UPLOAD_SCRIPT\" --platform=ios --apple-project-path=\"${SRCROOT}\" --env-platform-name=\"${PLATFORM_NAME}\" --env-configuration=\"${CONFIGURATION}\" --env-project-dir=\"${PROJECT_DIR}\" --env-built-products-dir=\"${BUILT_PRODUCTS_DIR}\" --env-dwarf-dsym-folder-path=\"${DWARF_DSYM_FOLDER_PATH}\" --env-dwarf-dsym-file-name=\"${DWARF_DSYM_FILE_NAME}\" --env-infoplist-path=\"${INFOPLIST_PATH}\" --default-config=default\n";
		};
