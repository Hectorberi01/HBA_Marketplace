[defaults]
inventory        = inventory
roles_path       = roles
host_key_checking = True
# `stdout_callback = yaml` A ÉTÉ RETIRÉ D'ANSIBLE, ET LE PLAYBOOK NE PARTAIT PLUS.
#
# Le nom court `yaml` se résolvait en `community.general.yaml`. Ce plugin est
# supprimé depuis community.general 12.0.0 :
#
#   [ERROR]: The 'community.general.yaml' callback plugin has been removed.
#
# L'erreur tombe AVANT la première tâche : rien ne s'exécute, et le message
# désigne un plugin d'affichage, pas l'inventaire ni les rôles — on cherche donc
# d'abord du côté du playbook.
#
# LE REMPLACEMENT VIT DANS ANSIBLE-CORE, PAS DANS UNE COLLECTION. Depuis
# ansible-core 2.13, le rendu YAML est une OPTION du callback `default`. Il n'y a
# donc plus de dépendance à déclarer dans `requirements.yml` pour l'obtenir.
stdout_callback  = default
result_format    = yaml
interpreter_python = auto_silent
retry_files_enabled = False

# `host_key_checking = True` EST DÉLIBÉRÉ, ET IL COÛTERA UNE MINUTE.
#
# Le passer à False supprime l'invite au premier contact — et supprime du même
# coup la seule protection contre un homme du milieu au moment où l'on pousse une
# clé et des secrets sur des machines neuves. Sur un cluster de quinze services,
# ce moment n'arrive que deux ou trois fois dans la vie du projet.
#
# La bonne manœuvre est de collecter les empreintes une fois, après le
# `terraform apply` :
#   ssh-keyscan -H <ip1> <ip2> <ip3> >> ~/.ssh/known_hosts

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s
