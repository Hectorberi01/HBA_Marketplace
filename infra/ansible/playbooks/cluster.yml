# ═══════════════════════════════════════════════════════════════════════════════
# DES VMs NUES À UN CLUSTER k3s.
#
# Usage :
#   cd infra/ansible
#   ansible-playbook -i inventory/staging.yml playbooks/cluster.yml --check
#   ansible-playbook -i inventory/staging.yml playbooks/cluster.yml
#
# L'ORDRE DES TROIS JEUX EST LA SEULE CHOSE QUI COMPTE ICI.
#
# Le jeton d'enrôlement n'existe qu'APRÈS l'installation du serveur, et les
# agents le lisent dans les faits de ce nœud. Jouer `--limit agents` sur un
# cluster neuf échoue — délibérément, avec un message explicite dans le rôle,
# plutôt que par un agent qui boucle silencieusement sur un jeton vide.
# ═══════════════════════════════════════════════════════════════════════════════
---
- name: Durcissement de l'OS
  hosts: all
  become: true
  roles:
    - commun

- name: Plan de contrôle k3s
  hosts: serveurs
  become: true
  roles:
    - k3s-serveur

- name: Nœuds agents
  hosts: agents
  become: true
  roles:
    - k3s-agent

- name: Vérifier le cluster
  hosts: serveurs
  become: true
  tasks:
    # UN PLAYBOOK VERT NE PROUVE PAS UN CLUSTER SAIN.
    #
    # Chaque tâche ci-dessus a réussi sur SA machine. Rien n'a encore vérifié que
    # les nœuds se voient. Sans ce contrôle, on découvre l'agent manquant au
    # premier déploiement, quand la moitié des pods restent en `Pending` faute de
    # place — un symptôme qui ressemble à un problème de ressources.
    - name: Compter les nœuds prêts
      ansible.builtin.command: k3s kubectl get nodes --no-headers
      register: noeuds
      changed_when: false
      retries: 10
      delay: 15
      until: >-
        noeuds.stdout_lines | length == (groups['all'] | length)
        and 'NotReady' not in noeuds.stdout

    - name: Récapituler
      ansible.builtin.debug:
        msg: "{{ noeuds.stdout_lines }}"

    # CE MESSAGE CITAIT CloudNativePG, QUI N'EST PLUS UTILISÉ.
    #
    # La base a quitté le cluster : elle tourne sur un VPS séparé, et les
    # manifestes CNPG ont été retirés de `k8s/`. Installer son opérateur
    # poserait un contrôleur sans ressource à piloter — inerte, et personne pour
    # s'en apercevoir. Une consigne périmée dans un message de fin de playbook
    # est suivie sans être relue : c'est le pire endroit pour en laisser une.
    - name: Ce qui reste à installer À LA MAIN sur ce cluster
      ansible.builtin.debug:
        msg: >-
          Le cluster tourne, il est VIDE. Restent, dans cet ordre :
          ingress-nginx, cert-manager (+ ClusterIssuer « letsencrypt »),
          l'opérateur Strimzi — puis le Secret `hba-platform`, le secret de
          tirage ghcr, et seulement ensuite `kubectl apply -k k8s/overlays/<env>`.
          PAS d'opérateur CloudNativePG : la base est externe (docs/DEPLOIEMENT.md
          §3.4). Voir §3.6 à §3.9 pour la séquence complète.

    # L'API N'EST PAS JOIGNABLE DEPUIS L'EXTÉRIEUR, ET C'EST VOULU.
    #
    # nftables n'ouvre que 22, 80 et 443 sur l'interface publique ; 6443 n'y
    # figure pas. Le kubeconfig rapatrié pointe pourtant l'adresse publique :
    # `kubectl` depuis un poste expirera sans rien dire d'utile.
    #
    # Un tunnel SSH est la bonne réponse — il ne demande aucune ouverture, et le
    # certificat de k3s couvre déjà 127.0.0.1 :
    #
    #     ssh -N -L 6443:127.0.0.1:6443 <utilisateur>@<ip-publique>
    # Le kubeconfig rapatrié pointe DÉJÀ 127.0.0.1 : rien à réécrire.
    #     KUBECONFIG=kubeconfig-staging.yaml kubectl get nodes
    #
    # Ouvrir 6443 sur Internet exposerait le plan de contrôle. Le §19 vise un
    # bastion ou un VPN ; le tunnel en est la forme la plus simple.
    - name: Comment atteindre l'API depuis un poste
      ansible.builtin.debug:
        msg: >-
          6443 n'est PAS ouvert sur l'interface publique. Depuis votre poste :
          `ssh -N -L 6443:127.0.0.1:6443 {{ ansible_user }}@{{ ansible_host }}`,
          puis `export KUBECONFIG=infra/ansible/kubeconfig-{{ environnement }}.yaml`.
          Le kubeconfig pointe déjà 127.0.0.1 : rien à modifier.
