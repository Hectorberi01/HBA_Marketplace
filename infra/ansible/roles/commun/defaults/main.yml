---
# ═══════════════════════════════════════════════════════════════════════════════
# CE FICHIER N'EXISTAIT PAS : LE RÔLE N'AVAIT AUCUNE VALEUR PAR DÉFAUT.
#
# Toutes ses variables venaient de l'inventaire. Un inventaire incomplet donnait
# donc soit une erreur de template, soit — pire — un `default('ens4')` codé en
# dur dans le gabarit nftables, invisible depuis l'inventaire.
# ═══════════════════════════════════════════════════════════════════════════════

# POSTGRESQL SUR LA MACHINE ELLE-MÊME.
#
# Faux par défaut : c'est la topologie de production, où la base vit sur un
# second VPS joint par un tunnel. Le staging la porte sur le même hôte, et pose
# donc `postgres_sur_hote: true` dans son inventaire.
#
# CE QUE CE DRAPEAU FAIT, ET RIEN DE PLUS : il ouvre 5432 dans nftables pour les
# pods. Il n'installe pas PostgreSQL, ne crée aucune base, et ne touche ni
# `postgresql.conf` ni `pg_hba.conf` — ces trois-là restent manuels
# (docs/DEPLOIEMENT.md §3.4).
postgres_sur_hote: false

# LE RÉSEAU DES PODS, TEL QUE k3s LE POSE PAR DÉFAUT.
#
# `roles/k3s-serveur` ne passe pas `--cluster-cidr` : la valeur est donc celle
# de k3s, 10.42.0.0/16. La changer là-bas sans la changer ici rouvrirait le
# problème que ce drapeau règle — les pods perdraient l'accès à la base, avec un
# délai d'attente pour seul symptôme.
cidr_pods: "10.42.0.0/16"

# LE RÉSEAU DES SERVICES, MÊME RAISONNEMENT.
#
# k3s le pose à 10.43.0.0/16 par défaut. C'est l'adresse que voient les pods
# quand ils appellent l'API (`10.43.0.1:443`) : la traduction vers le port 6443
# de l'hôte se fait APRÈS, donc le paquet arrive bien dans la chaîne d'entrée.
cidr_services: "10.43.0.0/16"
