---
- name: Recharger sshd
  # `reloaded`, PAS `restarted`.
  #
  # Un `restart` coupe la session Ansible en cours. Si la nouvelle configuration
  # est mauvaise, on la découvre en ne pouvant plus se reconnecter — et la tâche
  # précédente a déjà interdit le mot de passe.
  ansible.builtin.systemd:
    name: ssh
    state: reloaded

- name: Recharger nftables
  ansible.builtin.systemd:
    name: nftables
    state: reloaded
