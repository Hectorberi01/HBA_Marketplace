# ═══════════════════════════════════════════════════════════════════════════════
# DURCISSEMENT DE L'OS, AVANT k3s (§19).
#
# CE RÔLE TOURNE SUR TOUS LES NŒUDS, SERVEUR COMME AGENTS.
#
# Ce qu'il fait est ce que personne ne refait après coup : une VM mise en service
# « le temps de tester » reste en service, et son SSH ouvert par mot de passe avec
# elle. Le §19 demande « accès administrateur via VPN/bastion/SSO + MFA » ; à
# défaut de bastion pour l'instant, au minimum : pas de mot de passe, pas de root.
# ═══════════════════════════════════════════════════════════════════════════════
---
- name: Mettre à jour le cache APT
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Installer l'outillage minimal
  ansible.builtin.apt:
    name:
      - curl
      - nftables
      - unattended-upgrades
      - chrony          # voir l'encadré « horloge » plus bas
      - open-iscsi      # requis par les volumes persistants
    state: present

# L'HORLOGE N'EST PAS UN DÉTAIL DE CONFORT.
#
# Les jetons JWT du §12 portent `nbf`/`exp`. Deux nœuds dont les horloges
# divergent de deux minutes produisent des rejets d'authentification qui
# n'arrivent QUE sur l'un des deux — donc une requête sur trois qui échoue, sans
# rien dans les journaux applicatifs qui ressemble à un problème d'heure.
# Les certificats ACME et les offsets Kafka souffrent du même mal.
- name: Activer la synchronisation d'horloge
  ansible.builtin.systemd:
    name: chrony
    enabled: true
    state: started

# LE SWAP DOIT ÊTRE COUPÉ — kubelet REFUSE DE DÉMARRER SINON.
#
# Et la raison de fond vaut mieux que la contrainte : avec du swap, un pod qui
# dépasse sa limite mémoire ralentit au lieu d'être tué. Le scheduler continue de
# le croire sain, les sondes finissent par expirer, et l'on passe une soirée à
# chercher une lenteur réseau qui n'existe pas.
- name: Désactiver le swap (session courante)
  ansible.builtin.command: swapoff -a
  changed_when: false
  failed_when: false

- name: Désactiver le swap (au redémarrage)
  ansible.posix.mount:
    path: none
    fstype: swap
    state: absent

# ═══════════════════════════════════════════════════════════════════════════════
# LES MODULES AVANT LES SYSCTL, SINON LA MOITIÉ DES CLÉS N'EXISTE PAS.
#
# CETTE ÉTAPE MANQUAIT, ET LE RÔLE ÉCHOUAIT SUR UNE MACHINE NEUVE.
#
# `net.bridge.bridge-nf-call-iptables` n'est pas une clé « toujours là » : elle
# n'apparaît sous /proc/sys que lorsque le module `br_netfilter` est chargé. Sur
# une image fraîche, aucun pont n'existe encore, donc le module non plus, et
# `sysctl` répond :
#
#   sysctl: cannot stat /proc/sys/net/bridge/bridge-nf-call-iptables:
#   No such file or directory
#
# LE MESSAGE DÉSIGNE UN FICHIER, PAS UN MODULE. On cherche donc du côté des
# permissions ou d'un noyau exotique, alors qu'il manque un `modprobe`.
#
# L'ÉCHEC EN CASCADE, EN PRIME. `ansible.posix.sysctl` recharge TOUT le fichier
# à chaque élément de la boucle : les clés valides passent, mais la commande
# renvoie une erreur à cause des deux clés absentes — et les six éléments
# échouent l'un après l'autre en répétant la même cause.
#
# `overlay` EST LÀ POUR containerd. k3s l'embarque et charge le module lui-même
# au démarrage ; le poser ici le rend explicite et disponible AVANT, ce qui évite
# un premier démarrage plus lent et une ligne d'erreur dans ses journaux.
#
# CE QUE CETTE TÂCHE NE COUVRE PAS : un noyau compilé sans ces modules — un
# conteneur LXC non privilégié, par exemple. `modprobe` échouerait alors, et
# c'est le bon échec : k3s ne fonctionnerait pas davantage sur cette machine.
# ═══════════════════════════════════════════════════════════════════════════════
# DEUX TÂCHES DU SOCLE PLUTÔT QUE `community.general.modprobe`.
#
# Ce module ferait les deux d'un coup, mais il ajouterait une dépendance à
# `community.general` — la collection qui vient précisément de retirer le plugin
# d'affichage employé par `ansible.cfg`, cassant le playbook sans qu'une ligne du
# dépôt ait changé. `modprobe` et un fichier de configuration n'ont pas besoin
# d'elle.
- name: Charger les modules noyau maintenant
  ansible.builtin.command: "modprobe {{ item }}"
  changed_when: false
  loop:
    - overlay
    - br_netfilter

# `modprobe` seul ne survit pas au redémarrage. Sans ce fichier, les sysctl
# posés plus bas seraient rejetés au prochain boot — et la machine repartirait
# avec des NetworkPolicies partiellement inopérantes, sans erreur au démarrage.
- name: Charger ces modules à chaque démarrage
  ansible.builtin.copy:
    dest: /etc/modules-load.d/kubernetes.conf
    content: |
      # Posé par Ansible — rôle `commun`. Voir tasks/main.yml.
      overlay
      br_netfilter
    owner: root
    group: root
    mode: "0644"

- name: Poser les paramètres noyau requis par Kubernetes
  ansible.posix.sysctl:
    name: "{{ item.nom }}"
    value: "{{ item.valeur }}"
    state: present
    reload: true
  loop:
    # Sans ceux-ci, le trafic entre pods de nœuds différents est routé sans
    # passer par les règles de filtrage — les NetworkPolicies deviennent
    # partiellement inopérantes, ce qui est pire que pas de politique du tout
    # puisqu'on les croit appliquées.
    - { nom: net.bridge.bridge-nf-call-iptables, valeur: "1" }
    - { nom: net.bridge.bridge-nf-call-ip6tables, valeur: "1" }
    - { nom: net.ipv4.ip_forward, valeur: "1" }
    # Postgres, Kafka et Elasticsearch ouvrent beaucoup de descripteurs ; la
    # valeur par défaut d'Ubuntu (65530 zones mémoire) fait échouer Kafka au
    # démarrage avec un message qui parle de mmap, pas de limite.
    - { nom: vm.max_map_count, valeur: "262144" }
    - { nom: fs.inotify.max_user_instances, valeur: "1024" }
    - { nom: fs.inotify.max_user_watches, valeur: "524288" }

# ─────────────────────────────────────────────────────────────────────────────
# SSH (19)
# ─────────────────────────────────────────────────────────────────────────────

# LE NOM DE CETTE TÂCHE ANNONÇAIT PLUS QUE CE QU'ELLE FAIT.
#
# Elle s'appelait « Interdire l'authentification par mot de passe ET LA CONNEXION
# ROOT ». La directive posée est `PermitRootLogin prohibit-password`, qui
# AUTORISE root par clé et refuse seulement le mot de passe. Lu de travers, ce
# nom fait croire que l'accès root est fermé — alors que l'inventaire de staging
# s'y connecte précisément en root.
#
# C'EST DÉLIBÉRÉ ET NÉCESSAIRE ICI : `ansible_user: root`. Poser
# `PermitRootLogin no` couperait Ansible de la machine au jeu suivant, et le
# playbook ne pourrait plus jamais y revenir.
#
# `PasswordAuthentication no` REND LA CLÉ OBLIGATOIRE. Si votre seul accès est un
# mot de passe, ce fichier vous ferme la porte au rechargement de sshd — et il
# n'y a pas de retour en arrière sans console de secours du fournisseur.
# Vérifiez `ssh -o PasswordAuthentication=no root@<ip> true` AVANT de lancer le
# playbook.
- name: Durcir sshd — clé obligatoire, root par clé seulement
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-hba.conf
    mode: "0644"
    content: |
      # Posé par Ansible — rôle `commun`. Ne pas modifier à la main.
      PasswordAuthentication no
      PermitRootLogin prohibit-password
      KbdInteractiveAuthentication no
      X11Forwarding no
      MaxAuthTries 3
  notify: Recharger sshd

# ─────────────────────────────────────────────────────────────────────────────
# PARE-FEU (§1, §5)
# ─────────────────────────────────────────────────────────────────────────────
#
# CETTE LISTE EST LA PREMIÈRE DES DEUX BARRIÈRES DU §1.
#
# La seconde est `k8s/base/policies/`. Celle-ci protège de ce qui arrive par
# l'interface PUBLIQUE ; celle-là, de ce qui se parle à l'intérieur du cluster.
# Aucune ne remplace l'autre — c'est la confusion qui laisse un Postgres joignable
# depuis Internet parce que « les NetworkPolicies sont en place ».
#
# 6443 (API Kubernetes) n'est PAS ouvert au public : il n'écoute que sur
# l'interface privée, et l'administration passe par SSH.

- name: Poser la politique nftables
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0644"
    # `validate` REFUSE UNE RÈGLE MALFORMÉE AVANT DE L'ÉCRIRE.
    #
    # Sans lui, un template cassé remplace le fichier, le service recharge, et
    # l'on perd SSH sur une machine distante — sans autre recours qu'une console
    # de secours OVH.
    validate: nft --check --file %s
  notify: Recharger nftables

- name: Activer nftables au démarrage
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started

- name: Activer les mises à jour de sécurité automatiques
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
