---
# MÊME VERSION QUE LE SERVEUR, ET CE N'EST PAS NÉGOCIABLE.
#
# k3s tolère un agent en retard d'une version mineure, pas davantage, et jamais
# un agent EN AVANCE sur son serveur. Le symptôme d'un décalage n'est pas un
# refus net : le nœud rejoint, puis certains pods échouent à démarrer sur lui
# seulement — la panne la plus coûteuse à diagnostiquer d'un cluster.
#
# La valeur est dupliquée plutôt que partagée par `group_vars` pour que chaque
# rôle reste jouable seul ; `playbooks/cluster.yml` impose la même aux deux.
k3s_version: v1.31.5+k3s1
