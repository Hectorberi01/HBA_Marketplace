# ═══════════════════════════════════════════════════════════════════════════════
# LE NŒUD SERVEUR k3s — PLAN DE CONTRÔLE (§4).
#
# UN SEUL SERVEUR, MÊME EN PRODUCTION À TROIS NŒUDS.
#
# k3s sait faire du HA à trois serveurs embarqués (etcd). Ce rôle ne le fait pas,
# et il vaut mieux le dire que le laisser croire : la production tourne avec UN
# plan de contrôle. Perdre ce nœud ne coupe pas les pods déjà lancés — ils
# continuent — mais plus rien ne se replanifie, et `kubectl` ne répond plus.
#
# C'est un écart au §24 (« perte d'un nœud Kubernetes ») qu'il faudra fermer :
# passer les trois nœuds en `--cluster-init` + `server`. Cela demande un
# équilibreur devant le port 6443, sans quoi les agents pointent un seul serveur
# et l'on n'a rien gagné. Décision à prendre AVANT la mise en production.
# ═══════════════════════════════════════════════════════════════════════════════
---
- name: Vérifier que l'adresse privée est connue
  # SANS `--node-ip` PRIVÉE, LE TRAFIC ENTRE NŒUDS SORT SUR INTERNET.
  #
  # k3s annonce alors l'IP publique, et le VXLAN entre pods passe par le réseau
  # public — en clair, facturé, et hors de toute règle nftables du réseau privé.
  # Tout fonctionne, ce qui est précisément le problème.
  ansible.builtin.assert:
    that:
      - ip_privee is defined
      - ip_privee | length > 0
    fail_msg: >-
      `ip_privee` manque pour {{ inventory_hostname }} — l'inventaire doit la
      porter (sortie `noeuds` de Terraform). Voir infra/ansible/README.md.

- name: Récupérer l'installateur k3s
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"

- name: Installer k3s (serveur)
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s-install.sh
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: >-
      server
      --node-ip {{ ip_privee }}
      --advertise-address {{ ip_privee }}
      {% set _iface = interface_flannel | default(interface_privee | default('ens4')) %}{{ ('--flannel-iface ' ~ _iface) if _iface | length > 0 else '' }}
      --tls-san {{ ansible_host }}
      {% for c in k3s_desactiver %}--disable {{ c }} {% endfor %}
      --write-kubeconfig-mode 0600
    # ═════════════════════════════════════════════════════════════════════
    # `--flannel-iface` NE PREND PLUS `interface_privee`, ET C'EST DÉLIBÉRÉ.
    #
    # Cette variable servait DEUX choses qui ne veulent pas la même valeur :
    #
    #   • nftables accepte `interface_privee` EN BLOC. Y mettre l'interface
    #     PUBLIQUE ouvrirait 6443, 10250, les NodePorts et VXLAN sur Internet.
    #   • k3s la passe à `--flannel-iface`. Y mettre une interface de TUNNEL
    #     rend le nœud dépendant du tunnel : k3s démarré avant `wg0` échoue, et
    #     une coupure du tunnel fait disparaître le réseau des pods.
    #
    # Sur la topologie réelle — un seul nœud, un tunnel WireGuard qui ne porte
    # que PostgreSQL — les deux valeurs diffèrent : `wg0` pour nftables, et
    # RIEN pour flannel, puisqu'il n'y a pas de trafic inter-nœuds.
    #
    # `interface_flannel` par défaut à `interface_privee` : les inventaires à
    # deux nœuds sur réseau privé OVH ne changent pas de comportement. La
    # poser à la chaîne VIDE retire le drapeau — c'est le cas mono-nœud.
    #
    # ATTENTION : le retirer ne vaut QUE pour un nœud unique. Dès qu'un agent
    # rejoint, flannel doit savoir par où encapsuler, sinon il choisit
    # l'interface de la route par défaut — l'interface publique — et le trafic
    # entre pods sortirait en clair sur Internet.
    # ═════════════════════════════════════════════════════════════════════
    # CE QUI N'APPARAÎT PAS CI-DESSUS, ET NE DOIT PAS Y APPARAÎTRE :
    #
    #   --disable-network-policy
    #
    # k3s embarque le contrôleur de politiques réseau de kube-router, activé par
    # défaut : c'est LUI qui applique `k8s/base/policies/`. Le drapeau ci-dessus
    # les rendrait inertes sans rien supprimer — `kubectl get netpol` continuerait
    # de tout afficher. On le pose parfois « le temps de déboguer » une connexion
    # refusée, et on l'oublie. Le débogage se fait en lisant la politique.

- name: Attendre que l'API réponde
  ansible.builtin.wait_for:
    port: 6443
    host: "{{ ip_privee }}"
    timeout: 180

- name: Lire le jeton d'enrôlement des agents
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: jeton_k3s

- name: Publier le jeton pour le rôle agent
  # IL RESTE EN MÉMOIRE DE L'EXÉCUTION, PAS SUR DISQUE.
  #
  # Ce jeton donne le droit de rejoindre le cluster. L'écrire dans un fichier du
  # dépôt ou dans un `group_vars` en clair reviendrait à publier une clé
  # d'admission — et personne ne pense à la faire tourner ensuite.
  ansible.builtin.set_fact:
    k3s_jeton: "{{ jeton_k3s.content | b64decode | trim }}"

# ═══════════════════════════════════════════════════════════════════════════════
# ON NE RÉÉCRIT PLUS L'ADRESSE DU KUBECONFIG, ET C'EST UN RETOUR EN ARRIÈRE.
#
# Une tâche remplaçait ici `127.0.0.1` par l'adresse publique du nœud, « pour
# qu'il serve depuis le poste de l'opérateur ». Elle produisait un kubeconfig
# qui NE FONCTIONNE PAS : nftables ferme 6443 sur l'interface publique. Le
# symptôme est un `kubectl` qui reste suspendu jusqu'au délai d'attente, sans
# rien qui désigne le pare-feu.
#
# Pire, le message de fin de ce playbook demandait ensuite de remettre
# `127.0.0.1` à la main. Le rôle défaisait ce dont l'opérateur avait besoin, et
# la documentation lui demandait de défaire le rôle.
#
# LE KUBECONFIG RESTE DONC EN `127.0.0.1`, ET S'EMPLOIE PAR UN TUNNEL SSH :
#
#     ssh -N -L 6443:127.0.0.1:6443 ubuntu@<ip-publique>
#     export KUBECONFIG=infra/ansible/kubeconfig-<environnement>.yaml
#
# Aucun port à ouvrir, et le certificat couvre `127.0.0.1` — k3s l'inclut
# toujours dans ses SAN.
#
# `--tls-san {{ ansible_host }}` RESTE POSÉ plus haut : le jour où un bastion ou
# un VPN donne un accès direct à 6443 (§19), il suffira de changer l'adresse
# dans le kubeconfig, sans réinstaller le cluster ni réémettre son certificat.
# ═══════════════════════════════════════════════════════════════════════════════

- name: Rapatrier le kubeconfig
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ playbook_dir }}/../kubeconfig-{{ environnement }}.yaml"
    flat: true
  # CE FICHIER EST UN ACCÈS ADMINISTRATEUR COMPLET AU CLUSTER.
  #
  # `infra/ansible/.gitignore` l'exclut. À stocker comme un mot de passe, et à
  # ne jamais confier à un runner CI tant que le §19 (VPN/bastion + MFA) n'est
  # pas en place — c'est précisément le point ouvert de `cd.yml`.
