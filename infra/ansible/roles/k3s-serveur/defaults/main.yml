---
# Version épinglée : un `curl | sh` sans canal fixe installe la dernière version
# stable du jour, et deux nœuds provisionnés à trois semaines d'écart n'ont alors
# pas le même k3s. La mise à jour est une décision, pas un effet de bord.
k3s_version: v1.31.5+k3s1

# Ce que k3s installe et qu'on remplace :
#   • traefik      → l'Ingress de `k8s/` déclare `ingressClassName: nginx` ;
#   • servicelb    → conservé : sur VPS sans équilibreur externe, c'est lui qui
#                    fait écouter l'Ingress sur les ports 80/443 des nœuds ;
#   • local-storage→ conservé pour les volumes de dev ; le data plane (§4)
#                    demandera un StorageClass à revoir avant la production.
k3s_desactiver:
  - traefik
