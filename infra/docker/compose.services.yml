services:

  identity-service:
    image: ${REGISTRY:-ghcr.io/hba}/identity-service:${IDENTITY_VERSION:-latest}

    # Les trois services extraits se construisent localement : leur image n'est
    # dans aucun registre. Le contexte est `HBA/` — voir l'avertissement en tête
    # du Dockerfile : les projets de `shared/` vivent hors du service.
    build:
      context: ../../..
      dockerfile: services/common/identity-service/Dockerfile
    container_name: hba-identity
    restart: unless-stopped

    # ═══════════════════════════════════════════════════════════════════════
    # `required: false` — SANS LUI, AUCUN CLONE NEUF NE DÉMARRE.
    #
    # Les treize `env/*.env` sont un point d'accroche pour des réglages locaux
    # par service.
    #
    # CE BLOC AFFIRMAIT QU'ILS N'EXISTENT DANS AUCUN DÉPÔT. C'EST FAUX.
    #
    # Il disait : « `.gitignore` ignore `*.env`, et seul `env/.env.example` est
    # versionné ». `.gitignore` ignore `.env`, `.env.local` et `.env.*.local` —
    # pas `*.env`. `git ls-files infra/docker/env/` rend les quatorze fichiers :
    # ils sont tous suivis.
    #
    # `required: false` reste néanmoins juste, pour une AUTRE raison : un clone
    # peut retirer l'un de ces fichiers pour ses propres réglages, et la pile ne
    # doit pas refuser de démarrer pour autant. C'est aussi pourquoi rien
    # d'indispensable ne vit dedans — voir l'export OTLP ci-dessous.
    #
    # Tout ce dont les services ont besoin vit dans les blocs `environment:`
    # ci-dessous, alimentés par le `.env` de ce répertoire (voir
    # `.env.example`). Ces fichiers-ci ne sont qu'une surcharge facultative,
    # et ils le disent désormais.
    #
    # La forme longue `- path: … / required: false` exige Compose v2.24+.
    # Sur une version antérieure, l'erreur parle de « unexpected type » et non
    # de version — dans ce cas, retirer purement ces blocs est sans risque.
    # ═══════════════════════════════════════════════════════════════════════
    env_file:
      - path: ./env/identity.env
        required: false

    environment:
      # ASPNETCORE_URLS retiré : `ListenAnyIP` dans le code le rend inopérant.
      Hosting__HttpPort: "8080"
      Hosting__GrpcPort: "8081"
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}

      ConnectionStrings__Default: >
        Host=postgres;
        Port=5432;
        Database=hba_identity;
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD}

      Redis__ConnectionString: >
        redis:6379,password=${REDIS_PASSWORD}

      Kafka__BootstrapServers: kafka:29092

      # ═══════════════════════════════════════════════════════════════════
      # L'EXPORT OTLP — SANS CETTE LIGNE, LE SERVICE EST MUET, EN SILENCE.
      #
      # `ServiceHostExtensions` appelle `AddHbaTelemetry` pour TOUS les
      # services, avec cet argument : « un branchement à faire quatorze fois
      # est un branchement qu'on oublie une fois — et le service oublié est
      # muet sans que rien ne le signale ». L'appel a bien été centralisé.
      # L'ADRESSE, elle, ne l'avait pas été.
      #
      # `TelemetryExtensions` calcule `hasEndpoint = Uri.TryCreate(...)` et
      # n'ajoute `AddOtlpExporter` QUE si l'adresse est lisible. Absente, le
      # service démarre, sert, passe ses tests — et n'envoie ni trace, ni
      # métrique, ni journal corrélé.
      #
      # C'ÉTAIT LE CAS DE TREIZE SERVICES SUR QUATORZE.
      #
      # Seule la passerelle portait l'adresse, dans son `appsettings.json`.
      # Prometheus, Grafana, Loki et le collecteur tournaient donc pour un
      # seul processus — pendant que le commentaire de `prometheus.yml`
      # affirmait que « les métriques des quinze processus y arrivent ».
      #
      # POSÉE ICI ET NON DANS `env/*.env`, ET C'EST LE POINT.
      #
      # Ces fichiers sont déclarés `required: false` : un service dont le
      # fichier manque repartirait muet, exactement comme avant. Le bloc
      # `environment:` est la source à laquelle le service ne peut pas
      # échapper. Le `.env` du répertoire garde le dernier mot par
      # `OTEL_ENDPOINT`, pour viser un collecteur distant sans toucher ici.
      #
      # `scripts/check-infra.py` refuse désormais un service sans cette ligne.
      # ═══════════════════════════════════════════════════════════════════
      OpenTelemetry__Endpoint: ${OTEL_ENDPOINT:-http://otel-collector:4317}

      # Secrets d'orchestrateur, jamais versionnés. La clé de signature est
      # SYMÉTRIQUE : qui la lit forge des jetons Admin. La clé interne ouvre
      # les routes /internal/* de TOUS les services.
      Internal__ApiKey: ${INTERNAL_API_KEY:?INTERNAL_API_KEY est obligatoire}

      # ═══════════════════════════════════════════════════════════════════
      # IDENTITÉ D'APPELANT gRPC — CE QUE `Internal__ApiKey` NE FAIT PAS.
      #
      # `Internal__ApiKey` EST LA MÊME POUR TOUS. ELLE N'IDENTIFIE PERSONNE.
      #
      # Elle atteste l'appartenance au réseau, rien de plus : un service
      # compromis la lit dans son environnement et appelle dès lors n'importe
      # quel RPC de n'importe quel service — `GetSellerPayout`,
      # `RefundPayment`, `ReleaseReservation` — en se présentant comme
      # n'importe qui. Les trois variables ci-dessous ferment cela.
      #
      # `Internal__PrivateKey` est PROPRE à cet hôte : la compromettre permet
      # d'usurper CE service, et aucun autre. `Internal__PublicKeys` est le
      # MÊME registre partout et n'a aucune valeur pour un attaquant — il ne
      # sert qu'à vérifier.
      #
      # Les deux sont engendrées par `scripts/generer-identites-internes.sh`,
      # qui écrit un `identites.env` à recopier dans le `.env` de ce
      # répertoire.
      #
      # REDÉMARRER LES HÔTES ENSEMBLE À CHAQUE ROTATION.
      #
      # Un hôte redémarré avec un nouveau registre refuse les anciens
      # appelants, et un hôte non redémarré signe avec une clé que les autres
      # ne connaissent plus. Le déploiement progressif produit donc une fenêtre
      # d'`Unauthenticated` croisés — que rien dans les journaux ne relie à une
      # rotation de clés.
      #
      # `Internal__ServiceName` est écrit EXPLICITEMENT alors que le code sait
      # se replier sur le nom de l'assembly. C'est délibéré : ce nom est la clé
      # de la table d'autorisations, et le lire ici évite d'ouvrir
      # `AutorisationsGrpc.cs` pour savoir de quel hôte parle une variable
      # `INTERNAL_KEY_*`. Il doit correspondre EXACTEMENT à une entrée de
      # cette table — `scripts/check-autorisations-grpc.py` le vérifie.
      # ═══════════════════════════════════════════════════════════════════
      Internal__ServiceName: HBA.Identity.Api
      Internal__PrivateKey: ${INTERNAL_KEY_HBA_IDENTITY_API:?INTERNAL_KEY_HBA_IDENTITY_API est obligatoire}
      Internal__PublicKeys: ${INTERNAL_PUBLIC_KEYS:?INTERNAL_PUBLIC_KEYS est obligatoire}
      Authentication__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY est obligatoire}
      Authentication__Issuer: hba-identity
      Authentication__Audience: hba-platform
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY est obligatoire}
      Jwt__Issuer: hba-identity
      Jwt__Audience: hba-platform

      # PREMIER ADMINISTRATEUR — OBLIGATOIRE, ET LE COMPOSE LE FAIT SAVOIR.
      #
      # `${VAR:?message}` refuse de démarrer la pile si la variable manque, au
      # lieu de laisser identity-service lever au bout de trente secondes dans un
      # flux de journal partagé par quatorze conteneurs.
      #
      # L'amorçage est idempotent : le mot de passe n'est jamais réinitialisé.
      Admin__Email: ${ADMIN_EMAIL:?ADMIN_EMAIL est obligatoire}
      Admin__Password: ${ADMIN_PASSWORD:?ADMIN_PASSWORD est obligatoire}
      Admin__FirstName: ${ADMIN_FIRST_NAME:-Admin}
      Admin__LastName: ${ADMIN_LAST_NAME:-Plateforme}
      Admin__Phone: ${ADMIN_PHONE:-+22900000000}

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      kafka:
        condition: service_started

    networks:
      - hba-backend
      - hba-proxy

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.identity.rule=Host(`${API_DOMAIN}`) && PathPrefix(`/api/identity`)"
      - "traefik.http.routers.identity.entrypoints=websecure"
      - "traefik.http.routers.identity.tls.certresolver=letsencrypt"
      - "traefik.http.services.identity.loadbalancer.server.port=8080"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s


  user-service:
    image: ${REGISTRY:-ghcr.io/hba}/user-service:${USER_VERSION:-latest}

    # Les trois services extraits se construisent localement : leur image n'est
    # dans aucun registre. Le contexte est `HBA/` — voir l'avertissement en tête
    # du Dockerfile : les projets de `shared/` vivent hors du service.
    build:
      context: ../../..
      dockerfile: services/common/user-service/Dockerfile
    container_name: hba-user
    restart: unless-stopped

    env_file:
      - path: ./env/user.env
        required: false

    environment:
      # ASPNETCORE_URLS retiré : `ListenAnyIP` dans le code le rend inopérant.
      Hosting__HttpPort: "8080"
      Hosting__GrpcPort: "8081"
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}

      ConnectionStrings__Default: >
        Host=postgres;
        Port=5432;
        Database=hba_user;
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD}

      Kafka__BootstrapServers: kafka:29092

      # Export OTLP — voir l'encadré du premier service de ce fichier.
      OpenTelemetry__Endpoint: ${OTEL_ENDPOINT:-http://otel-collector:4317}
      Redis__ConnectionString: redis:6379,password=${REDIS_PASSWORD}

      # MANQUAIT — user-service NE DÉMARRAIT PAS.
      #
      # `AddIdentityGrpcClient` résout le compte derrière un profil. Il lève à
      # la construction de l'hôte quand l'adresse manque : le conteneur sort
      # avant que la sonde n'existe.
      Services__Identity: http://identity-service:8081

      # Secrets d'orchestrateur, jamais versionnés. La clé de signature est
      # SYMÉTRIQUE : qui la lit forge des jetons Admin. La clé interne ouvre
      # les routes /internal/* de TOUS les services.
      Internal__ApiKey: ${INTERNAL_API_KEY:?INTERNAL_API_KEY est obligatoire}

      # Identité d'appelant gRPC — encadré complet chez identity-service.
      Internal__ServiceName: HBA.Users.Api
      Internal__PrivateKey: ${INTERNAL_KEY_HBA_USERS_API:?INTERNAL_KEY_HBA_USERS_API est obligatoire}
      Internal__PublicKeys: ${INTERNAL_PUBLIC_KEYS:?INTERNAL_PUBLIC_KEYS est obligatoire}
      Authentication__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY est obligatoire}
      Authentication__Issuer: hba-identity
      Authentication__Audience: hba-platform

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

    networks:
      - hba-backend

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  merchant-service:
    image: ${REGISTRY:-ghcr.io/hba}/merchant-service:${MERCHANT_VERSION:-latest}
    build:
      context: ../../..
      dockerfile: services/marketplace/seller-service/Dockerfile
    container_name: hba-merchant
    restart: unless-stopped

    env_file:
      - path: ./env/merchant.env
        required: false

    environment:
      Hosting__HttpPort: "8080"
      Hosting__GrpcPort: "8081"
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}

      ConnectionStrings__Default: >
        Host=postgres;
        Port=5432;
        Database=hba_merchant;
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD}

      Kafka__BootstrapServers: kafka:29092

      # Export OTLP — voir l'encadré du premier service de ce fichier.
      OpenTelemetry__Endpoint: ${OTEL_ENDPOINT:-http://otel-collector:4317}

      # MANQUAIT, ALORS QUE CE SERVICE MET EN CACHE.
      #
      # `SellerModuleApi` cache la fiche vendeur ET sa résolution par utilisateur,
      # avec mémorisation des absences. Sans cette clé, chaque réplique gardait son
      # propre dictionnaire : une invalidation déclenchée par un `SaveChanges` ne
      # vidait que le processus qui avait écrit, et les autres servaient une fiche
      # périmée jusqu'au TTL de dix minutes.
      #
      # C'est ce même cache qui portera les permissions au lot C — et la promesse
      # de couper immédiatement un accès suspendu.
      Redis__ConnectionString: redis:6379,password=${REDIS_PASSWORD}

      Services__Media: http://media-service:8081
      Services__Identity: http://identity-service:8081
      Internal__ApiKey: ${INTERNAL_API_KEY:?INTERNAL_API_KEY est obligatoire}

      # Identité d'appelant gRPC — encadré complet chez identity-service.
      Internal__ServiceName: HBA.Merchants.Api
      Internal__PrivateKey: ${INTERNAL_KEY_HBA_MERCHANTS_API:?INTERNAL_KEY_HBA_MERCHANTS_API est obligatoire}
      Internal__PublicKeys: ${INTERNAL_PUBLIC_KEYS:?INTERNAL_PUBLIC_KEYS est obligatoire}
      Authentication__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY est obligatoire}
      Authentication__Issuer: hba-identity
      Authentication__Audience: hba-platform

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      identity-service:
        condition: service_started
      kafka:
        condition: service_started

    networks:
      - hba-backend

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  catalog-service:
    image: ${REGISTRY:-ghcr.io/hba}/catalog-service:${CATALOG_VERSION:-latest}
    build:
      context: ../../..
      dockerfile: services/marketplace/catalog-service/Dockerfile
    container_name: hba-catalog
    restart: unless-stopped

    env_file:
      - path: ./env/catalog.env
        required: false

    environment:
      Hosting__HttpPort: "8080"
      Hosting__GrpcPort: "8081"
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}

      ConnectionStrings__Default: >
        Host=postgres;
        Port=5432;
        Database=hba_catalog;
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD}

      Kafka__BootstrapServers: kafka:29092

      # Export OTLP — voir l'encadré du premier service de ce fichier.
      OpenTelemetry__Endpoint: ${OTEL_ENDPOINT:-http://otel-collector:4317}
      Redis__ConnectionString: redis:6379,password=${REDIS_PASSWORD}
      Internal__ApiKey: ${INTERNAL_API_KEY:?INTERNAL_API_KEY est obligatoire}

      # Identité d'appelant gRPC — encadré complet chez identity-service.
      Internal__ServiceName: HBA.Catalog.Api
      Internal__PrivateKey: ${INTERNAL_KEY_HBA_CATALOG_API:?INTERNAL_KEY_HBA_CATALOG_API est obligatoire}
      Internal__PublicKeys: ${INTERNAL_PUBLIC_KEYS:?INTERNAL_PUBLIC_KEYS est obligatoire}
      Authentication__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY est obligatoire}
      Authentication__Issuer: hba-identity
      Authentication__Audience: hba-platform

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      merchant-service:
        condition: service_started

      kafka:
        condition: service_started

    networks:
      - hba-backend

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  inventory-service:
    image: ${REGISTRY:-ghcr.io/hba}/inventory-service:${INVENTORY_VERSION:-latest}
    build:
      context: ../../..
      dockerfile: services/marketplace/inventory-service/Dockerfile
    container_name: hba-inventory
    restart: unless-stopped

    env_file:
      - path: ./env/inventory.env
        required: false

    environment:
      Hosting__HttpPort: "8080"
      Hosting__GrpcPort: "8081"
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}

      ConnectionStrings__Default: >
        Host=postgres;
        Port=5432;
        Database=hba_inventory;
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD}

      Kafka__BootstrapServers: kafka:29092

      # Export OTLP — voir l'encadré du premier service de ce fichier.
      OpenTelemetry__Endpoint: ${OTEL_ENDPOINT:-http://otel-collector:4317}
      Internal__ApiKey: ${INTERNAL_API_KEY:?INTERNAL_API_KEY est obligatoire}

      # Identité d'appelant gRPC — encadré complet chez identity-service.
      Internal__ServiceName: HBA.Inventory.Api
      Internal__PrivateKey: ${INTERNAL_KEY_HBA_INVENTORY_API:?INTERNAL_KEY_HBA_INVENTORY_API est obligatoire}
      Internal__PublicKeys: ${INTERNAL_PUBLIC_KEYS:?INTERNAL_PUBLIC_KEYS est obligatoire}
      Authentication__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY est obligatoire}
      Authentication__Issuer: hba-identity
      Authentication__Audience: hba-platform

    depends_on:
      postgres:
        condition: service_healthy

      kafka:
        condition: service_started

    networks:
      - hba-backend

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  commerce-service:
    image: ${REGISTRY:-ghcr.io/hba}/commerce-service:${COMMERCE_VERSION:-latest}
    build:
      context: ../../..
      dockerfile: services/marketplace/cart-service/Dockerfile
    container_name: hba-commerce
    restart: unless-stopped

    env_file:
      - path: ./env/commerce.env
        required: false

    environment:
      Hosting__HttpPort: "8080"
      Hosting__GrpcPort: "8081"
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}

      Redis__ConnectionString: redis:6379,password=${REDIS_PASSWORD}
      Kafka__BootstrapServers: kafka:29092

      # Export OTLP — voir l'encadré du premier service de ce fichier.
      OpenTelemetry__Endpoint: ${OTEL_ENDPOINT:-http://otel-collector:4317}
      Services__Catalog: http://catalog-service:8081
      Services__Inventory: http://inventory-service:8081
      Services__Order: http://order-service:8081
      Internal__ApiKey: ${INTERNAL_API_KEY:?INTERNAL_API_KEY est obligatoire}

      # Identité d'appelant gRPC — encadré complet chez identity-service.
      Internal__ServiceName: HBA.Commerce.Api
      Internal__PrivateKey: ${INTERNAL_KEY_HBA_COMMERCE_API:?INTERNAL_KEY_HBA_COMMERCE_API est obligatoire}
      Internal__PublicKeys: ${INTERNAL_PUBLIC_KEYS:?INTERNAL_PUBLIC_KEYS est obligatoire}
      Authentication__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY est obligatoire}
      Authentication__Issuer: hba-identity
      Authentication__Audience: hba-platform

    depends_on:
      redis:
        condition: service_healthy

      catalog-service:
        condition: service_started

      inventory-service:
        condition: service_started

      kafka:
        condition: service_started

    networks:
      - hba-backend

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  order-service:
    image: ${REGISTRY:-ghcr.io/hba}/order-service:${ORDER_VERSION:-latest}
    container_name: hba-order
    restart: unless-stopped

    env_file:
      - path: ./env/order.env
        required: false

    environment:
      Hosting__HttpPort: "8080"
      Hosting__GrpcPort: "8081"
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}

      ConnectionStrings__Default: >
        Host=postgres;
        Port=5432;
        Database=hba_order;
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD}

      Kafka__BootstrapServers: kafka:29092

      # Export OTLP — voir l'encadré du premier service de ce fichier.
      OpenTelemetry__Endpoint: ${OTEL_ENDPOINT:-http://otel-collector:4317}

      # ABSENTE JUSQU'ICI, ET AUCUN APPEL gRPC D'order-service N'ABOUTISSAIT.
      #
      # `InternalCallServerInterceptor` refuse tout appel quand la clé est vide,
      # et `InternalCallClientInterceptor` n'en joint aucune : order-service ne
      # pouvait donc NI servir `GetSellerSalesCount`, NI appeler inventory,
      # financial, delivery, food, commerce ou merchant — c'est-à-dire tout le
      # parcours de commande. Les douze autres services l'avaient.
      Internal__ApiKey: ${INTERNAL_API_KEY:?INTERNAL_API_KEY est obligatoire}

      # Identité d'appelant gRPC — encadré complet chez identity-service.
      Internal__ServiceName: HBA.Order.Api
      Internal__PrivateKey: ${INTERNAL_KEY_HBA_ORDER_API:?INTERNAL_KEY_HBA_ORDER_API est obligatoire}
      Internal__PublicKeys: ${INTERNAL_PUBLIC_KEYS:?INTERNAL_PUBLIC_KEYS est obligatoire}

      Services__Inventory: http://inventory-service:8081
      Services__Financial: http://financial-service:8081
      Services__Delivery: http://delivery-service:8081
      Services__Food: http://food-service:8081

      # ABSENT JUSQU'ICI, ET `AddCommerceGrpcClient` LÈVE SI L'ADRESSE MANQUE.
      #
      # order-service lit le panier valorisé au checkout. La clé n'était déclarée
      # nulle part : `MerchantsGrpcRegistration` et son équivalent Commerce lèvent
      # `InvalidOperationException` À LA CONSTRUCTION DE L'HÔTE — le conteneur
      # sort avant la première requête, sans passer par les sondes.
      Services__Commerce: http://commerce-service:8081

      # Autorisation de `GET /api/sellers/{sellerId}/orders` : la correspondance
      # utilisateur → vendeur n'existe que chez merchant-service.
      Services__Merchant: http://merchant-service:8081

    depends_on:
      postgres:
        condition: service_healthy

      kafka:
        condition: service_started

    networks:
      - hba-backend

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  food-service:
    image: ${REGISTRY:-ghcr.io/hba}/food-service:${FOOD_VERSION:-latest}
    build:
      context: ../../..
      dockerfile: services/food/restaurant-service/Dockerfile
    container_name: hba-food
    restart: unless-stopped

    env_file:
      - path: ./env/food.env
        required: false

    environment:
      Hosting__HttpPort: "8080"
      Hosting__GrpcPort: "8081"
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}

      ConnectionStrings__Default: >
        Host=postgres;
        Port=5432;
        Database=hba_food;
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD}

      Kafka__BootstrapServers: kafka:29092

      # Export OTLP — voir l'encadré du premier service de ce fichier.
      OpenTelemetry__Endpoint: ${OTEL_ENDPOINT:-http://otel-collector:4317}
      Redis__ConnectionString: redis:6379,password=${REDIS_PASSWORD}

      Services__Media: http://media-service:8081

      # ═══════════════════════════════════════════════════════════════════
      # CES TROIS ADRESSES MANQUAIENT, ET food-service NE DÉMARRAIT PAS.
      #
      # `Program.cs` appelle `AddOrderingGrpcClient`, `AddInventoryGrpcClient`
      # et `AddDeliveryGrpcClient`. Chacun fait
      # `configuration["Services:X"] ?? throw new InvalidOperationException`
      # — c'est-à-dire une levée À LA CONSTRUCTION DE L'HÔTE, avant que le
      # serveur n'existe.
      #
      # Le conteneur sort donc immédiatement, et AUCUNE SONDE NE LE DIT :
      # `/health/live` ne répond jamais, parce qu'il n'y a personne pour
      # répondre. C'est la panne la plus difficile à lire dans un journal
      # partagé par quatorze conteneurs.
      #
      # RÈGLE : tout `AddXxxGrpcClient` ajouté dans un `Program.cs` exige
      # sa ligne `Services__Xxx` ici, le même jour. La correspondance des
      # noms n'est pas systématique — `AddOrderingGrpcClient` lit
      # `Services:Order`, `AddMerchantsGrpcClient` lit `Services:Merchant`,
      # `AddProductsGrpcClient` lit `Services:Catalog`.
      # ═══════════════════════════════════════════════════════════════════
      Services__Order: http://order-service:8081
      Services__Inventory: http://inventory-service:8081
      Services__Delivery: http://delivery-service:8081

      # QUATRIÈME, AJOUTÉE AVEC `AddMerchantsGrpcClient` — LE MÊME JOUR, comme
      # l'exige la règle ci-dessus. La route qui rattache le dossier vendeur de
      # reversement à un établissement doit vérifier que ce dossier appartient au
      # porteur du jeton. Sans cette ligne, food-service ne démarre plus du tout.
      Services__Merchant: http://merchant-service:8081

      Internal__ApiKey: ${INTERNAL_API_KEY:?INTERNAL_API_KEY est obligatoire}

      # Identité d'appelant gRPC — encadré complet chez identity-service.
      Internal__ServiceName: HBA.Food.Restaurant.Api
      Internal__PrivateKey: ${INTERNAL_KEY_HBA_FOOD_RESTAURANT_API:?INTERNAL_KEY_HBA_FOOD_RESTAURANT_API est obligatoire}
      Internal__PublicKeys: ${INTERNAL_PUBLIC_KEYS:?INTERNAL_PUBLIC_KEYS est obligatoire}
      Authentication__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY est obligatoire}
      Authentication__Issuer: hba-identity
      Authentication__Audience: hba-platform

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      kafka:
        condition: service_started

    networks:
      - hba-backend

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  delivery-service:
    image: ${REGISTRY:-ghcr.io/hba}/delivery-service:${DELIVERY_VERSION:-latest}
    build:
      context: ../../..
      dockerfile: services/delivery/delivery-service/Dockerfile
    container_name: hba-delivery
    restart: unless-stopped

    env_file:
      - path: ./env/delivery.env
        required: false

    environment:
      Hosting__HttpPort: "8080"
      Hosting__GrpcPort: "8081"
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}

      ConnectionStrings__Default: >
        Host=postgres;
        Port=5432;
        Database=hba_delivery;
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD}

      Redis__ConnectionString: redis:6379,password=${REDIS_PASSWORD}
      Kafka__BootstrapServers: kafka:29092

      # Export OTLP — voir l'encadré du premier service de ce fichier.
      OpenTelemetry__Endpoint: ${OTEL_ENDPOINT:-http://otel-collector:4317}

      Services__Media: http://media-service:8081
      Internal__ApiKey: ${INTERNAL_API_KEY:?INTERNAL_API_KEY est obligatoire}

      # Identité d'appelant gRPC — encadré complet chez identity-service.
      Internal__ServiceName: HBA.Delivery.Core.Api
      Internal__PrivateKey: ${INTERNAL_KEY_HBA_DELIVERY_CORE_API:?INTERNAL_KEY_HBA_DELIVERY_CORE_API est obligatoire}
      Internal__PublicKeys: ${INTERNAL_PUBLIC_KEYS:?INTERNAL_PUBLIC_KEYS est obligatoire}
      Authentication__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY est obligatoire}
      Authentication__Issuer: hba-identity
      Authentication__Audience: hba-platform

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      kafka:
        condition: service_started

    networks:
      - hba-backend

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  financial-service:
    image: ${REGISTRY:-ghcr.io/hba}/financial-service:${FINANCIAL_VERSION:-latest}
    container_name: hba-financial
    restart: unless-stopped

    env_file:
      - path: ./env/financial.env
        required: false

    environment:
      Hosting__HttpPort: "8080"
      Hosting__GrpcPort: "8081"
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}

      ConnectionStrings__Default: >
        Host=postgres;
        Port=5432;
        Database=hba_financial;
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD}

      Kafka__BootstrapServers: kafka:29092

      # Export OTLP — voir l'encadré du premier service de ce fichier.
      OpenTelemetry__Endpoint: ${OTEL_ENDPOINT:-http://otel-collector:4317}

      # Autorisation de `GET /api/financial/wallets/drivers/{driverId}` : la
      # correspondance utilisateur → livreur n'existe que chez delivery-service.
      # `AddDeliveryGrpcClient` LÈVE À LA CONSTRUCTION DE L'HÔTE si l'adresse
      # manque — le conteneur sort avant la première requête, sans passer par
      # les sondes.
      Services__Delivery: http://delivery-service:8081

      # ═══════════════════════════════════════════════════════════════════
      # TROIS AUTRES MANQUAIENT — financial-service NE DÉMARRAIT PAS.
      #
      # Le service qui tient l'argent appelle quatre voisins et n'en déclarait
      # qu'un. `AddOrderingGrpcClient` (commande d'un paiement),
      # `AddFoodGrpcClient` et `AddMerchantsGrpcClient` (autorisation des
      # routes vendeur) lèvent tous à la construction de l'hôte.
      #
      # ATTENTION AUX NOMS : `AddOrderingGrpcClient` lit `Services:Order`,
      # `AddMerchantsGrpcClient` lit `Services:Merchant`. Le nom de la méthode
      # ne donne pas la clé.
      # ═══════════════════════════════════════════════════════════════════
      Services__Order: http://order-service:8081
      Services__Food: http://food-service:8081
      Services__Merchant: http://merchant-service:8081

      # ABSENTS AUSSI, ET LEUR MANQUE NE SE VOIT PAS AU DÉMARRAGE.
      #
      # Sans `Internal__ApiKey`, `InternalCallServerInterceptor` répond
      # `Unavailable` à TOUT appel gRPC entrant, et les appels sortants
      # partent sans clé — donc rejetés par les voisins. Sans la clé de
      # signature, aucun jeton n'est validé : toutes les routes rendent 401.
      # Le conteneur, lui, démarre et se déclare sain.
      Internal__ApiKey: ${INTERNAL_API_KEY:?INTERNAL_API_KEY est obligatoire}

      # Identité d'appelant gRPC — encadré complet chez identity-service.
      Internal__ServiceName: HBA.Financial.Api
      Internal__PrivateKey: ${INTERNAL_KEY_HBA_FINANCIAL_API:?INTERNAL_KEY_HBA_FINANCIAL_API est obligatoire}
      Internal__PublicKeys: ${INTERNAL_PUBLIC_KEYS:?INTERNAL_PUBLIC_KEYS est obligatoire}
      Authentication__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY est obligatoire}
      Authentication__Issuer: hba-identity
      Authentication__Audience: hba-platform

    depends_on:
      postgres:
        condition: service_healthy

      kafka:
        condition: service_started

    networks:
      - hba-backend

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  engagement-service:
    image: ${REGISTRY:-ghcr.io/hba}/engagement-service:${ENGAGEMENT_VERSION:-latest}
    container_name: hba-engagement
    restart: unless-stopped

    env_file:
      - path: ./env/engagement.env
        required: false

    environment:
      Hosting__HttpPort: "8080"
      Hosting__GrpcPort: "8081"
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}

      ConnectionStrings__Default: >
        Host=postgres;
        Port=5432;
        Database=hba_engagement;
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD}

      Kafka__BootstrapServers: kafka:29092

      # Export OTLP — voir l'encadré du premier service de ce fichier.
      OpenTelemetry__Endpoint: ${OTEL_ENDPOINT:-http://otel-collector:4317}

      # MANQUAIT, ALORS QUE CE SERVICE MET EN CACHE.
      #
      # `ReviewQueries` cache les notes agrégées d'un produit et d'un vendeur.
      # Sans cette clé, chaque réplique gardait la sienne : un avis publié ne
      # rafraîchissait la note que sur l'instance qui l'avait traité.
      Redis__ConnectionString: redis:6379,password=${REDIS_PASSWORD}

      Services__Catalog: http://catalog-service:8081
      Services__Food: http://food-service:8081

      # MANQUAIT — engagement-service NE DÉMARRAIT PAS.
      #
      # `AddOrderingGrpcClient` sert à vérifier qu'un auteur d'avis a bien
      # acheté ce qu'il note. Sa clé est `Services:Order`, pas « Ordering ».
      Services__Order: http://order-service:8081

      # MÊME PIÈGE QUE CI-DESSUS, MÊME CONSÉQUENCE.
      #
      # `AddMerchantsGrpcClient` lève à la construction de l'hôte quand cette
      # clé manque. Elle sert à savoir si le porteur du jeton est bien LE
      # vendeur de l'avis auquel il répond — sans quoi la route était ouverte à
      # tout compte inscrit, acheteurs compris.
      Services__Merchant: http://merchant-service:8081

      # Même remarque que pour financial : sans ces deux-là le conteneur
      # démarre, se déclare sain, et rejette tout — gRPC entrant en
      # `Unavailable`, routes HTTP en 401.
      Internal__ApiKey: ${INTERNAL_API_KEY:?INTERNAL_API_KEY est obligatoire}

      # Identité d'appelant gRPC — encadré complet chez identity-service.
      Internal__ServiceName: HBA.Engagement.Api
      Internal__PrivateKey: ${INTERNAL_KEY_HBA_ENGAGEMENT_API:?INTERNAL_KEY_HBA_ENGAGEMENT_API est obligatoire}
      Internal__PublicKeys: ${INTERNAL_PUBLIC_KEYS:?INTERNAL_PUBLIC_KEYS est obligatoire}
      Authentication__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY est obligatoire}
      Authentication__Issuer: hba-identity
      Authentication__Audience: hba-platform

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      kafka:
        condition: service_started

    networks:
      - hba-backend

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  communication-service:
    image: ${REGISTRY:-ghcr.io/hba}/communication-service:${COMMUNICATION_VERSION:-latest}

    build:
      context: ../../..
      dockerfile: services/common/notification-service/Dockerfile
    container_name: hba-communication
    restart: unless-stopped

    env_file:
      - path: ./env/communication.env
        required: false

    environment:
      Hosting__HttpPort: "8080"
      Hosting__GrpcPort: "8081"
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}

      ConnectionStrings__Default: >
        Host=postgres;
        Port=5432;
        Database=hba_communication;
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD}

      Kafka__BootstrapServers: kafka:29092

      # Export OTLP — voir l'encadré du premier service de ce fichier.
      OpenTelemetry__Endpoint: ${OTEL_ENDPOINT:-http://otel-collector:4317}

      # SECRETS D'ORCHESTRATEUR — JAMAIS DANS LE DÉPÔT.
      #
      # `${VAR:?}` sur la clé Resend : en Production, l'absence de canal e-mail
      # fait de toute façon échouer le démarrage plus loin, dans l'installer.
      # Autant que le compose le dise tout de suite, en nommant la variable.
      #
      # FCM reste optionnel : sans lui, pas de push, mais personne n'est bloqué.
      Notifications__Email__ApiKey: ${RESEND_API_KEY:?RESEND_API_KEY est obligatoire}
      Notifications__Email__From: ${EMAIL_FROM:?EMAIL_FROM est obligatoire}
      Notifications__Email__AppBaseUrl: ${APP_BASE_URL:?APP_BASE_URL est obligatoire}

      Notifications__Fcm__ServiceAccountJson: ${FCM_SERVICE_ACCOUNT_JSON:-}
      Notifications__Fcm__ServiceAccountPath: ${FCM_SERVICE_ACCOUNT_PATH:-}
      Internal__ApiKey: ${INTERNAL_API_KEY:?INTERNAL_API_KEY est obligatoire}

      # Identité d'appelant gRPC — encadré complet chez identity-service.
      Internal__ServiceName: HBA.Communication.Api
      Internal__PrivateKey: ${INTERNAL_KEY_HBA_COMMUNICATION_API:?INTERNAL_KEY_HBA_COMMUNICATION_API est obligatoire}
      Internal__PublicKeys: ${INTERNAL_PUBLIC_KEYS:?INTERNAL_PUBLIC_KEYS est obligatoire}
      Authentication__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY est obligatoire}
      Authentication__Issuer: hba-identity
      Authentication__Audience: hba-platform

      # ═══════════════════════════════════════════════════════════════════
      # LES CINQ MANQUAIENT — communication-service NE DÉMARRAIT PAS.
      #
      # C'est le service qui a le plus de voisins, et il n'en déclarait aucun.
      # Il interroge le catalogue (nom du produit dans un message), le vendeur
      # (à qui écrire), identity (l'adresse), la commande (son contenu) et la
      # course (le suivi). Sans ces adresses, aucune notification ne part —
      # mais surtout, le conteneur ne démarre pas du tout.
      #
      # `AddProductsGrpcClient` lit `Services:Catalog`, et non
      # « Services:Products » : le module Products n'a jamais été extrait, son
      # contrat est servi par catalog-service. Le commentaire de `Program.cs`
      # le dit ; la clé le trahit.
      # ═══════════════════════════════════════════════════════════════════
      Services__Catalog: http://catalog-service:8081
      Services__Merchant: http://merchant-service:8081
      Services__Identity: http://identity-service:8081
      Services__Order: http://order-service:8081
      Services__Delivery: http://delivery-service:8081

    depends_on:
      postgres:
        condition: service_healthy

      kafka:
        condition: service_started

    networks:
      - hba-backend

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  media-service:
    image: ${REGISTRY:-ghcr.io/hba}/media-service:${MEDIA_VERSION:-latest}

    # Les trois services extraits se construisent localement : leur image n'est
    # dans aucun registre. Le contexte est `HBA/` — voir l'avertissement en tête
    # du Dockerfile : les projets de `shared/` vivent hors du service.
    build:
      context: ../../..
      dockerfile: services/common/media-service/Dockerfile
    container_name: hba-media
    restart: unless-stopped

    env_file:
      - path: ./env/media.env
        required: false

    environment:
      # ASPNETCORE_URLS retiré : `ListenAnyIP` dans le code le rend inopérant.
      Hosting__HttpPort: "8080"
      Hosting__GrpcPort: "8081"
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}

      ConnectionStrings__Default: >
        Host=postgres;
        Port=5432;
        Database=hba_media;
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD}

      Kafka__BootstrapServers: kafka:29092

      # Export OTLP — voir l'encadré du premier service de ce fichier.
      OpenTelemetry__Endpoint: ${OTEL_ENDPOINT:-http://otel-collector:4317}

      ObjectStorage__Endpoint: http://minio:9000
      ObjectStorage__AccessKey: ${MINIO_ROOT_USER}
      ObjectStorage__SecretKey: ${MINIO_ROOT_PASSWORD}
      ObjectStorage__UseSsl: "false"

      # Secrets d'orchestrateur, jamais versionnés. La clé de signature est
      # SYMÉTRIQUE : qui la lit forge des jetons Admin. La clé interne ouvre
      # les routes /internal/* de TOUS les services.
      Internal__ApiKey: ${INTERNAL_API_KEY:?INTERNAL_API_KEY est obligatoire}

      # Identité d'appelant gRPC — encadré complet chez identity-service.
      Internal__ServiceName: HBA.Media.Api
      Internal__PrivateKey: ${INTERNAL_KEY_HBA_MEDIA_API:?INTERNAL_KEY_HBA_MEDIA_API est obligatoire}
      Internal__PublicKeys: ${INTERNAL_PUBLIC_KEYS:?INTERNAL_PUBLIC_KEYS est obligatoire}
      Authentication__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY est obligatoire}
      Authentication__Issuer: hba-identity
      Authentication__Audience: hba-platform

    depends_on:
      postgres:
        condition: service_healthy

      kafka:
        condition: service_started

      minio:
        condition: service_started

    networks:
      - hba-backend

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

networks:

  hba-backend:
    external: true

  hba-proxy:
    external: true
