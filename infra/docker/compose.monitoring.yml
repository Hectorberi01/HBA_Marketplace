services:

  prometheus:
    image: prom/prometheus:latest
    container_name: hba-prometheus
    restart: unless-stopped

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"

    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    networks:
      - hba-backend
      - hba-monitoring

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:9090/-/healthy || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 5


  grafana:
    image: grafana/grafana:latest
    container_name: hba-grafana
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN}

    volumes:
      - grafana_data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

    networks:
      - hba-monitoring
      - hba-proxy

    depends_on:
      prometheus:
        condition: service_healthy

      loki:
        condition: service_started

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`${GRAFANA_DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"


  loki:
    image: grafana/loki:latest
    container_name: hba-loki
    restart: unless-stopped

    command:
      - "-config.file=/etc/loki/loki.yml"

    volumes:
      - ../observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki

    networks:
      - hba-monitoring

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:3100/ready || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: hba-otel-collector
    restart: unless-stopped

    command:
      - "--config=/etc/otelcol/config.yml"

    volumes:
      - ../observability/otel/otel-collector.yml:/etc/otelcol/config.yml:ro

    networks:
      - hba-backend
      - hba-monitoring

    depends_on:
      prometheus:
        condition: service_healthy

      loki:
        condition: service_started


volumes:

  prometheus_data:
    name: hba-prometheus-data

  grafana_data:
    name: hba-grafana-data

  loki_data:
    name: hba-loki-data


networks:

  hba-backend:
    external: true

  hba-proxy:
    external: true

  hba-monitoring:
    name: hba-monitoring
