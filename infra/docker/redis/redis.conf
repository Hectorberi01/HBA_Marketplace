############################################
# HBA REDIS
############################################

# Redis écoute sur toutes les interfaces du conteneur.
bind 0.0.0.0

# Port interne Docker
port 6379

# Pas de mode protégé car Redis reste uniquement
# accessible sur le réseau Docker privé.
protected-mode no

############################################
# AUTHENTIFICATION
############################################

# Le mot de passe sera injecté au démarrage avec :
# redis-server /usr/local/etc/redis/redis.conf
#              --requirepass "${REDIS_PASSWORD}"
#
# Ne mets donc PAS le vrai mot de passe ici.

############################################
# PERSISTENCE
############################################

# Active AOF pour conserver les données après redémarrage.
appendonly yes

# fsync chaque seconde :
# bon compromis performance / durabilité.
appendfsync everysec

# Réécriture automatique du fichier AOF.
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

############################################
# SNAPSHOTS RDB
############################################

# On garde également quelques snapshots de sécurité.
save 900 1
save 300 10
save 60 10000

dbfilename dump.rdb

dir /data

############################################
# MÉMOIRE
############################################

# À adapter à la RAM du VPS.
#
# Exemple VPS 8 Go :
# maxmemory 1gb
#
# Exemple VPS 16 Go :
# maxmemory 2gb

maxmemory 1gb

# Pour HBA, Redis sert principalement au cache,
# panier, tracking GPS et données temporaires.
#
# allkeys-lru permet d'éliminer les clés les moins
# récemment utilisées lorsque la mémoire est pleine.
maxmemory-policy allkeys-lru

############################################
# BASES LOGIQUES
############################################

# On utilise surtout des préfixes de clés,
# mais on peut conserver les 16 DB Redis par défaut.
databases 16

############################################
# CLIENTS
############################################

maxclients 10000

# Déconnexion d'un client inactif après 5 minutes.
# Mets 0 si tu veux désactiver ce comportement.
timeout 300

tcp-keepalive 60

############################################
# PERFORMANCE
############################################

tcp-backlog 511

hz 10

dynamic-hz yes

############################################
# LOGGING
############################################

loglevel notice

# Docker collecte stdout.
logfile ""

############################################
# SÉCURITÉ
############################################

# Désactive certaines commandes dangereuses.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command SHUTDOWN ""

############################################
# LATENCE
############################################

latency-monitor-threshold 100

############################################
# FIN
############################################
